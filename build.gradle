plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    group   = 'com.queueplatform'
    version = '1.0.0'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    repositories {
        mavenCentral()
    }

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.3.4"
        }
    }

    dependencies {
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    test {
        useJUnitPlatform()

        // 테스트 JVM도 운영과 같은 UTC로 돌린다.
        //
        // @SpringBootTest는 *Application.main()을 타지 않으므로 거기서 건 TimeZone.setDefault(UTC)가
        // 적용되지 않는다. 이 줄이 없으면 테스트는 호스트 TZ(개발자 KST / CI UTC)로 돌아,
        // 같은 코드가 환경에 따라 다른 시각을 쓰는데도 아무도 못 잡는다. (DECISIONS §77)
        systemProperty 'user.timezone', 'UTC'
    }
}

ext {
    set('lombokVersion',     '1.18.32')
}