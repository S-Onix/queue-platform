# Alertmanager — Prometheus 가 발화한 알람이 **모이는 곳**.
#
# 왜 필요한가: 규칙 21개가 있는데 `alerting:` 블록이 없어 **갈 데가 없었다.**
# Prometheus 단독으로도 규칙은 평가되지만(웹 UI 의 Alerts 탭에 뜬다), 그건 사람이 그 화면을
# 보고 있을 때만이다. 2026-09-15 판정에서 "기능은 됐고 운영은 아니다"의 첫 번째 근거가 이것이다.
#
# 🔴 **Webhook URL 을 이 파일에 적지 마라. 레포가 PUBLIC 이다.**
#    Alertmanager 는 설정 파일에서 환경변수를 치환하지 않는다(Prometheus 와 같다). 그래서
#    `slack_api_url_file` 로 **파일 참조**를 쓴다 — deploy.sh 가 .env 의 SLACK_WEBHOOK_URL 을
#    노드에 쓰고, 컨테이너는 그 파일을 읽는다. 파일이 없으면 기동은 되고 통지만 실패한다.
#    🪤 그 파일은 **nobody(65534) 가 읽을 수 있어야 한다**. 600 + ubuntu 소유면
#       `permission denied` 로 통지만 조용히 죽는다 — deploy.sh 가 chown 까지 한다.
#
# 확인 수단 둘:
#   curl -s localhost:9093/api/v2/alerts                       ← 여기까지 왔는가
#   curl -s localhost:9090/api/v1/query --data-urlencode \
#     'query=alertmanager_notifications_failed_total'          ← Slack 으로 나갔는가

global:
  # 해소된 알람을 언제까지 "아직 안 죽었다"로 볼지. 스크레이프 5s · 평가 15s 라 넉넉하다.
  resolve_timeout: 2m
  # 🔑 값이 아니라 **경로**다. deploy.sh 가 채운다(.env 의 SLACK_WEBHOOK_URL).
  slack_api_url_file: /etc/alertmanager/slack_url

route:
  # 같은 알람이 인스턴스마다 따로 오면 6통이 된다. 이름과 심각도로 묶는다.
  group_by: ['alertname', 'severity']
  # 첫 통지까지 기다리는 시간. 같은 사건의 동반 알람(예: 노드가 죽으면 up 계열이 우르르)을
  # 한 통으로 합치려는 것이다.
  group_wait: 30s
  group_interval: 5m
  # 안 고쳐진 알람을 다시 알리는 주기. 4시간은 부하 실측 한 판(1시간)보다 길어
  # **한 판에 한 번만** 온다.
  repeat_interval: 4h
  receiver: default

  routes:
    # critical 은 묶지 말고 빨리 보낸다. 실측 중 Redis maxmemory·복제 정지가 여기다.
    - matchers: [severity="critical"]
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # 🔑 노드가 죽으면 그 노드의 모든 익스포터가 같이 죽는다. 원인 하나에 통지 6통이 오면
  #    사람이 원인을 못 고른다 — 상위 알람이 하위를 덮는다.
  - source_matchers: [alertname="AppInstanceDown"]
    target_matchers: [severity="warning"]
    equal: ['instance']
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['alertname', 'instance']

receivers:
  - name: default
    slack_configs:
      # 🪤 send_resolved 를 켠다. 안 켜면 "터졌다"만 오고 **"해결됐다"가 안 와서**
      #    사람이 계속 열려 있는 줄 안다 — 그 상태로 다음 판을 시작하면 알람을 무시하게 된다.
      - send_resolved: true
        # 🪤 이 값은 사실상 **문서다.** Slack 이 구 방식의 채널 오버라이드를 막아서, 실제로는
        #    **웹훅을 발급할 때 고른 채널**로 간다. 그래도 맞춰 둔다 — 어긋나 있으면 다음 사람이
        #    여기를 고치고 "왜 안 바뀌지"로 시간을 쓴다.
        channel: '#alerts'
        # 🔑 여기는 **Alertmanager 의 Go 템플릿**이라 중괄호가 정상이다.
        #    (Prometheus 의 annotation 과 헷갈리지 마라 — 거기 중괄호를 넣으면 렌더가 깨진다)
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        # 링크는 전부 SSH 터널 안에서만 닿는다(SG 는 내 IP 의 22 만 연다):
        #   ssh -i ~/.ssh/queue-aws -L 3300:localhost:3000 -L 9090:localhost:9090 \
        #       -L 9093:localhost:9093 ubuntu@<mysql 노드 퍼블릭 IP>
        #
        # 🪤 **Grafana 를 3300 으로 받는 이유.** 로컬에 Grafana 가 이미 3000 을 잡고 있어서
        #    `-L 3000:...` 은 바인드에 실패하는데, **SSH 는 경고 한 줄만 찍고 접속은 유지한다.**
        #    그러면 브라우저에 로컬 Grafana 가 떠서 그걸 AWS 로 착각한다(4차 실측에서 실제로
        #    당했다). 판별은 버전이다 — `/api/health` 가 13.x 면 로컬, 11.3.1 이면 AWS.
        title_link: 'http://localhost:9090/alerts'
        text: |-
          {{ range .Alerts }}*{{ .Labels.severity | toUpper }}* {{ .Annotations.summary }}
          {{ if .Annotations.action }}*조치*: {{ .Annotations.action }}
          {{ end }}{{ end }}
        # 🔑 버튼 셋. 알람을 받은 사람이 **다음에 눌러야 할 것**을 고르게 한다 —
        #    주소를 기억해 두는 곳을 런북 하나로 줄인다.
        actions:
          - type: button
            text: '대시보드'
            url: 'http://localhost:3300/d/queue-platform-local'
          - type: button
            text: '알람 목록'
            url: 'http://localhost:9090/alerts'
          - type: button
            text: '알림 끄기(silence)'
            url: 'http://localhost:9093/#/silences/new'
