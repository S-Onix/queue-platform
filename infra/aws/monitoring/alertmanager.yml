# Alertmanager — Prometheus 가 발화한 알람이 **모이는 곳**.
#
# 왜 필요한가: 규칙 21개가 있는데 `alerting:` 블록이 없어 **갈 데가 없었다.**
# Prometheus 단독으로도 규칙은 평가되지만(웹 UI 의 Alerts 탭에 뜬다), 그건 사람이 그 화면을
# 보고 있을 때만이다. 2026-09-15 판정에서 "기능은 됐고 운영은 아니다"의 첫 번째 근거가 이것이다.
#
# 🔴 **Webhook URL 을 이 파일에 적지 마라. 레포가 PUBLIC 이다.**
#    Alertmanager 는 설정 파일에서 환경변수를 치환하지 않는다(Prometheus 와 같다). 그래서
#    `slack_api_url_file` 로 **파일 참조**를 쓴다 — deploy.sh 가 .env 의 SLACK_WEBHOOK_URL 을
#    노드에 쓰고, 컨테이너는 그 파일을 읽는다. 파일이 없으면 기동은 되고 통지만 실패한다.
#    🪤 그 파일은 **nobody(65534) 가 읽을 수 있어야 한다**. 600 + ubuntu 소유면
#       `permission denied` 로 통지만 조용히 죽는다 — deploy.sh 가 chown 까지 한다.
#
# 확인 수단 둘:
#   curl -s localhost:9093/api/v2/alerts                       ← 여기까지 왔는가
#   curl -s localhost:9090/api/v1/query --data-urlencode \
#     'query=alertmanager_notifications_failed_total'          ← Slack 으로 나갔는가

global:
  # 해소된 알람을 언제까지 "아직 안 죽었다"로 볼지. 스크레이프 5s · 평가 15s 라 넉넉하다.
  resolve_timeout: 2m
  # 🔑 값이 아니라 **경로**다. deploy.sh 가 채운다(.env 의 SLACK_WEBHOOK_URL).
  slack_api_url_file: /etc/alertmanager/slack_url

route:
  # 같은 알람이 인스턴스마다 따로 오면 6통이 된다. 이름과 심각도로 묶는다.
  group_by: ['alertname', 'severity']
  # 첫 통지까지 기다리는 시간. 같은 사건의 동반 알람(예: 노드가 죽으면 up 계열이 우르르)을
  # 한 통으로 합치려는 것이다.
  group_wait: 30s
  group_interval: 5m
  # 안 고쳐진 알람을 다시 알리는 주기. 4시간은 부하 실측 한 판(1시간)보다 길어
  # **한 판에 한 번만** 온다.
  repeat_interval: 4h
  receiver: default

  routes:
    # critical 은 묶지 말고 빨리 보낸다. 실측 중 Redis maxmemory·복제 정지가 여기다.
    - matchers: [severity="critical"]
      receiver: default
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  # 🔑 노드가 죽으면 그 노드의 모든 익스포터가 같이 죽는다. 원인 하나에 통지 6통이 오면
  #    사람이 원인을 못 고른다 — 상위 알람이 하위를 덮는다.
  - source_matchers: [alertname="AppInstanceDown"]
    target_matchers: [severity="warning"]
    equal: ['instance']
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ['alertname', 'instance']

receivers:
  - name: default
    slack_configs:
      # 🪤 send_resolved 를 켠다. 안 켜면 "터졌다"만 오고 **"해결됐다"가 안 와서**
      #    사람이 계속 열려 있는 줄 안다 — 그 상태로 다음 판을 시작하면 알람을 무시하게 된다.
      - send_resolved: true
        # 🪤 이 값은 사실상 **문서다.** Slack 이 구 방식의 채널 오버라이드를 막아서, 실제로는
        #    **웹훅을 발급할 때 고른 채널**로 간다. 그래도 맞춰 둔다 — 어긋나 있으면 다음 사람이
        #    여기를 고치고 "왜 안 바뀌지"로 시간을 쓴다.
        channel: '#alerts'
        # 🔑 여기는 **Alertmanager 의 Go 템플릿**이라 중괄호가 정상이다.
        #    (Prometheus 의 annotation 과 헷갈리지 마라 — 거기 중괄호를 넣으면 렌더가 깨진다)
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}'
        # 🔑 **링크는 obs 노드의 EIP 로 직접 간다**(2026-09-22). 전에는 전부 localhost 였고,
        #    그래서 새벽에 알람을 받은 운영자가 **SSH 터널부터 뚫어야** 화면을 봤다. 원인은
        #    링크가 아니라 인증이었다 — Grafana 가 익명 Admin 이라 내놓을 수가 없었다.
        #    이제 로그인이 붙었고(admin/admin), SG 가 운영자 IP /32 로 3000·9093 을 연다.
        # 🔴 **EIP 는 고정이지만 영원하지 않다.** 판을 부숴도 주소는 남지만, EIP 자체를 놓으면
        #    이 파일의 세 줄이 전부 죽은 주소를 가리킨다 — 그때 같이 고쳐라.
        #    (obs 에 EIP 를 붙인 이유가 이것이다: 링크를 판마다 고치지 않으려고)
        # 🪤 9090(Prometheus)은 **SG 에 열지 않았다** — 터널 전용이다. 알람 목록은 9093 의
        #    Alertmanager 로 보낸다. 규칙 정의를 봐야 할 때만 터널을 뚫는다.
        title_link: 'http://3.37.94.94:9093/#/alerts'
        # 🔑 **새벽에 받은 사람이 읽을 수 있어야 한다.** 한 문단에 뭉쳐 두면 아무도 안 읽는다.
        #    셋으로 나눈다 — 무슨 일이 났나 / 두면 뭐가 깨지나 / 뭘 하나.
        #    🪤 조치문은 규칙 파일에 `① … → ② …` 한 줄로 적혀 있다. 그걸 여기서 줄바꿈으로
        #       편다(reReplaceAll) — 규칙 23개를 다시 쓰지 않고 읽기만 고치는 방법이다.
        #    🪤 **Slack 은 마크다운이 아니라 mrkdwn 이다.** 굵게가 `**x**` 가 아니라 `*x*` 하나라
        #       규칙 파일에 쓴 마크다운이 별표 그대로 찍힌다. 여기서 변환한다 — 규칙 23개를
        #       Slack 전용으로 다시 쓰면 문서·Grafana·런북에서 그 표기가 깨진다.
        # 🔑 **한 통에 같은 알람 여러 건이 묶인다**(group_by: alertname). 그래서 상황은
        #    건별로 나열하고, 영향·조치는 **한 번만** 쓴다 — 큐 3개면 조치문이 3번 반복돼
        #    화면을 덮는다(2026-09-17 실제 화면에서 확인).
        #
        # 🪤 **문장 속 굵게는 포기한다.** Slack mrkdwn 은 `*x*` 인데 문장 중간에서는 렌더가
        #    들쭉날쭉해 별표가 글자로 찍힌다. 규칙 파일의 `**…**` 는 여기서 **지운다**
        #    (변환하지 않는다). 섹션 제목의 굵게는 정상 동작하므로 그것만 쓴다.
        text: |-
          {{ define "plain" }}{{ . | reReplaceAll "\\*\\*" "" }}{{ end }}
          *상황*{{ if gt (len .Alerts) 1 }} ({{ len .Alerts }}건){{ end }}
          {{ range .Alerts }}• {{ template "plain" .Annotations.summary }}
          {{ end }}{{ with (index .Alerts 0).Annotations.impact }}
          *이대로 두면*
          {{ template "plain" . }}
          {{ end }}{{ with (index .Alerts 0).Annotations.action }}
          *조치*
          {{ template "plain" (. | reReplaceAll " ?→ ?(②|③|④|⑤|⑥)" "\n$1" | reReplaceAll " (②|③|④|⑤|⑥) " "\n$1 " | reReplaceAll " ?(①)" "\n$1") }}
          {{ end }}
        # 🔑 버튼 셋. 알람을 받은 사람이 **다음에 눌러야 할 것**을 고르게 한다 —
        #    주소를 기억해 두는 곳을 런북 하나로 줄인다.
        actions:
          - type: button
            text: '대시보드'
            url: 'http://3.37.94.94:3000/d/queue-platform-local'
          - type: button
            text: '알람 목록'
            url: 'http://3.37.94.94:9093/#/alerts'
          - type: button
            text: '알림 끄기(silence)'
            url: 'http://3.37.94.94:9093/#/silences/new'
