# 부하 실측용 Prometheus. 3노드의 앱·호스트 지표를 긁는다.
#
# 🔑 타깃 IP 는 인스턴스마다 바뀌므로 여기 박지 않는다. file_sd 로 빼고
#    deploy.sh 가 targets/*.json 을 terraform output 으로 생성한다.
#    (Prometheus 는 설정 파일에서 환경변수를 치환하지 않는다 — 그래서 file_sd 다.)
global:
  scrape_interval: 5s      # 60초 측정이라 15s 면 표본이 4개뿐이다
  evaluation_interval: 15s

rule_files:
  # 🔑 **infra.yml 을 태운다 (2026-09-17 변경).** 옛 주석은 "redis_exporter·node_timex 를 안
  #    돌리니 영원히 안 뜨는 규칙만 늘어난다"였는데, 그 전제가 낡았다 — deploy.sh 가 지금은
  #    redis-exporter·node-exporter 를 함께 띄운다. 500만 판에서 봐야 하는
  #    RedisMemoryWillHitMaxmemory·DiskWillFill 이 바로 이 파일에 있다.
  #
  # ⚠️ **MySQL 계열 넷은 여전히 no-data 다** — mysqld-exporter 를 안 띄운다.
  #    (MysqlExporterCannotConnect · MysqlReplicationStopped · MysqlReplicationLagHigh ·
  #     up{job="mysqld"} 계열) 발화하지 않을 뿐 해롭지는 않다. 복제를 봐야 하면
  #    익스포터를 먼저 띄워라 — 규칙만 태우면 **조용한 초록**이 된다.
  - /etc/prometheus/rules/app.yml
  - /etc/prometheus/rules/infra.yml
  - /etc/prometheus/rules/kafka.yml

# 발화한 알람이 갈 곳. 없으면 규칙은 평가만 되고 **아무도 모른다** — 사람이 Prometheus 의
# Alerts 탭을 보고 있을 때만 알게 된다. host 네트워크라 같은 노드면 localhost 다.
alerting:
  alertmanagers:
    - static_configs: [{ targets: ['localhost:9093'] }]

scrape_configs:
  - job_name: queue-api
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/api.json] }]

  - job_name: queue-worker
    metrics_path: /actuator/prometheus
    file_sd_configs: [{ files: [/etc/prometheus/targets/worker.json] }]

  # 노드별 CPU·메모리·디스크. 1차 실측 이후 핵심 질문이 "api 가 코어를 몇 개 쓰는가"라
  # 이게 없으면 ssh + top 으로 훑는 수밖에 없다.
  - job_name: node
    file_sd_configs: [{ files: [/etc/prometheus/targets/node.json] }]

  # multi-target: 타깃 목록의 각 항목을 __param_target 으로 넘기고, 실제 접속은 익스포터로 한다.
  # 그래서 instance 라벨은 Redis 주소가, 스크레이프 대상은 익스포터가 된다.
  - job_name: redis
    metrics_path: /scrape
    file_sd_configs: [{ files: [/etc/prometheus/targets/redis.json] }]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9121   # host 네트워크라 Prometheus 와 같은 호스트다

  # 🔴 alerts/infra.yml 의 mysql_up · mysql_slave_status_* 규칙이 **대상이 없어 no-data** 였다.
  #    exporter 는 mysql 노드에서 돌고 Prometheus 는 obs 노드라 주소를 파일로 받는다.
  - job_name: mysql
    file_sd_configs: [{ files: [/etc/prometheus/targets/mysql.json] }]

  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  # 🔑 알림 경로 자체가 죽었을 때 그걸 알려줄 수 있는 건 이 시계열뿐이다
  #    (alertmanager_notifications_failed_total · alertmanager_cluster_health_score).
  - job_name: alertmanager
    static_configs: [{ targets: ['localhost:9093'] }]
