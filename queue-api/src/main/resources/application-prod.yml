# ============================================================================
# Production 환경 — 운영 서버
#
# - DB: 운영 DB (환경변수 필수, SSL 강제)
# - JWT: 환경변수 (Vault/Secret Manager에서 주입)
# - 로그: WARN 레벨 (성능 + 보안)
# - JPA: ddl-auto=validate (스키마 변경 절대 금지)
# - Actuator: 최소 노출 (보안)
# ============================================================================

spring:
  # 🔑 useLocalSessionState=true — 드라이버가 autocommit·isolation 을 서버에 되묻지 않는다.
  #    AWS 8차(500만) 전수 집계에서 이 왕복이 **쿼리 1,055만 건 / MySQL CPU 756초(예산 2.8%)** 였다.
  #    🪤 앱이 세션 변수를 직접 바꾸면 드라이버가 그것을 모른다 — 이 레포엔 그런 코드가 없다(전수 확인).
  datasource:
    # 🔴 socketTimeout=2000 · connectTimeout=3000 · lock_wait_timeout=10 (AWS 10차 실측 근거).
    #    예전엔 셋 다 없어 Connector/J 기본 0 = **무기한**이었고, 서버 lock_wait_timeout 도 365일이라
    #    양쪽에 시한이 없었다. 2,000ms 는 API 경로 최댓값 251ms(markCompleted)의 8배 여유다.
    #    🪤 socketTimeout 은 **서버의 쿼리를 죽이지 않는다** — 그래서 lock_wait_timeout 과 짝이다.
    #    🪤 innodb_lock_wait_timeout(행 락, 50초)은 그대로다. 여기선 socketTimeout 이 먼저 끊는다.
    master:
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=true&requireSSL=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=2000&sessionVariables=lock_wait_timeout=10
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      # 🔴 **풀 크기는 Little's law 로 정한다 — 크게 잡는 것이 안전한 게 아니다** (AWS 10차 실측).
      #    L = λ × W = 548/s × 9.41ms = **5.15 커넥션**(api 6대 합) = 인스턴스당 0.86개.
      #    그런데 예전 설정은 6×(50+50)=600 이었고, batch·consumer 를 더해 **640 > max_connections 500** 이라
      #    `Threads_connected 501` 로 한도를 채워 **연결 거절 8,296회**가 났다. 관리자 접속조차 막혔다.
      #    🪤 활성은 **1개**였다 — 트랜잭션이 길어서가 아니라 Hikari 의 `minimumIdle` 기본값이
      #       `maximumPoolSize` 라 **쓰지도 않는 커넥션을 최대치로 열어두기** 때문이다. 그래서 둘 다 적는다.
      maximum-pool-size: 20
      minimum-idle: 5
    replica:
      jdbc-url: jdbc:mysql://${DB_REPLICA_HOST}:${DB_REPLICA_PORT:3306}/queue_platform?useSSL=true&requireSSL=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=2000&sessionVariables=lock_wait_timeout=10
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      # replica 는 **앱이 읽는 경로가 0** 이다(master-replica-routing). 그런데 예전엔 50 을 열어
      # 커넥션의 43%(213개)를 점유했다. 빈 풀로 두지 않는 이유는 readOnly 트랜잭션이 새로 생길 때
      # 최소한 동작은 해야 하기 때문이다.
      # 🔴 **실측 판(infra/aws)에는 replica 인스턴스가 없다 — DB_REPLICA_HOST 가 master 를 가리킨다**
      #    (app.yml:28). 즉 이 풀은 분산이 아니라 **같은 MySQL 에 두 번 붙는 것**이고, 그래서
      #    한도(max_connections)를 두 배로 먹었다. "replica 니까 부하가 갈린다"고 읽지 마라.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate            # ⭐ 운영 절대 금지: update, create, create-drop
    show-sql: false                 # 운영 SQL 로그 차단 (성능 + 보안)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

queue:
  redis:
    cluster1:
      nodes: ${REDIS_CLUSTER1_NODES:redis-a-1:6379,redis-a-2:6379,redis-a-3:6379,redis-a-4:6379}
    cluster2:
      nodes: ${REDIS_CLUSTER2_NODES:redis-b-1:6379,redis-b-2:6379,redis-b-3:6379,redis-b-4:6379}

logging:
  level:
    root: WARN
    com.sonix.queue: INFO
    org.hibernate.SQL: WARN

# Actuator (운영)
management:
  # 🔴 **관리 포트를 분리한다 — 이것이 경계다**(2026-09-19, §actuator 게이트 해소).
  #    분리 전에는 공개 API 와 같은 8080 이라 actuator 가 곧 공개 표면이었다.
  #    그래서 게이트가 "관리 포트 분리 또는 스크레이퍼 ACL과 **함께** 켠다"였고, 이게 그 분리다.
  #
  # ✅ 실측으로 확인했다(2026-09-19, 앱 8099 · 관리 9099):
  #      9099/actuator/prometheus  200 (계열 246개)
  #      8099/actuator/health      **404**   ← 공개 포트에서 통째로 사라진다
  #      8099/actuator/prometheus  **404**
  #      8099 공개 API            정상 도달
  #
  # 🔴 **관리 포트에는 SecurityConfig 가 적용되지 않는다**(별도 컨텍스트다 — 실측 200).
  #    즉 인증이 아니라 **네트워크가 유일한 문**이다. AWS 는 SG 가 인터넷 ingress 를 하나도
  #    열지 않으므로(SSH /32 만) 그 문이 이미 닫혀 있다 — terraform 이 그 근거다.
  #    🪤 SG 를 느슨하게 바꾸는 순간 이 포트가 그대로 열린다. 두 파일을 같이 봐라.
  #
  # 🪤 주소를 127.0.0.1 로 묶지 않는다 — AWS 의 Prometheus 는 **obs 노드**에 있어서
  #    루프백으로 묶으면 스크레이프가 통째로 실패한다. 로컬만 보고 묶지 마라.
  server:
    port: ${MANAGEMENT_PORT:9080}
  endpoints:
    web:
      exposure:
        # 🔑 prometheus 를 여기서 켠다. 위 경계와 **함께** 켜는 것이 게이트 조건이었다.
        #    🪤 percentiles-histogram 이 켜져 있어 응답이 크다(계열 246개) — 스크레이프 주기를
        #       줄이면 그게 곧 부하다. 5s 는 obs 노드가 전담하는 전제에서의 값이다.
        include: health, info, prometheus
  endpoint:
    health:
      show-details: never           # 운영: 헬스 상세 정보 숨김

# JWT — Production (모두 환경변수 필수)
jwt:
  active-kid: ${JWT_ACTIVE_KID}
  keys:
    - kid: ${JWT_ACTIVE_KID}
      secret: ${JWT_SECRET_CURRENT}
    - kid: ${JWT_PREVIOUS_KID:}
      secret: ${JWT_SECRET_PREVIOUS:}