# ============================================================================
# Production 환경 — 운영 서버
#
# - DB: 운영 DB (환경변수 필수, SSL 강제)
# - JWT: 환경변수 (Vault/Secret Manager에서 주입)
# - 로그: WARN 레벨 (성능 + 보안)
# - JPA: ddl-auto=validate (스키마 변경 절대 금지)
# - Actuator: 최소 노출 (보안)
# ============================================================================

spring:
  # 🔑 useLocalSessionState=true — 드라이버가 autocommit·isolation 을 서버에 되묻지 않는다.
  #    AWS 8차(500만) 전수 집계에서 이 왕복이 **쿼리 1,055만 건 / MySQL CPU 756초(예산 2.8%)** 였다.
  #    🪤 앱이 세션 변수를 직접 바꾸면 드라이버가 그것을 모른다 — 이 레포엔 그런 코드가 없다(전수 확인).
  datasource:
    master:
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=true&requireSSL=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      # 🔴 **풀 크기는 Little's law 로 정한다 — 크게 잡는 것이 안전한 게 아니다** (AWS 10차 실측).
      #    L = λ × W = 548/s × 9.41ms = **5.15 커넥션**(api 6대 합) = 인스턴스당 0.86개.
      #    그런데 예전 설정은 6×(50+50)=600 이었고, batch·consumer 를 더해 **640 > max_connections 500** 이라
      #    `Threads_connected 501` 로 한도를 채워 **연결 거절 8,296회**가 났다. 관리자 접속조차 막혔다.
      #    🪤 활성은 **1개**였다 — 트랜잭션이 길어서가 아니라 Hikari 의 `minimumIdle` 기본값이
      #       `maximumPoolSize` 라 **쓰지도 않는 커넥션을 최대치로 열어두기** 때문이다. 그래서 둘 다 적는다.
      maximum-pool-size: 20
      minimum-idle: 5
    replica:
      jdbc-url: jdbc:mysql://${DB_REPLICA_HOST}:${DB_REPLICA_PORT:3306}/queue_platform?useSSL=true&requireSSL=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      # replica 는 **앱이 읽는 경로가 0** 이다(master-replica-routing). 그런데 예전엔 50 을 열어
      # 커넥션의 43%(213개)를 점유했다. 빈 풀로 두지 않는 이유는 readOnly 트랜잭션이 새로 생길 때
      # 최소한 동작은 해야 하기 때문이다.
      # 🔴 **실측 판(infra/aws)에는 replica 인스턴스가 없다 — DB_REPLICA_HOST 가 master 를 가리킨다**
      #    (app.yml:28). 즉 이 풀은 분산이 아니라 **같은 MySQL 에 두 번 붙는 것**이고, 그래서
      #    한도(max_connections)를 두 배로 먹었다. "replica 니까 부하가 갈린다"고 읽지 마라.
      maximum-pool-size: 5
      minimum-idle: 1

  jpa:
    hibernate:
      ddl-auto: validate            # ⭐ 운영 절대 금지: update, create, create-drop
    show-sql: false                 # 운영 SQL 로그 차단 (성능 + 보안)
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

queue:
  redis:
    cluster1:
      nodes: ${REDIS_CLUSTER1_NODES:redis-a-1:6379,redis-a-2:6379,redis-a-3:6379,redis-a-4:6379}
    cluster2:
      nodes: ${REDIS_CLUSTER2_NODES:redis-b-1:6379,redis-b-2:6379,redis-b-3:6379,redis-b-4:6379}

logging:
  level:
    root: WARN
    com.sonix.queue: INFO
    org.hibernate.SQL: WARN

# Actuator (운영 — 최소 노출)
management:
  endpoints:
    web:
      exposure:
        # prometheus는 아직 켜지 않는다.
        #
        # SecurityConfig가 /actuator/prometheus를 permitAll로 두고, RateLimitFilter는
        # /actuator/ 로 시작하는 경로를 Rate Limit에서 통째로 제외하며, management.server.port
        # 분리도 없다(공개 API와 같은 8080). 이 상태에서 여기에 prometheus를 더하면
        # 엔드포인트 목록·테넌트별 트래픽/에러율·Hikari 풀·JVM이 인증 없이, 무제한으로 나간다.
        # percentiles-histogram이 켜져 있어 응답도 크다 — 익명 반복 호출 자체가 부하다.
        #
        # 지금 켜서 얻는 것은 0이다. prod에 배포된 적이 없고 prod Prometheus도 없다
        # (레포에 Dockerfile/compose/terraform/워크플로가 전부 없다 = 외부 미노출을 주장할 근거도 없다).
        # 노출은 관리 포트 분리 또는 스크레이퍼 전용 ACL과 "함께" 켠다 — Sprint 11 배포 PR에서.
        include: health, info
  endpoint:
    health:
      show-details: never           # 운영: 헬스 상세 정보 숨김

# JWT — Production (모두 환경변수 필수)
jwt:
  active-kid: ${JWT_ACTIVE_KID}
  keys:
    - kid: ${JWT_ACTIVE_KID}
      secret: ${JWT_SECRET_CURRENT}
    - kid: ${JWT_PREVIOUS_KID:}
      secret: ${JWT_SECRET_PREVIOUS:}