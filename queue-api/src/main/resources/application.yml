spring:
  application:
    name: queue-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Java 21 Virtual Thread 활성화 (Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

  lifecycle:
    # ── 단계별 종료 상한 ────────────────────────────────────────────
    # ⚠️ 이 값은 phase 그룹 '하나당' 상한이다. 총합이 아니다.
    #   DefaultLifecycleProcessor는 phase별로 별도 LifecycleGroup을 만들고 각 그룹에
    #   별도 latch로 이 timeout을 따로 준다(:305,:310). BatchProcessor의 drain과
    #   웹 graceful 대기는 서로 다른 phase(+1 / MAX-1024)이므로 각각 20s를 받는다.
    #   즉 "drain 5s + Kafka 12s = 17s < 20s" 같은 합산 비교는 성립하지 않는다.
    #
    # 그리고 이 값은 drain을 끊어주지 못한다. SmartLifecycle.stop(Runnable) 기본 구현이
    # 동기라, 대기 상한이 지나도 실행 중인 stop()은 계속 돈다. 처리자는 INFO 로그만 남기고
    # 다음 phase로 넘어갈 뿐이다(:497). Redis만 놓고 보면 drain 상한은 BatchProcessor의
    # SHUTDOWN_DRAIN_TIMEOUT_MS(5s) + Redis commandTimeout(5s) ≈ 10s다.
    # ⚠️ 단, 이 ≈10s는 MySQL이 응답한다는 전제 위에서만 성립한다. 같은 사이클의 DB 조회
    #   (findByQueueId, 캐시 없음)는 JDBC socketTimeout 미설정(Connector/J 기본 0 = 무기한)
    #   이라 시한이 없다. 그룹 진입 데드라인 검사는 '데드라인을 넘겨서까지 실행되는' 호출을
    #   최대 1회로 묶었을 뿐(데드라인 전에 시작한 호출은 개수 제한이 없다),
    #   1회의 길이는 여전히 무한이다 → DB 무응답 시 stop()에 상한은 없다(후속 과제).
    #
    # 20s가 필요한 이유는 drain 자체가 아니라 그 뒤다. drain으로 깨어난 요청 스레드는
    # Kafka 발행(최악 12s)을 마쳐야 응답을 내므로, 웹 graceful 대기가 그걸 덮어야 한다.
    # 기본값 30s는 enqueue 대기(30s)와 정확히 같아 경계에서 어느 쪽이 먼저 터지는지가
    # 불확실하다. 20s로 낮춰 "웹 대기가 먼저 끝난다"는 순서를 고정한다.
    # 단, 웹 대기가 끝나도 남은 in-flight는 에러 응답을 받지 못한다 — 커넥션이 끊길 뿐이다.
    # 그래서 "요청을 응답 있는 실패로 끝내는" 책임은 이 값이 아니라 drain 쪽에 있다.
    timeout-per-shutdown-phase: 20s

  # Sprint 1: 인프라 autoconfiguration 비활성화
  # Sprint 2(JPA), Sprint 4(Redis), Sprint 7(Kafka) 진행 시 해당 라인 제거
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  jpa:
    # 요청이 끝날 때까지 DB 커넥션을 붙들지 않는다.
    #
    # enqueue는 배치 처리를 기다리느라 최대 1초를 블록한다. OSIV가 켜져 있으면 그동안
    # 커넥션을 점유하므로, 동시 요청이 풀 크기를 넘는 순간 대기가 쌓이고 인증 조회조차
    # 커넥션을 못 받아 401/403이 쏟아진다(원인과 무관한 에러라 진단이 어렵다).
    #
    # 실측(동시 200): on 22 req/s → off 627 req/s.
    # 가상 스레드는 요청을 무한히 받지만 DB 커넥션은 유한하다는 점이 이 구조의 핵심 제약이다.
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9094,localhost:9096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # outbox의 존재 이유가 유실 방지이므로 협상 불가한 값들.
      #   acks=all      : ISR 전원이 받아야 성공 처리
      #   idempotence   : 프로듀서 재시도로 인한 중복·순서 역전 방지
      #                   (파티션 내 순서 보장의 전제 — 이게 꺼지면 재시도 시 뒤집힌다)
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5   # idempotence 켠 상태의 상한
        # 컨슈머가 spring.json.use.type.headers=false 로 읽으므로 타입 헤더를 싣지 않는다.
        # ⚠️ 옛 주석은 "양쪽이 어긋나면 엉뚱한 타입으로 시도된다"였으나 실측으로 반증됐다
        #    (2026-09-02, KafkaSerdeContractTest 반사실). 이 값을 true로 바꿔도, 컨슈머의
        #    use.type.headers를 지워도 왕복은 성립한다 — 지금 조합에서 이 줄은 여분이고,
        #    하중을 받는 것은 컨슈머의 spring.json.value.default.type 하나뿐이다.
        #    그 표는 KafkaSerdeContractTest의 javadoc에 있다. 셋을 일관되게 맞춰 두는 것이지
        #    각각이 계약을 지탱하는 게 아니다.
        spring.json.add.type.headers: false

        # ── 시한 설계 ────────────────────────────────────────────────
        # 기본값(max.block 60s + delivery 120s)은 이 경로에 맞지 않는다. enqueue는 사용자가
        # 응답을 기다리는 동기 요청이라, 발행이 오래 매달리면 호출자가 먼저 포기해버린다.
        # 그러면 서버는 503을 만들어봐야 전달할 곳이 없고, 클라이언트는 성공·실패를
        # 구분하지 못한 채 타임아웃만 본다(실측: 1,410건).
        #
        # 그래서 "발행은 빨리 확정되거나 빨리 실패한다"로 못박는다:
        #   max.block(4s) + delivery(8s) = 최악 12s < 어댑터 대기 12s < 클라이언트 타임아웃
        #
        # ⚠️ 제약: delivery.timeout.ms >= linger.ms + request.timeout.ms
        max.block.ms: 4000          # 버퍼 소진·메타데이터 대기로 send()가 매달리는 상한
        request.timeout.ms: 3000    # 브로커 1회 응답 대기
        delivery.timeout.ms: 8000   # 재시도까지 포함한 배달 시한

        # 배칭으로 produce 요청 수를 줄인다. linger=0(기본)이면 요청마다 배치 1건이라
        # acks=all 왕복이 건당 발생해 버퍼가 밀린다. 5ms만 모아도 배치당 수~수십 건이 되어
        # 요청 수가 한 자릿수 배로 줄고, 그만큼 지연 상한도 안정된다.
        linger.ms: 5

queue:
  # Redis 독립 2 Cluster (DECISIONS §75)
  #
  # spring.data.redis.cluster.nodes(Boot 표준)는 클러스터를 하나만 표현한다. 두 개를 독립으로
  # 두는 구성은 표준 키로 쓸 방법이 없어 커스텀 네임스페이스를 쓴다. RedisAutoConfiguration은
  # 이미 exclude돼 있고, 연결은 RedisConfig가 직접 만든다.
  #
  # 노드 목록은 시드일 뿐이다 — 실제 슬롯 지도는 접속 후 받고, 이후 주기·적응형으로
  # 갱신된다(RedisConfig.TOPOLOGY_REFRESH_PERIOD).
  # 프로파일별 노드 목록은 application-{local,prod}.yml에 있다.
  #
  # ⚠️ Sentinel 설정은 제거했다. 프로파일로 분기하지 않는다 — 해시태그 누락처럼
  #    Cluster에서만 터지는 결함이 Sentinel 경로로 숨을 통로를 남기지 않기 위함이다.
  #    Sentinel 인프라·문서 자체는 학습/로컬 자산으로 남아 있다(§75 D28).
  redis:
    password: ${REDIS_PASSWORD:}

  # 토큰 생명주기 이벤트 발행 설정
  event:
    topic: token-lifecycle
    # 프로듀서의 최악 시한(max.block 4s + delivery 8s)보다 크게 잡는다.
    # 더 짧으면 브로커가 아직 판정 중인데 우리가 먼저 포기하는 셈이라, 실제로는 발행에
    # 성공한 건까지 실패로 보고하게 된다("모름"을 "실패"로 단정하는 것).
    send-timeout-ms: 12000

server:
  port: ${SERVER_PORT:8080}
  # 종료 시 새 요청은 거부하고, 처리 중이던 요청은 응답까지 기다린다.
  #
  # ⚠️ 이 한 줄만으로는 부족하다. enqueue의 in-flight 요청은 BatchProcessor가 Global Queue를
  # drain해 줘야 끝나는데, 가상 스레드 환경의 스케줄러(SimpleAsyncTaskScheduler)는
  # ContextClosedEvent에서 새 틱을 멈춘다(실행 중인 틱은 안 끊는다 — BatchProcessor.getPhase()
  # javadoc 참조). 그래서 BatchProcessor가 웹 graceful 단계보다
  # 한 단계 먼저(phase +1) 마지막 drain을 돌린다 — 그게 없으면 종료가 안전해지는 게 아니라
  # 요청이 30초 매달렸다 503이 될 뿐이다.
  #
  # ⚠️ 운영 전제: LB deregistration이 SIGTERM보다 "먼저" 일어나야 한다.
  #    BatchProcessor.stop()이 markShuttingDown()을 켜는 시점부터 아래 graceful로 커넥터가
  #    pause되기까지 최대 약 10초(DB 무응답 시 무한) 동안, 이 인스턴스는 새 enqueue를
  #    100% 503으로 거절하면서 커넥션은 계속 받는다. LB가 늦게 빼면 롤링 배포마다
  #    인스턴스당 그 시간만큼 503 스파이크가 난다. 배포 런북 필요(후속 과제).
  shutdown: graceful

# Actuator (Sprint 1: health check만)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

  # Prometheus 메트릭 — 자동 활성화
  prometheus:
    metrics:
      export:
        enabled: true
  # JVM, HTTP 메트릭 활성화 (기본 enabled)
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      http: true
      hikaricp: true                              # DB Pool (HikariCP)
    distribution:
      percentiles-histogram:
        http.server.requests: true                # p50/p95/p99 자동
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99    # 명시적

# JWT 관련 내용 추가 (Duration 표기: 15m, 7d, 30s 등)
jwt:
  access-token-expiry: 15m
  refresh-token-expiry: 7d

# 로그 표시 타임존 — 저장은 UTC, 화면은 KST
#
# JVM 기본 TZ가 UTC라(main() 참조) 아무 설정도 안 하면 로그도 UTC로 찍힌다.
# 새벽 대응 때 +9를 암산하게 하지 않으려고 표시만 Asia/Seoul로 돌린다.
# XXX 토큰이 +09:00 오프셋을 함께 찍으므로 UTC 값과 헷갈릴 여지가 없다.
#
# ⚠️ DB에 저장된 값은 UTC다. 로그가 15:34여도 tokens.issued_at은 06:34다.
#    둘을 대조할 때는 9시간 차이를 감안하라. (DECISIONS §77)
logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX, Asia/Seoul"
