spring:
  application:
    name: queue-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  # Java 21 Virtual Thread 활성화 (Spring Boot 3.2+)
  threads:
    virtual:
      enabled: true

  # Sprint 1: 인프라 autoconfiguration 비활성화
  # Sprint 2(JPA), Sprint 4(Redis), Sprint 7(Kafka) 진행 시 해당 라인 제거
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      sentinel:
        master: mymaster      # Sentinel Master 이름 (공통)

server:
  port: ${SERVER_PORT:8080}

# Actuator (Sprint 1: health check만)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized

  # Prometheus 메트릭 — 자동 활성화
  prometheus:
    metrics:
      export:
        enabled: true
  # JVM, HTTP 메트릭 활성화 (기본 enabled)
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      http: true
      hikaricp: true                              # DB Pool (HikariCP)
    distribution:
      percentiles-histogram:
        http.server.requests: true                # p50/p95/p99 자동
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99    # 명시적

# JWT 관련 내용 추가 (Duration 표기: 15m, 7d, 30s 등)
jwt:
  access-token-expiry: 15m
  refresh-token-expiry: 7d
