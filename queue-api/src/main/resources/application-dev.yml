# ============================================================================
# Dev (Staging) 환경 — 개발/스테이징 서버
#
# - DB: 개발 서버 DB (환경변수)
# - JWT: 환경변수 (Vault 또는 Secret Manager)
# - 로그: INFO 레벨
# - JPA: ddl-auto=validate (스키마 변경 차단, 검증만)
# ============================================================================

spring:
  # 🔑 useLocalSessionState=true — 드라이버가 autocommit·isolation 을 서버에 되묻지 않는다.
  #    AWS 8차(500만) 전수 집계에서 이 왕복이 **쿼리 1,055만 건 / MySQL CPU 756초(예산 2.8%)** 였다.
  #    🪤 앱이 세션 변수를 직접 바꾸면 드라이버가 그것을 모른다 — 이 레포엔 그런 코드가 없다(전수 확인).
  datasource:
    master:
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=2000&sessionVariables=lock_wait_timeout=10
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD}
      maximum-pool-size: 20
    replica:
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=2000&sessionVariables=lock_wait_timeout=10
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD}
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

logging:
  level:
    root: INFO
    com.sonix.queue: DEBUG
    org.hibernate.SQL: DEBUG
    
# Actuator (dev — health, info, metrics 추가)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# JWT — Dev (환경변수, default 없음)
jwt:
  active-kid: ${JWT_ACTIVE_KID}
  keys:
    - kid: ${JWT_ACTIVE_KID}
      secret: ${JWT_SECRET_CURRENT}
    - kid: ${JWT_PREVIOUS_KID:}
      secret: ${JWT_SECRET_PREVIOUS:}