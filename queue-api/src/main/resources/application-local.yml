# ============================================================================
# Local 환경 — 개발자 노트북
#
# - DB: 로컬 MySQL Master/Replica (Docker)
# - JWT: 평문 secret 사용 (편의)
# - 로그: DEBUG 레벨 (디버깅 편의)
# - JPA: ddl-auto=validate (스키마 정본은 doc/schema.sql)
# ============================================================================

spring:
  datasource:
    master:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: queueapp
      password: queueapp1234
      maximum-pool-size: 10
    replica:
      jdbc-url: jdbc:mysql://127.0.0.1:3307/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: queueapp
      password: queueapp1234
      maximum-pool-size: 10
  jpa:
    hibernate:
      # local도 validate다. update는 스키마를 엔티티에 맞춰 조용히 바꿔버린다.
      #
      # 실제로 일어났던 일:
      #   · schema.sql의 TINYINT(설계상 저장공간 최적화)를 전부 INT로 되돌림
      #   · @Column(length) 없는 String 필드를 VARCHAR(255)로 넓힘 (인덱스 컬럼 포함)
      #   · CHAR(64) → VARCHAR(64), DATETIME(3) → DATETIME(6)
      #   · 엔티티에서 제거한 컬럼은 삭제하지 않아 NOT NULL 유령 컬럼이 남음
      #     (그 결과 큐 생성 INSERT가 전부 실패했다)
      #
      # 더 나쁜 건 이 모두가 local에서만 조용히 넘어가고 dev/prod(validate)에서
      # 기동 실패로 터진다는 점이다. 스키마 정본은 doc/schema.sql이며,
      # 변경은 그 파일과 마이그레이션으로만 한다.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      sentinel:
        nodes: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381

logging:
  level:
    root: INFO
    com.sonix.queue: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.sonix.queue.infrastructure.cache: DEBUG
    com.sonix.queue.api.security.RateLimitFilter: DEBUG

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
# JWT — 로컬 (Rotation 미리 테스트 가능)
jwt:
  active-kid: key-local-01
  keys:
    - kid: key-local-01
      secret: queue-platform-LOCAL-current-secret-must-be-32-bytes-or-more
    - kid: key-local-00
      secret: queue-platform-LOCAL-previous-secret-must-be-32-bytes-or-more