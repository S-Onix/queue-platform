# ============================================================================
# Local 환경 — 개발자 노트북
#
# - DB: 로컬 MySQL Master/Replica (Docker)
# - JWT: 평문 secret 사용 (편의)
# - 로그: DEBUG 레벨 (디버깅 편의)
# - JPA: ddl-auto=update (자동 스키마 변경)
# ============================================================================

spring:
  datasource:
    master:
      jdbc-url: jdbc:mysql://127.0.0.1:3306/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      username: queueapp
      password: queueapp1234
      maximum-pool-size: 10
    replica:
      jdbc-url: jdbc:mysql://127.0.0.1:3307/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      username: queueapp
      password: queueapp1234
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      sentinel:
        nodes: 127.0.0.1:26379,127.0.0.1:26380,127.0.0.1:26381

logging:
  level:
    root: INFO
    com.sonix.queue: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
# JWT — 로컬 (Rotation 미리 테스트 가능)
jwt:
  active-kid: key-local-01
  keys:
    - kid: key-local-01
      secret: queue-platform-LOCAL-current-secret-must-be-32-bytes-or-more
    - kid: key-local-00
      secret: queue-platform-LOCAL-previous-secret-must-be-32-bytes-or-more