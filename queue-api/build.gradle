apply plugin: 'org.springframework.boot'

dependencies {
    implementation project(':queue-domain')
    implementation project(':queue-infrastructure')
    implementation project(':queue-common')

    // Spring MVC + Virtual Thread
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework:spring-tx'

    // Actuator (health check용)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // 모니터링용
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Caffeine
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Enqueue E2E 통합 테스트용 (StringRedisTemplate / RedisScript) — 테스트 스코프 전용
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis'

    compileOnly      "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
}