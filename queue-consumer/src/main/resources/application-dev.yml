logging:
  level:
    root: INFO
    com.sonix.queue: INFO

spring:
  data:
    redis:
      sentinel:
        nodes: ${REDIS_SENTINEL_NODES:localhost:26379,localhost:26380,localhost:26381}
        password: ${REDIS_PASSWORD:}
  datasource:
    master:
      # rewriteBatchedStatements=true 누락 시 배치가 조용히 퇴화한다(예외·로그 없음).
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD:queueapp1234}
      maximum-pool-size: ${DB_POOL_SIZE:10}
    replica:
      jdbc-url: jdbc:mysql://${DB_REPLICA_HOST:localhost}:${DB_REPLICA_PORT:3307}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD:queueapp1234}
      maximum-pool-size: 5
