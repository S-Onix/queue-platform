logging:
  level:
    root: INFO
    com.sonix.queue: INFO

queue:
  redis:
    cluster1:
      nodes: ${REDIS_CLUSTER1_NODES:localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005,localhost:7006,localhost:7007,localhost:7008}
    cluster2:
      nodes: ${REDIS_CLUSTER2_NODES:localhost:8001,localhost:8002,localhost:8003,localhost:8004,localhost:8005,localhost:8006,localhost:8007,localhost:8008}

spring:
  datasource:
    master:
      # rewriteBatchedStatements=true 누락 시 배치가 조용히 퇴화한다(예외·로그 없음).
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD:queueapp1234}
      maximum-pool-size: ${DB_POOL_SIZE:10}
    replica:
      jdbc-url: jdbc:mysql://${DB_REPLICA_HOST:localhost}:${DB_REPLICA_PORT:3307}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD:queueapp1234}
      maximum-pool-size: 5
