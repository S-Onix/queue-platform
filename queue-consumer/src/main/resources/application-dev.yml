logging:
  level:
    root: INFO
    com.sonix.queue: INFO

queue:
  redis:
    cluster1:
      nodes: ${REDIS_CLUSTER1_NODES:localhost:7001,localhost:7002,localhost:7003,localhost:7004,localhost:7005,localhost:7006,localhost:7007,localhost:7008}
    cluster2:
      nodes: ${REDIS_CLUSTER2_NODES:localhost:8001,localhost:8002,localhost:8003,localhost:8004,localhost:8005,localhost:8006,localhost:8007,localhost:8008}

spring:
  # 🔑 useLocalSessionState=true — 드라이버가 autocommit·isolation 을 서버에 되묻지 않는다.
  #    AWS 8차(500만) 전수 집계에서 이 왕복이 **쿼리 1,055만 건 / MySQL CPU 756초(예산 2.8%)** 였다.
  #    🪤 앱이 세션 변수를 직접 바꾸면 드라이버가 그것을 모른다 — 이 레포엔 그런 코드가 없다(전수 확인).
  datasource:
    master:
      # rewriteBatchedStatements=true 누락 시 배치가 조용히 퇴화한다(예외·로그 없음).
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST:localhost}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&rewriteBatchedStatements=true
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD:queueapp1234}
      maximum-pool-size: ${DB_POOL_SIZE:10}
    replica:
      jdbc-url: jdbc:mysql://${DB_REPLICA_HOST:localhost}:${DB_REPLICA_PORT:3307}/queue_platform?useSSL=false&allowPublicKeyRetrieval=true&useLocalSessionState=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: ${DB_USERNAME:queueapp}
      password: ${DB_PASSWORD:queueapp1234}
      maximum-pool-size: 5
