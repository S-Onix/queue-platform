# AWS 부하 실측용 오버라이드. bridge 판 위에 얹어서 쓴다.
#
#   docker compose -f docker-compose.bridge.yml -f docker-compose.aws.yml up -d
#
# 🔑 bridge 를 복사하지 않고 덮는다. Redis 6노드 정의는 한 벌로 남겨야
#    announce-ip 같은 걸 고칠 때 한 곳만 고치는 사고가 안 난다.
#
# bridge 와 무엇이 다른가
#   1. MySQL 이 컨테이너다          — EC2 에 호스트 MySQL 이 없다
#   2. replica URL → master 와 동일 — 앱의 replica 읽기가 0인 걸 실측했다 (PR #63)
#   3. Kafka 3 브로커 RF=3 min.insync=2 — acks=all 복제 대기가 enqueue 지연에 포함된다.
#                                       RF=1 은 그 비용을 숨겨 측정을 낙관적으로 만든다
#   4. queue-api 3 대                — 한 대에선 ownerByQueueId·캐시가 갈라질 기회가 없다
#   5. JVM -Xmx512m                  — 버스트 중 380MB/4GB 실측 (16GB 안에 전부 넣는다)

# 🔑 bridge 와 프로젝트명을 분리한다. 안 주면 두 스택이 같은 이름을 공유해서
#    로컬 bridge 판을 조용히 교체한다(이 레포가 실제로 밟은 사고다).
name: queue-aws

services:
  # ── MySQL (master 1대. replica 는 같은 서버를 가리킨다) ──────────────────
  mysql:
    image: mysql:8.0
    container_name: br-mysql
    restart: unless-stopped
    networks: { queuenet: { ipv4_address: 172.28.4.1 } }
    environment:
      MYSQL_ROOT_PASSWORD: rootpw1234
      MYSQL_DATABASE: queue_platform
      MYSQL_USER: queueapp
      MYSQL_PASSWORD: queueapp1234
    # 🔑 max_connections: api 3대(50+50) + batch 15 + consumer 25 = 340 이 한 서버로 몰린다.
    #    기본값 151 이면 부하 중 "Too many connections" 로 터진다.
    # 🔑 서버 시간대를 +09:00 으로 **명시** 고정한다. mysql:8.0 컨테이너 기본값은 UTC 라
    #    아무것도 안 하면 로컬 호스트 MySQL(+09:00)과 조용히 다른 조건이 된다.
    #    UTC 로 두면 실수로 쓴 NOW() 가 UTC_TIMESTAMP() 와 같은 값이라 **결함이 숨는다**.
    #    +09:00 이면 9시간 틀어져 즉시 드러난다. 판정 술어는 UTC_TIMESTAMP(3) 라 TZ 무관이고(§90),
    #    DEFAULT CURRENT_TIMESTAMP(3) 은 앱 커넥션의 세션 TZ(=UTC)를 따르므로 UTC 로 적재된다.
    #    ⚠️ CLI 로 확인할 때는 SET time_zone='+00:00' 또는 UTC_* 함수를 써라 (doc/schema.sql:118).
    command: >
      --max_connections=500
      --innodb_buffer_pool_size=1G
      --innodb_flush_log_at_trx_commit=1
      --default-time-zone=+09:00
    volumes:
      - ./doc/schema.sql:/schema/schema.sql:ro
      - ./infra/aws/mysql-init:/docker-entrypoint-initdb.d:ro
      # 🔑 익명 볼륨이면 "재생성 때 데이터가 남는가"가 Docker 내부 동작에 달린다.
      #    이름을 줘서 초기화 시점을 우리가 정한다:
      #      docker compose ... down      → 데이터 유지 (3일치 누적 검증용)
      #      docker compose ... down -v   → 전부 삭제 (통합 시나리오는 빈 DB 에서 시작)
      #    schema.sql 은 datadir 이 비었을 때만 다시 돈다.
      - mysql-data:/var/lib/mysql
    mem_limit: 2500m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpw1234"]
      interval: 5s
      timeout: 3s
      retries: 30

  # ── Kafka 3 브로커 ────────────────────────────────────────────────────────
  # 🔑 CLUSTER_ID 를 반드시 고정한다. 안 주면 각 브로커가 제 멋대로 포맷해서
  #    서로 다른 클러스터가 되고 쿼럼이 영원히 안 선다.
  kafka:
    environment:
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: &cid 5L6g3nShT-eMCtK--X86sw
      KAFKA_CONTROLLER_QUORUM_VOTERS: &voters 1@172.28.3.1:9093,2@172.28.3.2:9093,3@172.28.3.3:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.28.3.1:9092
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
    mem_limit: 1200m

  kafka-2:
    image: apache/kafka:4.0.0
    container_name: br-kafka-2
    restart: unless-stopped
    networks: { queuenet: { ipv4_address: 172.28.3.2 } }
    mem_limit: 1200m
    environment: &kafka2env
      KAFKA_NODE_ID: "2"
      CLUSTER_ID: *cid
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: *voters
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.28.3.2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_MIN_INSYNC_REPLICAS: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m

  kafka-3:
    image: apache/kafka:4.0.0
    container_name: br-kafka-3
    restart: unless-stopped
    networks: { queuenet: { ipv4_address: 172.28.3.3 } }
    mem_limit: 1200m
    environment:
      <<: *kafka2env
      KAFKA_NODE_ID: "3"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.28.3.3:9092

  # ── 앱: DB 를 컨테이너로, Kafka 를 3 브로커로, 힙을 512m 으로 ─────────────
  # 🔑 mem_limit 700m → 1g. 유휴에서 이미 477MiB(68%)였다 — -Xmx512m 힙 위에 메타스페이스·
  #    스레드 스택·Netty 버퍼가 얹힌 값이다. 부하 중 상한에 닿으면 OOMKill 이 나고,
  #    그러면 측정이 "성능 한계"가 아니라 "컨테이너가 죽음"이 된다. 힙은 512m 그대로 둔다.
  queue-api:
    mem_limit: 1g
    environment: &awsenv
      DB_MASTER_HOST: 172.28.4.1
      DB_MASTER_PORT: "3306"
      DB_REPLICA_HOST: 172.28.4.1
      DB_REPLICA_PORT: "3306"
      KAFKA_BOOTSTRAP: 172.28.3.1:9092,172.28.3.2:9092,172.28.3.3:9092
      JAVA_TOOL_OPTIONS: -Xmx512m
      # 🔑 prod 기본값은 health,info 뿐이라 부하 중 앱 메트릭이 0 이 된다
      #    (tail_probe.sh 가 /actuator/prometheus 를 직접 긁는다).
      #    application-prod.yml 이 막아둔 이유는 "스크레이퍼 전용 ACL 없이는 켜지 마라"였고,
      #    여기서는 보안 그룹이 그 ACL 이다 — 인터넷에 열린 건 내 IP 의 SSH 하나뿐이고
      #    앱 포트는 SG 내부에서만 닿는다. application-prod.yml 자체는 건드리지 않는다.
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    depends_on:
      mysql: { condition: service_healthy }

  # 🔑 2·3 호는 build 를 두지 않는다. 같은 태그(queue-api:local)를 빌더 3개가 동시에
  #    구우면 낭비이고 경합한다. `docker compose build` 를 먼저 돌려 이미지를 만든 뒤 up 한다.
  queue-api-2:
    image: queue-api:local
    container_name: br-queue-api-2
    networks: [queuenet]
    ports: ["18083:8080"]
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: queueapp
      DB_PASSWORD: queueapp1234
      REDIS_CLUSTER1_NODES: 172.28.1.1:6379,172.28.1.2:6379,172.28.1.3:6379
      REDIS_CLUSTER2_NODES: 172.28.2.1:6379,172.28.2.2:6379,172.28.2.3:6379
      SERVER_PORT: "8080"
      JWT_ACTIVE_KID: key-bridge-01
      JWT_SECRET_CURRENT: queue-platform-BRIDGE-current-secret-must-be-32-bytes-or-more
      <<: *awsenv

  queue-api-3:
    image: queue-api:local
    container_name: br-queue-api-3
    networks: [queuenet]
    ports: ["18084:8080"]
    mem_limit: 1g
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_USERNAME: queueapp
      DB_PASSWORD: queueapp1234
      REDIS_CLUSTER1_NODES: 172.28.1.1:6379,172.28.1.2:6379,172.28.1.3:6379
      REDIS_CLUSTER2_NODES: 172.28.2.1:6379,172.28.2.2:6379,172.28.2.3:6379
      SERVER_PORT: "8080"
      JWT_ACTIVE_KID: key-bridge-01
      JWT_SECRET_CURRENT: queue-platform-BRIDGE-current-secret-must-be-32-bytes-or-more
      <<: *awsenv

  queue-batch:
    environment: *awsenv
    depends_on:
      mysql: { condition: service_healthy }

  queue-consumer:
    environment: *awsenv
    depends_on:
      mysql: { condition: service_healthy }

volumes:
  mysql-data:
