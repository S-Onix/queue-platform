spring:
  application:
    name: queue-batch

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  threads:
    virtual:
      enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jpa:
    # 요청이 끝날 때까지 DB 커넥션을 붙들지 않는다.
    #
    # enqueue는 배치 처리를 기다리느라 최대 1초를 블록하는데, OSIV가 켜져 있으면 그동안
    # 커넥션을 점유한다. 동시 요청이 풀 크기를 넘는 순간 대기가 쌓이고, 인증 조회조차
    # 커넥션을 못 받아 401/403이 쏟아진다(원인과 무관한 에러라 진단이 어렵다).
    # 실측: on 22 req/s → off 627 req/s.
    open-in-view: false
    hibernate:
      ddl-auto: validate           # batch는 스키마 안 건드림
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500          # 배치 INSERT 크기 (CHUNK와 맞춤)
        order_inserts: true        # 같은 테이블 INSERT 모아 배치 효율↑

  # TokenReclaimJob이 EXPIRED를 발행한다 (§36 · §82). 이 블록이 없으면 기본값
  # (value-serializer = StringSerializer)이라 EnqueueEvent 직렬화가 런타임에 실패한다.
  #
  # ⚠️ spring.json.add.type.headers=false 는 협상 불가다 — 컨슈머가
  #    spring.json.use.type.headers=false + default.type 으로 읽으므로 양쪽이 어긋나면
  #    역직렬화가 엉뚱한 타입으로 시도된다 (queue-api·queue-consumer와 같은 값).
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9094,localhost:9096}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        spring.json.add.type.headers: false
        # 브로커가 죽었을 때 스케줄 스레드가 기본값(max.block 60s + delivery 120s)만큼
        # 매달리면 잡 한 바퀴가 통째로 멈춘다. 발행 실패는 어차피 삼키고 로그만 남기므로
        # (복귀는 Redis에서 이미 확정) 빨리 실패하는 편이 낫다.
        max.block.ms: 4000
        request.timeout.ms: 3000
        delivery.timeout.ms: 8000

server:
  port: ${SERVER_PORT:8081}

# Redis 독립 2 Cluster (DECISIONS §75). 프로파일별 노드 목록은 application-{local,prod}.yml.
#
# ⚠️ TokenReclaimJob이 claim-Lua를 돌리므로 batch도 Redis를 직접 쓴다(§80).
#    게다가 scanBasePackages가 com.sonix.queue 전체라 queue-infrastructure의 Redis 빈이
#    함께 생성된다. 이제 클러스터가 둘이므로
#    이 프로세스는 Lettuce 클라이언트를 2벌 문다(각각 토폴로지 갱신 타이머 포함).
#    Lettuce는 연결을 지연 생성하므로 실제 통신은 첫 사용 때까지 일어나지 않는다.
#    스캔 범위를 좁히면 이 블록과 함께 사라진다(별건, 후속 정리 대상).
queue:
  redis:
    password: ${REDIS_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: queue-batch

# 로그 표시 타임존 — 저장은 UTC, 화면은 KST
#
# JVM 기본 TZ가 UTC라(main() 참조) 아무 설정도 안 하면 로그도 UTC로 찍힌다.
# 새벽 대응 때 +9를 암산하게 하지 않으려고 표시만 Asia/Seoul로 돌린다.
# XXX 토큰이 +09:00 오프셋을 함께 찍으므로 UTC 값과 헷갈릴 여지가 없다.
#
# ⚠️ DB에 저장된 값은 UTC다. 로그가 15:34여도 tokens.issued_at은 06:34다.
#    둘을 대조할 때는 9시간 차이를 감안하라. (DECISIONS §77)
logging:
  pattern:
    dateformat: "yyyy-MM-dd'T'HH:mm:ss.SSSXXX, Asia/Seoul"
