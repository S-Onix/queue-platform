spring:
  application:
    name: queue-batch

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  threads:
    virtual:
      enabled: true

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: validate           # batch는 스키마 안 건드림
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 500          # 배치 INSERT 크기 (CHUNK와 맞춤)
        order_inserts: true        # 같은 테이블 INSERT 모아 배치 효율↑

  data:
    redis:
      sentinel:
        master: mymaster

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092,localhost:9094,localhost:9096}
    consumer:
      group-id: token-enqueue-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 500        # batch_size와 동일하게
      enable-auto-commit: false    # 수동 커밋 (DB INSERT 성공 후 커밋)
      properties:
        spring.json.trusted.packages: "com.sonix.queue.*"
    listener:
      type: batch                  # List<EnqueueEvent>로 수신
      ack-mode: manual             # 수동 ack (DB 커밋 성공 후)

server:
  port: ${SERVER_PORT:8081}
