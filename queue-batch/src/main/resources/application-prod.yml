spring:
  datasource:
    # 🔴 이 블록이 없으면 기동 자체가 안 된다 — 베이스 application.yml에 datasource가 없어
    #    프로필이 반드시 제공해야 한다. queue-api·queue-consumer는 갖고 있는데 여기만 빠져
    #    있어서 batch는 local 프로필 밖에서 한 번도 뜬 적이 없었다(2026-08-24 컨테이너 검증에서 발견).
    #    TokenReclaimJob이 queueRepository.findAll()로 큐 목록을 DB에서 읽으므로 필수다.
    master:
      jdbc-url: jdbc:mysql://${DB_MASTER_HOST}:${DB_MASTER_PORT:3306}/queue_platform?useSSL=true&requireSSL=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      # api(50)·consumer(20)보다 작다. 이 앱은 주기(10초)마다 큐 목록을 한 번 읽고
      # 회수는 Redis EVAL로 끝난다 — 커넥션을 오래 쥐지 않는다.
      maximum-pool-size: ${DB_POOL_SIZE:10}
    replica:
      jdbc-url: jdbc:mysql://${DB_REPLICA_HOST}:${DB_REPLICA_PORT:3306}/queue_platform?useSSL=true&requireSSL=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      maximum-pool-size: 5

logging:
  level:
    root: WARN
    com.sonix.queue: INFO

queue:
  redis:
    cluster1:
      nodes: ${REDIS_CLUSTER1_NODES:redis-a-1:6379,redis-a-2:6379,redis-a-3:6379,redis-a-4:6379}
    cluster2:
      nodes: ${REDIS_CLUSTER2_NODES:redis-b-1:6379,redis-b-2:6379,redis-b-3:6379,redis-b-4:6379}

management:
  endpoints:
    web:
      exposure:
        # prometheus는 prod에서 켜지 않는다 — queue-api prod와 같은 판정이다.
        #
        # 이 앱은 컨트롤러가 0개라 HTTP 표면이 통째로 actuator다. 그래서 api가 제시한
        # "관리 포트 분리"가 여기선 성립하지 않는다(분리할 업무 포트가 없다). 남는 경계는
        # 스크레이퍼 전용 ACL이나 네트워크 정책인데, 배포가 아직 없어 그것도 없다.
        #
        # 열어 두면 인증 없이 메트릭 176종이 나간다(실측). 테넌트·큐 식별자는 라벨에 없지만,
        # Kafka·JVM·Spring 버전과 Hikari 포화도·컨슈머 lag이 나간다 — 무엇을 언제 치면
        # 아픈지를 알려주는 값들이다.
        #
        # 🔑 이건 "보호했다"가 아니라 "경계가 생길 때까지 안 연다"이다. 경계와 **함께** 다시 켠다
        #    (Sprint 11 배포 PR). local·dev는 그대로 둔다(베이스 yml의 health,info,prometheus).
        #
        # ⚠️ "잃는 관측이 없다"가 참인 조건은 **jar를 local 프로필로 띄울 때**다.
        #    docker-compose.local.yml과 Dockerfile은 프로필이 prod라, 컨테이너로 검증할 때는
        #    로컬 Prometheus의 8081·8082 타깃이 404가 되어 up=0 → AppInstanceDown이 뜬다.
        #    그 검증은 lag을 보지 않으므로 조치 대상은 아니지만, 놀라지 마라.
        include: health, info
