# 빌드·테스트·이미지 검증.
#
# ⚠️ 지금 CI가 도는 테스트는 49개 중 10개다 (common 2 · domain 5 · batch 1 · consumer 2).
#    나머지 39개(queue-infrastructure 25 · queue-api 14)는 실 인프라를 요구한다 —
#    MySQL master+replica(스키마 선주입, ddl-auto=none) · Redis Cluster 2개 · Kafka.
#    통합 레인은 후속 작업이고, 착수 전에 테스트에 @Tag를 달아 인프라 필요 여부를 코드로
#    표시해야 한다. 지금처럼 모듈 단위로 가르면 새 순수 테스트가 CI 밖에 남는다.
#
#    그래서 이 워크플로가 실제로 지키는 것은 두 가지다.
#      1) 전 모듈 컴파일 (main + test) — 포트 시그니처 변경 같은 광역 파손을 잡는다
#      2) 이미지 3종이 실제로 구워지는가 — Dockerfile은 로컬에서 안 굽고 넘어가기 쉽다
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# 같은 브랜치에 새 푸시가 오면 앞 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          # Java 21 고정 — Virtual Thread·Record·Pattern Matching 전제다.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 전 모듈이 컴파일되는지부터 본다. 헥사고날이라 queue-domain의 포트 시그니처 하나가
      # infrastructure·api·batch·consumer를 한꺼번에 깨뜨린다 — 그 파손을 여기서 잡는다.
      - name: 컴파일 (main + test, 전 모듈)
        run: ./gradlew --no-daemon compileJava compileTestJava

      # 실 인프라가 필요 없는 모듈만 돌린다. 목록을 늘리려면 위 주석의 @Tag 작업이 먼저다.
      - name: 단위 테스트 (인프라 불필요 모듈)
        run: >
          ./gradlew --no-daemon
          :queue-common:test :queue-domain:test :queue-batch:test :queue-consumer:test

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/**'
          retention-days: 7

  images:
    name: 이미지 빌드
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: queue-api
            port: '8080'
          - module: queue-batch
            port: '8081'
          - module: queue-consumer
            port: '8082'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 푸시하지 않는다. 레지스트리를 아직 안 정했고, 여기서 지키려는 것은
      # "Dockerfile이 실제로 구워지는가"이지 배포가 아니다.
      - name: ${{ matrix.module }} 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            MODULE=${{ matrix.module }}
            APP_PORT=${{ matrix.port }}
          # GitHub Actions 캐시. 이미지 안에서 Gradle을 돌리므로 캐시가 없으면
          # 매 실행이 의존성을 처음부터 받는다.
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max
