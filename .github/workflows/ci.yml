# 빌드·테스트·이미지 검증.
#
# 레인이 둘이다. 가르는 기준은 **모듈이 아니라 @Tag** 다.
#
#   단위 레인    ./gradlew test -PunitOnly    인프라 불필요분 전부 (277건)
#   통합 레인    ./gradlew test               MySQL + Redis Cluster 2개 + Kafka를 띄우고 전부 (448건)
#
# ⚠️ 모듈로 가르면 안 된다. queue-infrastructure·queue-api에는 순수 테스트와 인프라 테스트가
#    섞여 있어서, 모듈 단위로 자르면 새로 추가되는 순수 테스트가 통째로 CI 밖에 남는다.
#    실제로 그 상태였다 — 384건 중 104건만 돌고 있었다.
#
# Kafka도 띄운다(2026-09-02). 발행 경로 대부분은 여전히 목으로 검증하지만, 프로듀서와 컨슈머의
# 직렬화 계약은 두 모듈의 서로 다른 yml에 절반씩 적혀 있어 브로커 없이는 잴 수 없다.
# @Tag("kafka") 1건(KafkaSerdeContractTest)이 그것을 요구한다 — 그 1건 때문에 세우는 것이다.
name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# 같은 브랜치에 새 푸시가 오면 앞 실행을 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 빌드 · 단위 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          # Java 21 고정 — Virtual Thread·Record·Pattern Matching 전제다.
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 전 모듈이 컴파일되는지부터 본다. 헥사고날이라 queue-domain의 포트 시그니처 하나가
      # infrastructure·api·batch·consumer를 한꺼번에 깨뜨린다 — 그 파손을 여기서 잡는다.
      - name: 컴파일 (main + test, 전 모듈)
        run: ./gradlew --no-daemon compileJava compileTestJava

      # @Tag("mysql")/@Tag("redis")/@Tag("kafka")가 붙지 않은 전부. 모듈 목록을 손으로 관리하지 않는다 —
      # 새 순수 테스트는 태그를 안 붙이면 자동으로 여기 들어온다.
      - name: 단위 테스트 (인프라 불필요분 전부)
        run: ./gradlew --no-daemon test -PunitOnly

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/**'
          retention-days: 7

  integration:
    name: 통합 테스트 (MySQL · Redis Cluster 2 · Kafka)
    needs: build
    runs-on: ubuntu-latest

    services:
      # 테스트가 127.0.0.1:3306을 하드코딩한다(TokenJpaTestConfig 등). replica jdbc-url도 3306을
      # 가리키므로 인스턴스는 하나면 된다 — 복제까지 세우는 것은 이 레인이 검증하려는 범위가 아니다.
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: queue_platform
          MYSQL_USER: queueapp
          MYSQL_PASSWORD: queueapp1234
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

      # KRaft 단일 노드. 로컬은 3대지만 여기선 1대면 된다 — @Tag("kafka")가 재는 것은
      # 복제가 아니라 프로듀서·컨슈머의 직렬화 계약이고, 테스트가 브로커 수에 맞춰
      # RF를 정한다(KafkaSerdeContractTest). 복제 설정은 테스트가 아니라 런북 소관이다.
      kafka:
        image: apache/kafka:3.7.1
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        ports:
          - 9092:9092
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"
          --health-interval=10s --health-timeout=10s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Redis 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq redis-server redis-tools

      # 두 클러스터를 로컬과 같은 포트(7001-7008 / 8001-8008)로 띄운다. RedisConfig의 @Value
      # 기본값이 그 목록이라 테스트에 프로퍼티를 주입할 배관이 필요 없다.
      #
      # 🔴 하나로 합치면 안 된다. 두 클러스터가 독립이어야 큐 단위 라우팅(§75)이 검증된다 —
      #    같은 클러스터를 둘로 가리키면 "다른 슬롯이라도 같은 노드면 조용히 성공"하는 구멍이 열린다.
      - name: Redis Cluster 2개 기동
        run: |
          ./scripts/ci/redis-cluster-up.sh 7001
          ./scripts/ci/redis-cluster-up.sh 8001

      # ddl-auto=none이라 스키마를 먼저 넣어야 한다. schema.sql을 통째로 파이프하면
      # 파일 중간의 파티션 운영 절(ALTER TABLE ... DROP PARTITION)까지 실행된다 — 스크립트가 걷어낸다.
      - name: 스키마 주입
        env:
          MYSQL_USER: root
          MYSQL_PASSWORD: root
        run: ./scripts/ci/load-schema.sh

      # yml 기본값은 로컬 3대(9092,9094,9096)다. CI는 1대뿐이라 env로 좁힌다 —
      # 프로덕션과 같은 오버라이드 경로(${KAFKA_BOOTSTRAP})를 그대로 쓴다.
      - name: 통합 테스트 (전체)
        env:
          KAFKA_BOOTSTRAP: localhost:9092
        run: ./gradlew --no-daemon test

      # 🔴 초록은 "돌았다"의 증거가 아니다.
      # 태그 설정이 깨지거나 누가 -PunitOnly를 흘려 넣으면 이 레인은 인프라를 다 띄워 놓고
      # 인프라 테스트를 0건 실행한 채 통과한다 — 정확히 이 레인이 막으려던 실패가 조용히 돌아온다.
      # 그래서 대표 세 건(mysql·redis·kafka 태그 각 하나)이 실제로 실행됐는지 결과 XML로 못박는다.
      - name: 태그된 테스트가 실제로 돌았는지 확인
        run: |
          set -e
          for t in TokenAdmitQueryIntegrationTest RedisQueueEngineRoutingTest KafkaSerdeContractTest; do
            f=$(find . -path '*/build/test-results/test/TEST-*'"$t"'.xml' | head -1)
            [ -n "$f" ] || { echo "$t 결과가 없다 — 인프라 테스트가 실행되지 않았다" >&2; exit 1; }
            n=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | tr -dc 0-9)
            [ "${n:-0}" -gt 0 ] || { echo "$t 가 0건 실행됐다" >&2; exit 1; }
            echo "$t: $n건"
          done

      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/build/reports/tests/**'
          retention-days: 7

  images:
    name: 이미지 빌드
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: queue-api
            port: '8080'
          - module: queue-batch
            port: '8081'
          - module: queue-consumer
            port: '8082'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 푸시하지 않는다. 레지스트리를 아직 안 정했고, 여기서 지키려는 것은
      # "Dockerfile이 실제로 구워지는가"이지 배포가 아니다.
      - name: ${{ matrix.module }} 이미지
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            MODULE=${{ matrix.module }}
            APP_PORT=${{ matrix.port }}
          # GitHub Actions 캐시. 이미지 안에서 Gradle을 돌리므로 캐시가 없으면
          # 매 실행이 의존성을 처음부터 받는다.
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,scope=${{ matrix.module }},mode=max
