# queue-platform — bridge 네트워크 판 (인프라까지 전부 컨테이너).
#
#   docker compose -f docker-compose.bridge.yml up -d redis-a-1 redis-a-2 redis-a-3 \
#                                                    redis-b-1 redis-b-2 redis-b-3 kafka
#   ./scripts/bridge-init.sh          # 클러스터 2개 구성 + 토픽 생성 (최초 1회)
#   docker compose -f docker-compose.bridge.yml up -d queue-api queue-batch queue-consumer
#
# ─────────────────────────────────────────────────────────────────────────────
# 🔑 docker-compose.local.yml 과 무엇이 다른가
#
#   local  : network_mode: host  → 컨테이너 안에서도 127.0.0.1 이 성립한다.
#            그래서 Redis 의 cluster-announce-ip 도, Kafka 의 advertised.listeners 도
#            설정할 필요가 **없다**. 문제를 푼 게 아니라 피해 간 것이다.
#   bridge : 컨테이너마다 자기 IP 를 갖는다 → 그 둘을 반드시 설정해야 한다.
#            AWS/k8s 에서 만나는 것과 **같은 문제**다.
#
# 🔑 왜 static IP 인가
#   Redis 의 cluster-announce-ip 는 **IP 만 받는다**(호스트명 불가). 클라이언트는
#   MOVED 응답에 담긴 그 문자열로 직접 접속하므로, 노드가 광고하는 주소가 실제로
#   닿는 주소여야 한다. AWS 에서 "노드의 프라이빗 IP를 announce 한다"와 같은 구조다.
#
# ⚠️ 이 판은 **축소판**이다. 호스트 systemd 판(클러스터당 4M+4R, Kafka 3대)과 다르다:
#      - Redis 클러스터당 마스터 3 · 레플리카 0  → failover 검증 불가 (MOVED 재현이 목적)
#      - Kafka 1 브로커 RF=1                     → ISR 검증 불가
#      - MySQL 은 호스트 것을 쓴다               → 아래 참조
#    이유는 가용 RAM 3.6GB. 호스트 인프라를 안 내리고 **병행**하기 위한 예산이다.
#
# ⚠️ MySQL 을 컨테이너로 안 올린 이유
#    MySQL 은 announce 계열 문제가 없다(평범한 TCP 서비스). master+replica GTID 복제와
#    스키마·SSL 인증서를 새로 세우는 비용만 크고 **새로 드러나는 실패 모드가 0**이다.
#    대신 host-gateway 로 붙는다 — 이건 Step 3 의 AWS 토폴로지(app 노드 ↔ data 노드)와
#    같은 모양이라 오히려 더 닮았다. prod 의 DB_MASTER_HOST 계약도 그대로 검증된다.
# ─────────────────────────────────────────────────────────────────────────────

# 🔴 프로젝트명을 반드시 분리한다. compose 의 기본 프로젝트명은 **디렉터리 이름**이고,
#    docker-compose.local.yml 과 서비스명(queue-api/batch/consumer)이 같다.
#    분리하지 않으면 이 파일로 up 하는 순간 compose 가 "같은 서비스"로 보고
#    local 판 컨테이너를 **조용히 교체한다**(2026-09-11 실제로 밟았다).
name: queue-bridge

networks:
  queuenet:
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── Redis 공통 ────────────────────────────────────────────────────────────────
# 설정 파일을 만들지 않고 인자로 넘긴다. 노드 6개에 conf 6벌을 두면 announce-ip 만
# 다른 파일이 6개가 되고, 한 곳만 고치는 사고가 난다(이 레포의 반복 패턴이다).
#
# appendonly/noeviction 은 호스트 판과 **같은 값**이다 — 되돌리지 말 것(유실 감지 전제).
# maxmemory 만 1gb → 128mb 로 줄였다. 상한이지 할당이 아니다.
x-redis: &redis
  image: redis:7-alpine
  restart: unless-stopped
  networks: [queuenet]

services:

  # ── Redis Cluster A (172.28.1.x) ───────────────────────────────────────────
  redis-a-1:
    <<: *redis
    container_name: br-redis-a-1
    networks: { queuenet: { ipv4_address: 172.28.1.1 } }
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --cluster-require-full-coverage yes
      --cluster-announce-ip 172.28.1.1 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
      --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --protected-mode no

  redis-a-2:
    <<: *redis
    container_name: br-redis-a-2
    networks: { queuenet: { ipv4_address: 172.28.1.2 } }
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --cluster-require-full-coverage yes
      --cluster-announce-ip 172.28.1.2 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
      --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --protected-mode no

  redis-a-3:
    <<: *redis
    container_name: br-redis-a-3
    networks: { queuenet: { ipv4_address: 172.28.1.3 } }
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --cluster-require-full-coverage yes
      --cluster-announce-ip 172.28.1.3 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
      --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --protected-mode no

  # ── Redis Cluster B (172.28.2.x) — A 와 완전 독립, 슬롯 공유 없음 (§75) ──────
  redis-b-1:
    <<: *redis
    container_name: br-redis-b-1
    networks: { queuenet: { ipv4_address: 172.28.2.1 } }
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --cluster-require-full-coverage yes
      --cluster-announce-ip 172.28.2.1 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
      --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --protected-mode no

  redis-b-2:
    <<: *redis
    container_name: br-redis-b-2
    networks: { queuenet: { ipv4_address: 172.28.2.2 } }
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --cluster-require-full-coverage yes
      --cluster-announce-ip 172.28.2.2 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
      --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --protected-mode no

  redis-b-3:
    <<: *redis
    container_name: br-redis-b-3
    networks: { queuenet: { ipv4_address: 172.28.2.3 } }
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --cluster-require-full-coverage yes
      --cluster-announce-ip 172.28.2.3 --cluster-announce-port 6379 --cluster-announce-bus-port 16379
      --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction --protected-mode no

  # ── Kafka (KRaft 단일 노드) ────────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.0.0
    container_name: br-kafka
    restart: unless-stopped
    networks: { queuenet: { ipv4_address: 172.28.3.1 } }
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@172.28.3.1:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 🔑 이 한 줄이 bridge 판의 존재 이유다. 클라이언트는 부트스트랩 응답에 담긴
      #    이 주소로 **다시 접속**한다. localhost 로 두면 컨테이너가 자기 자신을 찾아간다.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://172.28.3.1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 🔑 브로커가 1대라 RF=1 이다. min.insync 를 2로 두면 acks=all 프로듀서가
      #    **첫 발행부터 전량 실패**한다(과거에 실제로 밟은 함정).
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m

  # ── 앱 3종 ────────────────────────────────────────────────────────────────
  queue-api:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: queue-api, APP_PORT: "8080" } }
    image: queue-api:local
    container_name: br-queue-api
    networks: [queuenet]
    ports: ["18080:8080"]
    mem_limit: 700m
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    environment: &appenv
      SPRING_PROFILES_ACTIVE: prod
      # 🔑 127.0.0.1 이 아니다. bridge 에서 그건 컨테이너 자신이다.
      DB_MASTER_HOST: host.docker.internal
      DB_MASTER_PORT: "3306"
      DB_REPLICA_HOST: host.docker.internal
      DB_REPLICA_PORT: "3307"
      DB_USERNAME: queueapp
      DB_PASSWORD: queueapp1234
      REDIS_CLUSTER1_NODES: 172.28.1.1:6379,172.28.1.2:6379,172.28.1.3:6379
      REDIS_CLUSTER2_NODES: 172.28.2.1:6379,172.28.2.2:6379,172.28.2.3:6379
      KAFKA_BOOTSTRAP: 172.28.3.1:9092
      SERVER_PORT: "8080"
      # prod 프로필이 요구한다. 로컬 검증용 값이며 운영 시크릿이 아니다.
      JWT_ACTIVE_KID: key-bridge-01
      JWT_SECRET_CURRENT: queue-platform-BRIDGE-current-secret-must-be-32-bytes-or-more

  queue-batch:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: queue-batch, APP_PORT: "8081" } }
    image: queue-batch:local
    container_name: br-queue-batch
    networks: [queuenet]
    ports: ["18081:8081"]
    mem_limit: 600m
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    environment:
      <<: *appenv
      SERVER_PORT: "8081"

  queue-consumer:
    build: { context: ., dockerfile: Dockerfile, args: { MODULE: queue-consumer, APP_PORT: "8082" } }
    image: queue-consumer:local
    container_name: br-queue-consumer
    networks: [queuenet]
    ports: ["18082:8082"]
    mem_limit: 600m
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped
    environment:
      <<: *appenv
      SERVER_PORT: "8082"
