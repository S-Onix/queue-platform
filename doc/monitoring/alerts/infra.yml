# 인프라 알람 규칙 — Queue Platform
#
# 🔴 **이 파일의 원칙이 2026-09-04에 바뀌었다.** 아래 옛 원칙을 먼저 읽고, 그다음 무엇이
#    바뀌었는지를 읽어라. 옛 원칙만 읽고 규칙을 지우는 일이 없게 하기 위해 둘 다 남긴다.
#
# [옛 원칙 — 2026-08~09-03]
#   이 파일에 있는 규칙은 전부 "임계값이 필요 없는 것"만 골랐다.
#   이 프로젝트는 아직 부하 기준선이 없다. 근거 없는 숫자를 규칙에 박으면 그 숫자가
#   나중에 "이미 정해진 값"으로 굳어 아무도 다시 묻지 않는다. 그래서 아래 4종만 썼다.
#
#     1) 프로세스가 죽었다        (up == 0 / redis_up == 0 — 임계값 개념이 없다)
#     2) 이진 상태가 뒤집혔다      (quorum 실패, 복제 링크 끊김)
#     3) 구성 사고               (master가 둘)
#     4) 한도가 명시된 자원의 추세  (maxmemory 1GB가 config에 박혀 있다 → 절대값이 아니라 도달 예측)
#
# [지금 원칙 — 2026-09-04, 사용자 결정]
#   "모니터링에 대한 경고는 일단 전부 알람으로 간다. 실제로 대응하는 것은 그 다음 문제다."
#
#   즉 **"기준선이 없다" / "조치 레버가 없다"는 더 이상 보류 사유가 아니다.** 관측이 되는
#   것은 일단 규칙으로 만든다. 그 대신 옛 원칙이 지키려던 것은 **표기**로 지킨다:
#
#     ▸ 임계값을 쓴 규칙은 **근거 유무를 주석에 반드시 명시한다.** 근거가 없으면
#       "🔴 임계값 근거: 없다"라고 쓴다. 이 문구를 지우지 마라 — 지우는 순간 그 숫자가
#       "이미 정해진 값"으로 굳는다. 옛 원칙이 막으려던 것이 정확히 그것이었다.
#     ▸ 기준선을 잰 것은 "임계값의 근거"가 아니라 **"지금은 안 울린다"의 확인**으로만 쓴다.
#       로컬 WSL2 수치를 프로덕션 근거로 승격하지 않는다.
#
#   그래서 이 파일은 이제 위 4종에 더해 **5) 기준선 없이 정한 임계값**을 포함한다.
#   커스텀 애플리케이션 메트릭 규칙은 이 파일이 아니라 `app.yml`에 있다.
#
# 아직 규칙으로 만들지 못한 것(= 대상 메트릭이 아예 없는 것)은 파일 맨 아래 <보류> 절에
# 남겼다. 주석은 발화하지 않으므로 "규칙이 있다"는 착각을 만들지 않는다.
#
# ─────────────────────────────────────────────────────────────────────────────
# severity 체계 (이 레포 첫 규칙이라 여기서 정의한다)
#
#   critical : 서비스가 지금 죽었거나, "다음 장애를 복구할 수단"이 사라졌다. 사람을 깨운다.
#   warning  : 사용자 영향은 아직 없다. 방치하면 critical이 된다. 업무 시간에 본다.
#   info     : 로컬 환경의 사실 표기. 절대 깨우지 않는다.
#              (로컬은 앱을 안 띄운 시간이 대부분이라 상시 firing이 정상이다.
#               이걸 warning에 섞으면 warning 등급 전체가 오염된다 → 등급으로 격리한다)
#
# ⚠️ Alertmanager는 **AWS에만 설치돼 있다**(2026-09-17, infra/aws/data.yml). severity는 거기서
#    실제로 라우팅한다 — critical은 group_wait 10s·repeat 1h, warning은 상위 알람에 억제된다
#    (inhibit_rules). **로컬은 여전히 미설치**라 firing 확인이 http://localhost:9090/alerts 눈이다.
#    🔑 그리고 AWS에서도 **사람에게 가는 마지막 구간은 비어 있다** — receiver가 채널 없이
#    비어 있어 알람은 Alertmanager까지만 모인다. 확인: `curl -s localhost:9093/api/v2/alerts`
#
# ⚠️ 전제: evaluation_interval=15s, scrape_interval=15s (실가동 prometheus.yml 실측)
#    `for:` 값은 전부 "스크레이프 N회 연속"으로 환산해 근거를 각 규칙에 적었다.
# ─────────────────────────────────────────────────────────────────────────────

groups:

  # ===========================================================================
  # 1. 죽었다
  # ===========================================================================
  - name: queue-platform-liveness
    rules:

      # 앱 프로세스가 스크레이프에 응답하지 않는다.
      #
      # ⚠️ 로컬에서는 이 규칙이 거의 항상 firing이다 — 앱을 상시 띄우지 않기 때문.
      #    그래서 severity=info다. "앱이 안 떠 있다"는 사실 표기이지 사고 통보가 아니다.
      #    prod 타깃(관리 포트 분리 후, Sprint 11)이 job으로 추가되면 그 job만 critical로 올린다.
      #
      # 🔧 옛 주석은 "queue-batch는 actuator 의존성이 없어 스크레이프 대상이 아니다"였는데
      #    거짓이다 — queue-batch/build.gradle에 actuator·micrometer가 둘 다 있고(`6647ca5`),
      #    아래 정규식도 이미 queue-batch를 포함한다. 주석이 자기 아래 규칙과 모순이었다.
      # ⚠️ 다만 prod 프로필은 prometheus를 노출하지 않는다(경계가 없는 동안은 열지 않는다,
      #    2026-09-02). prod job을 추가할 때는 노출을 다시 켜는 것이 선행이다.
      - alert: AppInstanceDown
        expr: up{job=~"queue-.*"} == 0
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) 스크레이프 실패 2분"
          impact: "그 인스턴스로 가던 요청이 전부 실패한다. 남은 인스턴스가 부하를 나눠 받으므로 **다음 인스턴스가 연쇄로 넘어질 수 있다.**"
          action: "① `docker ps -a --filter name=q-api` 로 컨테이너가 떠 있는지 본다. 로컬이면 앱을 안 띄운 것이 원인이니 여기서 끝이다 → ② 떠 있는데 스크레이프가 안 되면 포트를 본다: `ss -lnt | grep -E ':808[0-4]'` (api 8080/8083/8084 · batch 8081 · consumer 8082). 포트가 열려 있으면 네트워크/방화벽 문제이므로 ④ 로 간다 → ③ 죽어 있으면 되살린다: `docker start <① 에서 본 이름>`. 2분 안에 이 알람이 해소되면 끝이다. 바로 또 죽으면 `docker logs --tail 50 <① 에서 본 이름>` 와 `docker inspect <① 에서 본 이름> | grep -E '\"OOMKilled\"|\"ExitCode\"'` 를 본다 — **true / 137 이면 메모리 한도 초과**이고 JvmMemoryNearContainerLimit 조치로 넘어간다 → ④ 그래도 안 되면 인프라 담당에게 넘긴다. 넘길 것: 컨테이너 상태 · 로그 50줄 · OOMKilled 값 ⚠️ 남은 인스턴스가 부하를 나눠 받으므로 **연쇄로 넘어질 수 있다** — 하나 살린 뒤 나머지도 함께 확인해라"

      # Redis 인스턴스가 죽었다.
      #
      # 🔴 여기서 `up`을 쓰면 안 된다. redis_exporter는 멀티타깃 모드(1 프로세스가 22개 담당)라
      #    Redis가 죽어도 익스포터는 HTTP 200을 돌려준다 → `up`은 1로 남는다.
      #    죽음이 드러나는 곳은 익스포터가 내려주는 `redis_up`이다. 실측으로 확인했다.
      #    (이걸 모르고 `up{job="redis"}==0`으로 쓰면 Redis가 죽어도 영원히 침묵한다)
      #
      # job=redis 3대(6379/6380/6381)는 앱이 실제로 붙는 Redis다. job=redis-sentinel 3대가
      # 죽으면 failover가 불가능해진다. 둘 다 critical.
      #
      # for: 1m — Sentinel failover 실측이 5~10초다(doc/INFRA_SETUP.md). 1분이면 failover
      #           과정은 안 걸리고 진짜 다운만 걸린다.
      - alert: RedisInstanceDown
        expr: redis_up{job=~"redis|redis-cluster"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis {{ $labels.instance }} ({{ $labels.job }}) 응답 없음 1분"
          impact: "그 마스터에 걸린 큐 전체가 멈춘다 — 한 큐의 키 4종은 한 마스터에 고정된다(§75 D26). **다른 마스터의 큐는 멀쩡해서 '일부만 죽은' 상태가 된다.**"
          action: "① 어느 노드가 죽었는지 확인한다. **아무 노드에나 접속하면 전체 목록이 나온다**: `docker exec q-redis-a-1 redis-cli -c -p 7001 cluster nodes` (B 면 -p 8001). fail 이 붙은 줄을 찾는다 — 끝이 connected 로 돌아왔으면 이미 해소된 것이다 → ② 죽어 있으면 그 노드만 되살린다: `docker start q-redis-a-N` (N 은 포트 끝자리 — 7003 이면 a-3, 8003 이면 b-3). 1분 뒤 ① 을 다시 봐서 connected 면 끝이다 → ③ 올라왔는데 cluster_state 가 ok 가 아니면 RedisClusterDegraded 조치로 넘어간다 → ④ 안 올라오면 인프라 담당에게 넘긴다. 넘길 것: cluster nodes 전문 · `docker logs --tail 50 q-redis-a-N` ⚠️ **Sentinel(옛 구성) 명령을 치지 마라** — 운영은 Cluster 이고 Sentinel 은 학습 자산이다. 🔑 죽은 마스터에 걸린 큐만 멈춘다. 다른 큐는 멀쩡해서 전면 장애로 보이지 않는다"

      # 익스포터 자체가 죽었다 = 위 RedisInstanceDown 규칙이 침묵한다.
      #
      # 시계열이 사라지면 `== 0` 규칙은 발화하지 않는다(빈 벡터). 즉 "감시가 죽은 것"을
      # 알려주는 규칙이 따로 필요하다. 이게 없으면 Redis 관측 전체가 조용히 눈이 먼다.
      #
      # redis/redis-sentinel/redis-cluster는 전부 같은 9121 프로세스라 하나가 죽으면 다 죽는다.
      # mysql은 인스턴스당 익스포터 1개(9104/9105)이므로 별개 실패다.
      #
      # 🔴 **node를 2026-09-09에 추가했다 — 그전까지 `up{job="node"}` 규칙이 레포 전체에 0건이었다.**
      #    node_exporter가 죽으면 HostClockNotSynchronized와 DiskWillFill이 **둘 다 조용히 통과**한다.
      #    시계 알람을 새로 넣으면서 그 알람이 딛고 선 익스포터가 무감시라는 것이 드러났다.
      #    ⚠️ 감시 대상을 늘릴 때는 **그 신호의 공급자도 이 정규식에 있는지** 함께 확인해라.
      - alert: ExporterDown
        expr: up{job=~"redis|redis-cluster|mysql|node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "익스포터 응답 없음 — {{ $labels.job }} {{ $labels.instance }} (해당 인프라 지표 전체 소실)"
          impact: "해당 인프라 지표가 통째로 빈다. 그러면 그 위의 알람들이 **전부 조용해지는데, 그 침묵이 정상과 구분되지 않는다.**"
          action: "🔑 이 알람이 떠 있는 동안 그 계층의 알람이 **전부 조용해진다.** 침묵이 정상과 구분되지 않으므로 우선순위가 높다. ① 어느 익스포터인지는 라벨 job 으로 안다(redis / node / mysql). `docker ps -a --filter name=exporter` 와 `docker ps -a --filter name=q-node-exporter` 로 상태를 본다 → ② 죽어 있으면 되살린다: `docker start q-redis-exporter` (또는 q-node-exporter). 2분 안에 해소되면 끝이다 → ③ 떠 있는데 스크레이프가 안 되면 대상 포트를 확인한다: redis-exporter 9121 · node-exporter 9100. `curl -s localhost:9121/metrics | head -3` 가 응답하는지 본다 → ④ 그래도 안 되면 인프라 담당에게 넘긴다. 넘길 것: job 라벨 · 컨테이너 상태 · curl 응답 · **그동안 침묵 중인 알람 목록** ⚠️ mysqld-exporter 는 **원래 안 띄운다** — MySQL 계열이면 MysqlExporterCannotConnect 조치를 보라"

      # mysqld_exporter는 살아 있는데 MySQL에 붙지 못한다.
      #
      # ✅ 해소됨 (2026-08-28 실측). 전용 계정 exporter@localhost 가 생성돼 있고 권한도 맞다:
      #    GRANT SELECT, PROCESS, REPLICATION CLIENT ON *.* — 그래서 collect.slave_status 가
      #    master·replica 양쪽에서 1이고 mysql_slave_status_seconds_behind_master 가 실제로 나온다.
      #    (당시 값 0초). mysql_up 은 양쪽 1이라 이 규칙은 firing 이 아니다.
      #    규칙 자체는 남긴다 — 계정이 지워지거나 만료되면 다시 이 신호로 드러나야 한다.
      #    DB 자체 장애가 아니므로 critical이 아니라 warning이다 — 이 구분이 중요하다.
      - alert: MysqlExporterCannotConnect
        expr: mysql_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mysqld_exporter가 {{ $labels.application }}에 접속 못 함 — MySQL 지표 전체가 비어 있다"
          impact: "MySQL 지표가 전부 빈다 — 복제 정지·지연 알람이 **영원히 안 뜬다.** 서비스는 멀쩡해 보인다."
          action: "에스컬레이션 필요 — 모니터링 계정 생성은 DB 권한 작업이라 당직 범위가 아니다. ① 수집: `docker ps -a --filter name=mysqld-exporter` 로 가른다. 🔑 판단: **출력이 비어 있으면** 익스포터를 안 띄운 것이라 **이 알람은 설정 누락이지 장애가 아니다**(현재 AWS 가 그 상태다). **떠 있는데 Exited 면** 접속 실패이므로 `docker logs --tail 50 <이름>` 을 함께 적는다 → ② 임시 조치: 없다. 🔑 이 알람이 떠 있는 동안 MySQL 복제 알람 3개가 통째로 침묵한다는 사실을 기록해 둔다 → ③ DBA 담당에게 넘긴다. 넘길 것: 익스포터 존재 여부 · 오류 로그 · 침묵 중인 알람 목록 ⚠️ 계정을 임의로 만들지 마라(PROCESS·REPLICATION CLIENT·SELECT 권한 결정이 필요하다)"

  # ===========================================================================
  # 2. 이진 상태가 뒤집혔다 / 구성 사고
  # ===========================================================================
  - name: queue-platform-redis-state
    rules:

      # 복제 링크가 끊겼다. slave가 master를 따라잡지 못하는 게 아니라 "연결 자체가 없다".
      # 이 상태에서 failover가 나면 승격된 노드가 오래된 데이터를 갖는다 = 대기열 유실.
      # 값이 0/1뿐이라 임계값 개념이 없다.
      - alert: RedisReplicationBroken
        expr: redis_master_link_up{job=~"redis|redis-cluster"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis 복제 끊김 — {{ $labels.instance }} → master {{ $labels.master_host }}:{{ $labels.master_port }}"
          impact: "복제본이 뒤처진 채 멈춘다. 마스터가 죽으면 그 시점까지의 대기열만 남는다 — **failover 해도 줄이 옛날 상태다.**"
          action: "① 어느 노드가 문제인지부터 확인한다. **아무 노드에나 접속하면 전체 목록이 나온다**: `docker exec q-redis-a-1 redis-cli -c -p 7001 cluster nodes` (B 클러스터면 -p 8001). 알람의 instance 와 같은 주소를 가진 줄을 찾아 맨 끝을 본다 — connected 면 이미 해소된 것이다 → ② disconnected 이거나 fail 플래그가 있으면 그 노드만 되살린다: `docker start q-redis-a-N` (N 은 포트 끝자리 — 7003 이면 a-3, 8003 이면 b-3). 2분 뒤 ① 을 다시 봐서 connected 면 끝이다 → ③ 안 바뀌면 인프라 담당에게 넘긴다. 넘길 것: cluster nodes 전문 · `docker logs --tail 50 q-redis-a-N` ⚠️ `CLUSTER FAILOVER` 를 치지 마라 — 뒤처진 복제본이 승격돼 그만큼의 대기열이 사라진다"

      # Sentinel quorum이 깨졌다 = master가 죽어도 승격이 불가능하다.
      # "지금 서비스는 멀쩡한데 다음 장애를 복구할 수단이 사라진" 전형적 critical이다.
      # ckquorum은 Sentinel이 직접 계산해 1/0으로 내려준다 → 임계값 없음.
      # ⚠️ 이 규칙만 **앱과 무관**하다. Sentinel은 §75로 코드에서 제거됐고 학습·로컬 자산으로만 남았다.
      #    울려도 서비스 영향은 없다 — Sentinel 실습 환경이 깨진 것이다.
      - alert: RedisSentinelQuorumLost
        expr: redis_sentinel_master_ckquorum_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sentinel 정족수 미달 — {{ $labels.instance }} / master={{ $labels.master_name }}"
          impact: "자동 failover 가 불가능해진다. 마스터가 죽어도 **아무도 승격시키지 못해** 그 큐들이 복구되지 않는다."
          action: "🔑 **먼저 확인할 것: 서비스 영향이 없을 가능성이 높다.** 운영 대기열은 Redis Cluster(7001~·8001~)에서 돌고 Sentinel(마스터가 죽으면 대신 승격시켜 주는 옛 구성, 26379~)은 학습·로컬 자산이라 서비스와 무관하다. ① 대기열이 멀쩡한지 1분 안에 확인한다: `docker exec q-redis-a-1 redis-cli -c -p 7001 cluster info` 의 cluster_state:ok (B 는 -p 8001 로 한 번 더). 둘 다 ok 면 **사용자 영향이 없다.** ③ 까지 기록만 남기고 아침으로 넘겨라 — 🔑 이 알람이 critical 인 것은 Sentinel 을 쓰는 구성에서의 등급이다 → ② Sentinel 쪽을 볼 거면: `redis-cli -p 26379 sentinel masters` 로 몇 대가 살아 있는지 센다. 3대 중 2대 미만이면 정족수 미달이다 → ③ 죽은 프로세스만 다시 띄운다. 그래도 안 되면 인프라 담당에게 넘긴다. 넘길 것: cluster_state 두 개 · sentinel masters 출력 ⚠️ 이 상태에서 감시 대상 마스터를 재기동·강제 종료하지 마라 — 자동 승격이 안 되므로 그대로 멈춘다"

      # master가 둘 이상이다 = split-brain 또는 구성 사고.
      # 앱이 어느 쪽에 쓰느냐에 따라 대기열이 조용히 갈린다. 조용한 실패라 규칙으로만 잡힌다.
      #
      # for: 2m — failover 직후 옛 master가 살아 돌아오면 Sentinel이 slaveof로 되돌리기까지
      #           수 초간 둘로 보인다. 2분이면 그 정상 과도구간을 넘긴다.
      #
      # master가 0개인 경우는 넣지 않았다: 시계열이 사라져 `!= 1`이 발화하지 않을뿐더러,
      # RedisInstanceDown / RedisSentinelQuorumLost가 이미 잡는다. 규칙을 겹쳐 놓지 않는다.
      # 🔴 구 규칙 RedisMultipleMasters(count(role="master") > 1)는 **Cluster에 그대로 옮길 수 없다.**
      #    Sentinel은 마스터가 하나뿐이라 2개 이상이 split-brain이었지만, Cluster는 **4 마스터가 정상**이다.
      #    같은 사고(슬롯을 아무도 담당 못 함)를 Cluster에서 보는 지표는 cluster_state / slots_fail 이다.
      - alert: RedisClusterDegraded
        expr: min(redis_cluster_state{job=~"redis|redis-cluster"}) != 1
              or max(redis_cluster_slots_fail{job=~"redis|redis-cluster"}) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          # 🔴 2026-08-28 정정: expr은 Cluster를 보는데 summary·action이 Sentinel 원문 그대로였다.
          #    $value 도 틀렸다 — 이 expr의 값은 cluster_state(0/1)이지 master 개수가 아니다.
          #    그대로 두면 새벽에 Cluster 노드에 SLAVEOF 를 치게 된다. 커밋 de24048이 다른 알람의
          #    $value 를 고칠 때 이 건이 빠져 있었다.
          summary: "Redis Cluster가 온전하지 않다 — cluster_state={{ $value }} (정상 1) 또는 slots_fail>0 ({{ $labels.instance }})"
          impact: "**키 공간의 일부 구간(슬롯)이 주인을 잃는다.** 그 구간에 속한 큐는 enqueue·폴링·admit 이 전부 실패하고, **나머지 큐는 정상이라 전체 장애로 보이지 않는다.**"
          action: "① 상태를 본다: `docker exec q-redis-a-1 redis-cli -c -p 7001 cluster info` 의 **cluster_state 와 slots_fail** (B 면 -p 8001). cluster_state:ok 이고 slots_fail:0 이면 이미 해소된 것이다 → ② 문제 노드를 특정한다: `cluster nodes` 에서 fail 플래그가 붙은 줄을 찾는다 → ③ 그 노드만 되살린다: `docker start q-redis-a-N`. 2분 뒤 ① 을 다시 봐서 ok 면 끝이다 → ④ ok 로 안 돌아오면 인프라 담당에게 넘긴다. 넘길 것: cluster info · cluster nodes 전문 · 해당 노드 로그 50줄 ⚠️ **앱 재시작보다 이게 먼저다** — 그 구간이 주인 없는 상태에서 앱을 올려도 같은 오류가 난다. 🔑 그 구간에 속한 큐만 죽고 나머지는 정상이라 부분 장애로 보인다"

  # ===========================================================================
  # 2-b. MySQL 복제 (2026-09-04 <보류>에서 승격 — 사용자 결정)
  # ===========================================================================
  # ⚠️ 시계열은 **replica 익스포터(9105) 한 곳에서만** 나온다(실측: 위 세 메트릭 전부 count=1).
  #    master(9104)에는 slave_status가 없다. 그래서 instance 필터를 걸지 않는다 —
  #    걸면 포트가 바뀔 때 조용히 침묵한다.
  # ===========================================================================
  - name: queue-platform-mysql-replication
    rules:

      # 복제가 멈췄다. IO 스레드(master에서 가져오기) 또는 SQL 스레드(적용하기)가 죽었다.
      #
      # 임계값 근거: **불필요하다.** 값이 0/1뿐인 이진 상태다(옛 원칙 2번 분류).
      #
      # 왜 critical인가: 지금 사용자 경로는 안 깨진다 — 앱이 replica를 읽는 경로는 **0곳**이다
      # (CLAUDE.md §4-3, 2026-09-02 반사실 실측). replica는 순수 DR 자산이다.
      # 그래서 이것은 "다음 장애를 복구할 수단이 사라졌다"는 전형적 critical이다.
      # RedisSentinelQuorumLost와 같은 계열이며 severity 정의 그대로다.
      #
      # for: 1m — 4회 연속. 복제 재시작(STOP/START SLAVE) 중의 순간적 0을 넘긴다.
      - alert: MysqlReplicationStopped
        expr: |
          mysql_slave_status_slave_sql_running == 0
          or mysql_slave_status_slave_io_running == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 복제 정지 — {{ $labels.instance }} (IO 또는 SQL 스레드 중단)"
          impact: "복제본이 **장애 대비용 사본으로서** 죽는다. 앱은 master 만 읽으므로 **서비스는 멀쩡하고 아무도 모른 채 복구 지점만 뒤로 밀린다.**"
          action: "에스컬레이션 필요 — 복구에 GTID 판단이 들어가고, 틀리면 트랜잭션이 영구 유실된다. ① 수집: `docker exec q-mysql sh -c 'mysql -uroot -p$MYSQL_ROOT_PASSWORD -e \"SHOW REPLICA STATUS\\G\"'` (로컬이면 mysql -h127.0.0.1 -P3307) 에서 **Last_IO_Error · Last_SQL_Error · Retrieved_Gtid_Set · Executed_Gtid_Set** 를 통째로 복사한다. 🔑 판단: Replica_IO_Running 과 Replica_SQL_Running 이 **둘 다 Yes 면** 이미 해소된 것이다. 하나라도 No 면 그 옆의 오류 문구가 원인이다 → ② 임시 조치: 네트워크·디스크 풀처럼 원인이 명백하고 해소됐으면 `START REPLICA` 한 번은 해도 된다. 그 외에는 없다 → ③ DBA 담당에게 넘긴다. 넘길 것: 위 네 값 전문 · 중단 시각 ⚠️ SQL_SLAVE_SKIP_COUNTER 나 GTID 건너뛰기를 하지 마라 — 건너뛴 트랜잭션은 영원히 사라지고 그 사실이 어디에도 안 남는다. 🔑 서비스는 멀쩡하다(앱은 replica 를 안 읽는다). 급한 것은 복구 지점이 뒤로 밀리는 것뿐이다"

      # 복제 지연이 30초를 넘어 5분간 유지된다.
      #
      # 🔴 **임계값 근거: 약하다(로컬 관측 기반, 프로덕션 근거 아님).**
      #    2026-09-04 Prometheus 24시간 실측(job=mysql, instance=9105):
      #      - lag > 0 인 분(分)이 **992분 중 4분** (01:20 / 13:24 / 15:50 / 16:01)
      #      - 15초 스크레이프 기준 lag>0 표본 10개 / p99 = 0초 / p99.9 = 1초 / 최댓값 = 40초
      #      - 30초를 넘긴 표본은 **1개**이고 연속되지 않았다(단발 스파이크)
      #    → "30초가 5분간 유지"는 관측된 기준선에서 **발화 0회**다. 그래서 오탐은 안 난다.
      #    ⚠️ 그러나 "30"이라는 숫자 자체는 여전히 임의다. 부하 중 분포는 아직 안 쟀다.
      #       프로덕션에서 다시 재라. 로컬 WSL2 idle 수치를 용량 근거로 승격하지 마라.
      #
      # 🔴 **이 규칙은 "복제가 멈춘 것"을 못 잡는다.** SQL 스레드가 죽으면
      #    seconds_behind_master 는 커지는 게 아니라 **NULL**이 되고 시계열이 사라진다.
      #    빈 벡터는 발화하지 않는다. 그 경우는 위 MysqlReplicationStopped 담당이다.
      #    둘은 겹치는 규칙이 아니라 **서로의 사각을 메우는 짝**이다. 하나만 남기지 마라.
      #
      # warning인 이유: 앱이 replica를 읽지 않으므로 사용자 영향이 지금은 0이다.
      # 방치하면 DR 복구 지점이 뒤로 밀린다 → 방치 시 critical, 정확히 warning 정의다.
      - alert: MysqlReplicationLagHigh
        expr: mysql_slave_status_seconds_behind_master > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 복제 지연 {{ $value }}초 5분 지속 — {{ $labels.instance }} (장애가 났을 때 되돌릴 수 있는 지점이 그만큼 뒤에 있다)"
          impact: "장애가 나면 이 지연만큼의 과금 기록을 잃는다. 과금 대상 토큰이 그 구간에 있으면 **청구 근거가 사라진다.**"
          action: "에스컬레이션 필요 — 지연을 줄이는 수단이 당직 범위에 없다. ① 수집: `docker exec q-mysql sh -c 'mysql -uroot -p$MYSQL_ROOT_PASSWORD -e \"SHOW REPLICA STATUS\\G\"'` (로컬이면 mysql -h127.0.0.1 -P3307 -uroot -p) 에서 **Seconds_Behind_Source 와 Relay_Log_Space** 를 적는다. 🔑 판단: Seconds_Behind_Source 가 **줄고 있으면** 따라잡는 중이니 10분 뒤 다시 본다. **늘고 있거나 NULL 이면** 복제가 멈춘 것이므로 MysqlReplicationStopped 조치로 간다. 월별 파티션 DROP 이 방금 돌았는지도 확인한다(DROP 은 테이블 잠금 을 3초 잡는다, 실측) → ② 임시 조치: 없다 → ③ DBA 담당에게 넘긴다. 넘길 것: 지연 초 · Relay_Log_Space · 대량 DDL/DELETE 여부 ⚠️ 지연 중에 복제본으로 조회를 옮기지 마라. 앱이 복제본을 안 읽는 것이 정상이다"

  # ===========================================================================
  # 3. 한도가 명시된 자원의 추세
  # ===========================================================================
  - name: queue-platform-capacity
    rules:

      # maxmemory 도달 예측.
      #
      # 이 규칙만 유일하게 "한도"를 쓰는데, 그 한도가 기준선 추정이 아니라 **config에 박힌 값**이다:
      #   - maxmemory 가 명시 설정돼 있다 (0 = 무제한이 아니다)
      #   - maxmemory-policy = noeviction (실측)
      #   → 한도에 닿는 순간 eviction이 아니라 **쓰기가 OOM으로 거부된다** = enqueue가 죽는다.
      #
      # ⚠️ 한도 숫자를 이 파일에 적지 않는다. 규칙이 redis_config_maxmemory를 그때그때 읽으므로
      #    CONFIG SET으로 값이 바뀌어도 규칙은 따라간다. (실제로 이 규칙을 쓰는 동안 1GiB → 2GiB로
      #    바뀌었다. 주석에 숫자를 박았다면 그 순간부터 거짓말이 됐을 것이다.)
      #
      # 절대값 임계(예: 90%)를 안 쓴 이유:
      #   증가 속도를 모른다(기준선 없음). 90%가 "3시간 뒤"인지 "3초 뒤"인지
      #   모르는 상태에서 90%는 아무 정보가 아니다. 게다가 지금 이 시스템은 admit 미구현이라
      #   `waiting` ZSet에 ZREM 경로가 없다 = 메모리가 **단조 증가**한다. 수준이 아니라 추세가 맞다.
      #
      # 6h는 임계값이 아니라 "얼마나 미리 알고 싶은가"(리드타임)다. 새벽에 깨우지 않고
      # 아침에 조치할 수 있는 여유로 잡았다. 재시작·FLUSH로 메모리가 줄면 기울기가 음수라
      # 예측값이 내려가므로 오탐이 안 난다.
      #
      # `maxmemory > 0` 가드: 한도 미설정(0) 인스턴스가 섞이면 비교가 항상 참이 되어 오탐이 터진다.
      - alert: RedisMemoryWillHitMaxmemory
        expr: |
          predict_linear(redis_memory_used_bytes{job=~"redis|redis-cluster"}[1h], 6 * 3600)
            > redis_config_maxmemory{job=~"redis|redis-cluster"}
          and redis_config_maxmemory{job=~"redis|redis-cluster"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Redis {{ $labels.instance }} 현 추세면 6시간 내 maxmemory 도달 — 가득 차면 지우지 않고 쓰기를 거부하는 설정(noeviction)이라 쓰기(enqueue)가 거부된다"
          impact: "가득 차면 지우지 않고 쓰기를 거부하는 설정(noeviction) 이라 닿는 순간 **쓰기(enqueue)가 503 으로 거부된다.** 같은 마스터를 쓰는 **다른 테넌트까지** 함께 죽는다 — 총량이 남아 있어도 터진다."
          action: "에스컬레이션 필요 — 한도 상향·용량 증설은 당직 범위가 아니다. 🔑 닿으면 그 마스터를 쓰는 **다른 테넌트의 enqueue 까지 503** 이 된다. ① 수집: `docker exec q-redis-a-1 redis-cli -c -p 7001 INFO memory` 의 used_memory 와 maxmemory, `--bigkeys` 로 어느 큐가 키우는지 적는다(B 클러스터면 -p 8001). 🔑 판단: used_memory 가 maxmemory 의 **80% 미만이면** 아직 여유가 있으니 ③ 까지만 하고 아침에 넘긴다. **90% 이상이면** 쓰기 거부가 임박했으므로 즉시 깨워라 — 그 마스터를 쓰는 다른 테넌트까지 함께 죽는다 → ② 임시 조치: 없다. 🪤 유입을 끊으려면 큐 일시 정지가 필요한데 **그 API 는 테넌트 JWT 를 요구해 당직자가 못 친다**(401). ① 의 `--bigkeys` 출력에서 `queue:{<큐ID>}:waiting` 의 중괄호 안이 큐 ID 이니 **그 값을 적어 ③ 에 넘긴다**. 이미 줄 선 사람은 그대로 남고 배출은 계속된다 → ③ 인프라 담당에게 넘긴다. 넘길 것: 노드 · used/maxmemory · 가장 큰 큐와 그 인원 ⚠️ FLUSHALL 금지 — 대기열 전체가 사라진다"

      # 디스크 고갈 예측.
      #
      # 🔴 이 규칙은 2026-09-04까지 **쓸 수 없었다** — node_exporter가 설치돼 있지 않았다.
      #    MONITORING_DESIGN.md는 있다고 적고 있었다(문서 드리프트). 지금은 9100에 떠 있다.
      #
      # 왜 필요한가: `tokens`는 월별 RANGE 파티션이고, DROP이 멈추면 **아무 에러 없이** 계속
      # 쌓인다. 배치 실패 알림보다 디스크 추세가 먼저 잡히는 경우가 있다(DROP은 성공했는데
      # 유지보수 쿼리가 밀린 경우 등). 디스크가 차면 MySQL은 쓰기를 거부한다 = Kafka 적재 정지.
      #
      # 절대값(예: 85%)을 안 쓴 이유는 위 Redis 규칙과 같다 — 증가 속도의 기준선이 없다.
      # 24h는 임계값이 아니라 리드타임이다. 파티션 추가/DROP은 사람 손이 필요하고 하루면 된다.
      # 기울기가 음수(청소해서 공간이 늘면)면 예측값이 커져 자동으로 해제된다.
      #
      # 🪤 mountpoint="/" 로 좁히는 이유: WSL이 같은 ext4를 /var/lib/docker 에도 붙여
      #    동일 파일시스템이 2중으로 잡힌다. 안 좁히면 같은 사건에 알람이 두 번 뜬다.
      - alert: DiskWillFill
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node",mountpoint="/"}[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} 루트 파일시스템 현 추세면 24시간 내 고갈 — MySQL 쓰기가 멈춘다"
          impact: "MySQL 쓰기가 멈춘다. 그 시점부터 **토큰 적재가 통째로 실패**하고 과금 기록이 비기 시작한다."
          action: "에스컬레이션 필요 — 오래된 월별 파티션을 지우는 일은 스키마 조작이라 당직 범위가 아니다. ① 수집: `df -h /` 의 여유 용량과 `sudo du -sh /var/lib/docker/volumes/queue-data_mysql-data/_data` (로컬이면 /var/lib/mysql) 을 적는다. 🔑 판단: `df -h /` 의 Avail 이 **20GB 이상이면** 예측이 성급한 것이니 그 숫자를 적고 아침에 넘긴다. **5GB 미만이면** 즉시 깨워라 — MySQL 쓰기가 멈추면 토큰 적재가 통째로 실패한다 → ② 임시 조치: 로그·코어덤프처럼 명백한 쓰레기 파일 정리는 해도 된다. DB 파일은 건드리지 마라 → ③ DBA 담당에게 넘긴다. 넘길 것: 여유 용량 · MySQL 데이터 크기 · 가장 오래된 월별 파티션 ⚠️ 월별 파티션 DROP 은 테이블 잠금 을 잡아 INSERT 를 함께 막는다(실측 3.05초) — 당직자가 임의로 실행하지 마라"

      # ═══ 시계가 어긋났다. **가용성 + 원장 무결성 문제다.** ═══════════════════════════
      #
      # 🪤 **여기 적힌 원장 손상 시나리오는 §90으로 닫혔다.** 이력으로 남긴다 — 되돌리면 재발한다.
      #    예전엔 `admitted_at`이 **admit을 처리한 API 서버의 시계**로 찍혀 DB에 들어갔는데
      #    (payload 값이었다), complete의 술어는 그 값을 **MySQL의 시계**와 비교했다
      #    (`admitted_at > UTC_TIMESTAMP(3) - INTERVAL 300 SECOND`). 서로 다른 기계의 시계였다.
      #    지금은 `admitted_at`도 MySQL이 찍으므로(TokenJpaAdapter의 ADMITTED ODKU) 비교의
      #    양변이 같은 프로세스에서 나온다 — **원장 판정은 앱 시계 스큐에 면역이다.**
      #    아래 문단은 그 시절의 재현 실측(2026-09-09, 실제 markCompleted SQL)이다.
      #
      #    서버가 S초 뒤처지면 **DB 술어의 창**이 `max(300 − S, 0)`으로 줄어든다.
      #    ⚠️ **엔드포인트의 창과 혼동하지 마라** — complete에는 Redis 폴백(PX 60초, 시계 오차에
      #       면역)이 있어 사용자 기준 창은 `max(300 − S, 60)`이다. S=398이어도 admit 후 60초
      #       안이면 200을 받는다. "S가 크면 즉시 404"가 아니다.
      #
      # 🔴 **그런데 진짜 피해는 404가 아니라 원장 오염이다.** S > 240이면 Redis 폴백(60초)이
      #    DB 창(300−S)보다 길어져 다음이 벌어진다(코드 근거는 QueueEngineService의 complete 폴백 주석):
      #      ① ReconcileJob.expireStaleAdmitted가 그 행을 status=4로 확정
      #      ② 사용자는 폴백으로 **200**을 받고 COMPLETED가 발행된다
      #      ③ 컨슈머 가드가 `IF(tokens.status = 1, ...)`라 status=4에서 **no-op**(TokenJpaAdapter:91)
      #         → 행은 `status=4 / completed_at=NULL`로 **영구 고정**. 재적재로 못 고친다
      #      ④ 같은 요청의 재시도는 404 — 멱등성도 깨진다
      #    Tenant는 200을 받았으니 이상을 감지할 수단이 없다.
      #
      # 🪤 **reconcile이 complete보다 먼저 자르는 것이 아니다.** 둘 다 `admit + (300 − S)`에 닫힌다
      #    — 같은 잘못된 기준 위에서 일관되게 틀린다. 원점은 `admitted_at`이 다른 기계 시계로
      #    쓰였다는 것이다.
      #    🔧 **이 괄호에 있던 문장은 §90으로 거짓이 됐다.** 원래 "reconcile cutoff를 SQL로
      #       옮겨도 이 사고는 안 고쳐진다 — 시계 하나가 줄 뿐이다"라고 적혀 있었는데,
      #       §90이 **`admitted_at`까지 MySQL로 옮기면서** cutoff의 SQL 이관이 비로소
      #       의미를 갖게 됐다(둘을 같이 해야 시계가 정확히 하나가 된다). 실제로 옮겼다
      #       (`TokenJpaRepository.expireStaleAdmitted`가 `UTC_TIMESTAMP(3)`를 직접 쓴다).
      #       🪤 **이 문장을 근거로 그 변경을 되돌리지 마라** — 되돌리면 batch 서버 시계와
      #          `admitted_at`이 다시 갈려 방향만 반대인 같은 사고가 난다.
      #
      # 🔑 **queue_admission_clock_skew_seconds_count은 이 사건을 못 잡는다 — 대신이 아니라 별개다.**
      #    그 카운터의 축은 **enqueue 서버 ↔ admit 서버**(둘 다 앱 시계)인데, 고장 모드의 축은
      #    **앱 ↔ MySQL**이다. API 서버들이 **같은 방향으로** 어긋나면 그 카운터는 영원히 0이고,
      #    그 상태가 정확히 실효 창이 0인 상태다. (dba·monitoring·architect 3인 독립 확인)
      #
      # 🪤 **이건 대리 신호다.** 실제로 문제인 것은 "각 호스트의 NTP 건강"이 아니라
      #    **api 호스트와 MySQL 호스트의 시계 차이**인데, 이 규칙은 전자만 본다.
      #    두 호스트가 각각 0.9초씩 반대 방향이면 실효 차 1.8초인데 둘 다 미발화다.
      #    직접 재는 장치를 새로 만드는 것은 과설계라 대리 신호로 둔다 — 한계를 알고 써라.
      #
      # 🪤 **지금 node 타깃은 127.0.0.1:9100 한 대뿐이다.** API 서버·MySQL이 여러 호스트로
      #    흩어지면 **호스트마다** node_exporter를 붙이고 이 job에 등록해야 한다 — 안 붙이면
      #    그 호스트의 시계는 **아무도 안 본다**(규칙은 에러 없이 조용히 통과한다).
      #
      # 🔴 **`node_timex_offset_seconds`로 임계값 규칙을 만들지 마라.** 한 번 만들었다가 뺐다.
      #    그 값은 실오차가 아니라 **커널 PLL의 잔차**다 — 실측(2026-09-09) 지표 4ms vs
      #    time.google.com 대비 실오차 192ms로 **47배 과소보고**였다. 게다가 큰 오차는 데몬이
      #    slew가 아니라 **step**으로 지워 잔차가 곧 0으로 돌아오므로, `> 1`이 몇 분간 연속 참일
      #    구간이 사실상 생기지 않는다(promtool 재현: 실제 400초 어긋남에도 미발화).
      # for: 2m — 짧게 잡는다. 데몬이 step으로 교정하면 desync 구간 자체가 짧으므로 `for`가 길면
      #           사건을 통째로 놓친다(promtool: 5분 desync는 for:10m에서 미발화).
      #           ExporterDown과 같은 2분이다.
      #
      # 🔴 **§90 이후 이 알람이 지키는 것이 바뀌었다.** 예전엔 `admitted_at`이 앱 시계라 어긋난
      #    동안 admit된 토큰의 원장이 영구히 틀어졌다. 지금 `admitted_at`은 MySQL이 찍고 complete·
      #    verify·reconcile 술어도 전부 MySQL 시계라, **원장 판정은 앱 시계 스큐에 면역이다.**
      #    남아서 이 알람이 지키는 것은 셋이다:
      #      ① `issued_at` — 앱 시계다. 파티션 키이자 UNIQUE(token_id, issued_at)의 절반이라
      #         크게 튀면 재처리 멱등이 깨지고 대기 시간이 음수가 된다
      #      ② Redis TTL·`admitted` ZSet score와 TokenReclaimJob — 회수가 이르거나 늦어진다
      #      ③ JWT의 exp/iat
      # 🪤 **이 규칙이 잡는 고장 모드는 일부다.** `node_timex_sync_status`는 "시계가 맞는가"가
      #    아니라 **"NTP 데몬이 커널을 먹이고 있는가"**(STA_UNSYNC 비트)를 잰다. 데몬이 수 시간
      #    죽어 방치돼야 1→0이 된다. 수동 `date -s`·VM 스냅샷 복원·절전 복귀·NTP 서버가 틀린
      #    시각을 배포하는 경우는 **넷 다 플래그를 안 건드려 침묵한다.**
      #    이것을 원장의 방어선으로 삼지 마라 — 그 역할은 §90이 코드로 가져갔다.
      - alert: HostClockNotSynchronized
        expr: node_timex_sync_status{job="node"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} 시계가 NTP에 동기화돼 있지 않다 — 토큰이 어느 월별 테이블에 저장되는지와 Redis 만료가 이 시계로 정해진다"
          impact: "토큰의 저장 시각(issued_at)이 어느 월별 테이블에 들어갈지와 중복 판정을 정한다. 시계가 틀어지면 **엉뚱한 달의 테이블에 저장**되거나 Kafka 재처리 중복 판정이 깨진다."
          action: "🔑 이 서버가 찍는 시각으로 토큰이 저장되고 Redis 만료가 계산된다. ① `timedatectl status` 의 **System clock synchronized** 를 본다. yes 면 이미 해소된 것이다 → ② no 면 시간 동기화를 되살린다: 시간 동기화 데몬을 재시작한다. 🪤 **배포판마다 이름이 다르다** — `systemctl status chrony chronyd systemd-timesyncd 2>/dev/null | grep -E 'Loaded|Active'` 로 어느 것이 있는지 먼저 보고 그 이름으로 `sudo systemctl restart <그 이름>`. 1분 기다렸다 ① 을 다시 본다. yes 로 바뀌면 끝이다 → ③ 안 바뀌면 인프라 담당에게 넘긴다. 넘길 것: `timedatectl status` 전문 · `chronyc tracking` 전문(chrony 를 쓰는 경우) 또는 `timedatectl show` 전문 · 호스트 이름 ⚠️ `date -s` 로 손으로 맞추지 마라 — 시간이 뒤로 점프하면 이미 발급된 입장권이 한꺼번에 만료된다. NTP 가 조금씩 당겨 맞추게 둬라. 피해 범위 조사(어느 토큰이 영향을 받았는지)는 조치가 끝난 뒤 `doc/monitoring/queries/` 로 한다 — 새벽에 할 일이 아니다"


      # Redis 마스터 단일 스레드가 포화에 다가간다. (2026-09-04 <보류>에서 승격)
      #
      # 🔴 **임계값 근거: 있다. 단 "기준선"이 아니라 "물리 상한"이다.**
      #    Redis 명령 실행은 단일 스레드다 → main thread CPU rate의 상한이 **1.0(코어 1개)**이다.
      #    0.8은 그 상한의 80%다. 즉 이 숫자는 부하 추정치가 아니라 옛 원칙 4번 분류
      #    ("한도가 명시된 자원")와 같은 성질이다. maxmemory 규칙과 같은 계열이다.
      #
      #    "지금은 안 울린다"의 확인 (2026-09-04 실측, job=redis-cluster 16노드):
      #      - 현재 rate[5m] 최댓값 0.0018 (0.18%)
      #      - 24시간 max_over_time 최댓값 0.0594 (5.9%, 7002)
      #      → 0.8은 관측 최댓값의 13배다.
      #    ⚠️ 이 24시간 동안 앱은 대부분 안 떠 있었다. **부하 중 기준선이 아니다.**
      #
      # user + sys를 더하는 이유: 네트워크 syscall이 sys에 잡힌다. user만 보면 포화를 놓친다.
      #
      # 🔴 **조치 레버가 있다.** 옛 <보류> 사유 "깨워도 할 수 있는 게 없다"는 거짓이 됐다 —
      #    `doc/monitoring/runbook/enqueue.md`의 [증상] Redis master CPU가 100%에 붙었다 가
      #    즉시 조치(해당 큐의 max_capacity UPDATE, 되돌리기 포함)를 이미 적고 있었다.
      #
      # for: 10m — 40회 연속. 배치 드레인은 20ms 주기라 짧은 버스트가 정상이다.
      #            버스트로 깨우지 않기 위해 이 파일에서 가장 긴 for를 쓴다.
      - alert: RedisMainThreadSaturated
        expr: |
          rate(redis_cpu_user_main_thread_seconds_total{job=~"redis|redis-cluster"}[5m])
          + rate(redis_cpu_sys_main_thread_seconds_total{job=~"redis|redis-cluster"}[5m])
            > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis {{ $labels.instance }} 단일 스레드 {{ $value | humanizePercentage }} — 상한(코어 1개)에 근접"
          impact: "Redis 는 단일 스레드라 코어 1개가 상한이다. 여기 붙으면 **더 올릴 방법이 없고**, 그 마스터의 모든 큐가 함께 느려진다."
          action: "에스컬레이션 필요 — Redis 는 단일 스레드라 **스케일업으로 못 푼다**. 큐 배치를 바꿔야 한다. ① 수집: `docker exec q-redis-a-1 redis-cli -c -p 7001 --stat` 과 `info commandstats` 에서 상위 명령과 호출 수를 적는다. 어느 노드인지도 함께(B 면 -p 8001). 🔑 판단: `--stat` 의 ops/sec 이 **3만 미만인데** CPU 가 80% 를 넘으면 특정 명령이 무거운 것이므로 `info commandstats` 의 usec_per_call 상위를 함께 적는다 → ② 임시 조치: 없다. 🪤 큐 일시 정지는 테넌트 JWT 가 필요해 당직자가 못 친다(401) — 큐 ID 만 적어 ③ 에 넘긴다 → ③ 인프라 담당에게 넘긴다. 넘길 것: 노드 · CPU 비율 · 상위 명령 · 그 노드의 큐 목록. 절차는 `doc/monitoring/runbook/enqueue.md` 의 [증상] Redis master CPU가 100%에 붙었다 ⚠️ `KEYS *` / `DEBUG SLEEP` 금지 — 단일 스레드를 통째로 막아 전면 장애가 된다"

  # ───────────────────────────────────────────────────────────────────────────
  # 과금 집계. **여기가 유일하게 돈을 보는 규칙이다.**
  # 🔑 보류 사유([B] queue-batch 커스텀 메트릭 5종)는 **gauge 에만 적용된다** —
  #    `!= 0` 은 batch 가 안 떠 있으면 시계열이 사라져 침묵하므로 `absent()` 결합이 선행이었다.
  #    counter 의 `increase() > 0` 에는 그 사유가 성립하지 않는다(리셋도 increase 가 처리한다).
  #    그래서 셋 중 counter 하나만 먼저 승격한다.
  # ───────────────────────────────────────────────────────────────────────────
  - name: queue-platform-billing
    rules:
      - alert: BillingSnapshotFailing
        # 🔑 24h 창인 이유: 집계는 **하루 한 번**(UTC 00:30) 돈다. 5m 창이면 발화 순간을
        #    놓치면 증거가 사라지고, 다음 실패까지 24시간 조용하다.
        expr: increase(queue_billing_snapshot_total{result="failure"}[24h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "과금 스냅샷 집계가 실패했다 — 최근 24시간 {{ $value | humanize }}회"
          impact: "**청구 근거가 빈 달이 생긴다.** 적재(INSERT)는 계속 성공하므로 서비스는 정상으로 보이고, 실패는 `log.error` 한 줄뿐이다(prod 는 root=WARN 이고 로그는 어디에도 모이지 않는다). 파티션 DROP 이 먼저 돌면 원본 토큰까지 사라져 **되돌릴 수 없다**."
          action: "① 원인 확인: `docker logs q-batch --since 24h 2>&1 | grep -i billing` 의 예외를 본다 → ② 가장 흔한 원인은 **대상 월 파티션이 없는 것**이다(ERROR 1735). 확인: `docker exec q-mysql sh -c \"mysql -uroot -p$MYSQL_ROOT_PASSWORD -D queue_platform -N -e 'SELECT COUNT(*) FROM tokens PARTITION (p_future)'\"` 가 에러 없이 돌고 값이 0 이 아니면, 그리고 `docker exec q-mysql sh -c \"mysql -uroot -p$MYSQL_ROOT_PASSWORD -D queue_platform -e 'SHOW CREATE TABLE tokens'\" | grep -c p$(date -u +%Y_%m)` 가 0 이면 그것이다(🪤 대상 월을 손으로 적지 마라 — 리터럴로 두면 파티션이 있어도 0 이 나와 오판한다. 2026-09-23 실제로 그렇게 틀렸다) → ③ 그 경우 **파티션을 사람이 추가해야 한다**(`doc/schema.sql` 파티션 운영 절의 REORGANIZE). 🪤 자동 생성 코드가 없다. 🪤 REORGANIZE 는 테이블 MDL 을 잡아 뒤의 INSERT 가 함께 막힌다(실측 3.05초) — 유입이 적은 시각에 친다 → ④ 파티션이 아니면 DBA 담당에게 넘긴다. 넘길 것: 예외 전문 · 대상 월 · p_future 행 수. ⚠️ **집계를 손으로 건너뛰지 마라** — 잡이 매일 전월+당월을 갱신하므로 파티션을 고치면 다음 실행이 스스로 메꾼다"

# ─────────────────────────────────────────────────────────────────────────────
# <보류> — 2026-09-04 전면 재구성
#
# 사용자 결정("모니터링에 대한 경고는 일단 전부 알람으로 간다")으로
# **"기준선이 없다" / "조치 레버가 없다"는 더 이상 보류 사유가 아니다.**
# 그래서 이 절은 **승격된 것**과 **아직 못 쓰는 것**이 한눈에 갈리도록 두 표로 나눈다.
#
# ═══ [A] 승격 완료 — 여기 없다. 규칙으로 존재한다 ══════════════════════════════
#
#   ● MySQL 복제 중단           → MysqlReplicationStopped      (이 파일, critical)
#   ● MySQL 복제 지연 증가        → MysqlReplicationLagHigh      (이 파일, warning)
#   ● Redis 단일 스레드 포화      → RedisMainThreadSaturated     (이 파일, warning)
#   ● admit 5xx 비율            → QueueAdmitErrorRatioHigh     (app.yml, critical)
#   ● B2 "admit 요청이 안 온다"   → QueueAdmitRequestsAbsent     (app.yml, info)
#   ● p95 지연                  → QueueAdmissionWaitP95High (app.yml, warning)
#   ● 과금 집계 실패             → BillingSnapshotFailing       (이 파일, critical, 2026-09-23)
#     🔑 counter 만 승격했다. 같은 5종의 **gauge 둘**(queue_billing_mismatch·reconcile 계열)은
#        아래 [B] 에 그대로 남는다 — 보류 사유(absent 결합)가 gauge 에는 아직 유효하다.
#     🔑 p95 300초 critical은 **만들지 않았다**(2026-09-04 사용자 결정). 이 서비스에서
#        p95 5분은 장애가 아니라 설계 의도일 수 있다(30만 명 티켓 오픈인데 severity=critical은
#        사람을 깨운다). 사유는 MONITORING_DESIGN.md 4-3의 미채택 표기에 있다.
#
#   승격하면서 옛 보류 사유가 **이미 거짓이었던 것 셋**을 함께 정정했다:
#     1. "Redis 포화는 조치 레버가 없다" → 거짓. `runbook/enqueue.md`의
#        [증상] Redis master CPU가 100%에 붙었다 가 즉시 조치(해당 큐 max_capacity UPDATE,
#        되돌리기 포함)를 이미 적고 있었다. **보류 사유가 자기 런북과 모순이었다.**
#     2. "redis-cluster 16노드는 앱이 붙지 않으므로 규칙을 안 만든다" → 거짓.
#        §75로 앱이 붙는 곳이 **Cluster다**. 그리고 RedisInstanceDown·RedisClusterDegraded·
#        ExporterDown·RedisMemoryWillHitMaxmemory 가 **이미 job=~"redis|redis-cluster"를 보고 있었다.**
#        규칙은 이미 있는데 보류 문구만 남아 있었다. 항목 통째로 삭제.
#        ⚠️ 반대로 job="redis"(6379-6381)·job="redis-sentinel"은 §75로 코드에서 제거된
#           학습 자산이다. **새 규칙을 그쪽에 걸지 마라** — 런북이 다른 Redis를 가리키던 전례가 있다.
#     3. "admit 계열은 대상 메트릭이 미구현이라 전부 못 쓴다" → **절반이 거짓이었다.**
#        admit 5xx 비율과 B2는 Spring Boot 기본 `http_server_requests`로 **구현 0으로 쓸 수 있다.**
#        (실측 2026-09-04: uri="/api/v1/queues/{queueId}/admit" 시계열 실재, 24h 표본 66)
#        "커스텀 메트릭이 없다"를 "관측이 없다"로 착각한 것이다. 기본 메트릭을 먼저 봐라.
#
# ═══ [B] 아직 못 쓴다 — 사유는 단 하나, **대상 메트릭이 존재하지 않는다** ═══════════
#
#   임계값을 못 정해서 보류하는 항목은 이제 **없다.** 못 정하면 정하지 말고 "🔴 임계값 근거:
#   없다"를 달고 만든다. 아래는 만들면 **영원히 안 뜨는 알람**이 되는 것들이다 —
#   시계열이 없으면 규칙은 firing이 아니라 **침묵**하고, 그건 없는 것보다 나쁘다(있다고 착각시킨다).
#
#   ● 만료율 (회수 3경로: admitTtl / inactiveTtl / waitingTtl 각각 몇 건인가)
#     - 대체 가능한가 → **아니다(실측 확인).** 지금 존재하는 batch 커스텀 메트릭 5종
#       (queue_waiting_orphans · queue_reconcile_ghosts · queue_reconcile_stale ·
#        queue_billing_mismatch · queue_billing_snapshot_total)은 전부 **다른 것을 센다.**
#       queue_waiting_orphans는 "waiting 맨 앞의 tokens Hash 미스"이지 만료 건수가 아니다.
#       회수 건수는 `TokenReclaimJob:163`의 **log.info 한 줄로만** 남는다(Counter 없음).
#     - 🔑 선행 구현: `TokenReclaimJob`에 회수 3경로 Counter
#       (예: queue.token.reclaimed{reason=admit_ttl|inactive_ttl|waiting_ttl}).
#       라벨은 reason 3종뿐이라 카디널리티 부담이 없다. queueId는 붙이지 마라
#       (같은 클래스 javadoc:179가 이미 그렇게 정해 놨다).
#
#   ● 큐별 admit 판정 — "특정 테넌트만 admit을 멈췄다"
#     - QueueAdmitRequestsAbsent(app.yml)는 **플랫폼 전체**만 잡는다. uri 라벨이 queueId를
#       템플릿으로 접기 때문이다. 큐별로는 못 본다.
#     - ✅ **선행 구현 완료 (2026-09-09).** `queue_admit_requests_total{queue_id, result}` /
#       `queue_admit_tokens_issued_total{queue_id}` (§80 U9, `QueueEngineService.recordAdmitRequest`).
#       라벨은 예정대로 `queue_id`로 맞췄고, 계약은 `AdmitRequestMetricTest`가 문자열로 건다.
#       거기서 나온 규칙은 app.yml의 **QueueAdmitPublishFailing**(result=error)이다.
#     - 🔴 **그런데 이 항목(큐별 admit 판정)은 여전히 못 만든다 — 사유가 바뀌었다.**
#       메트릭이 없어서가 아니라 **대기자 수를 큐별로 내보내는 시계열이 없어서**다
#       (TSDB 이름 1,872종에 `queue_waiting_*` 큐별 계열 없음 — 2026-09-09 실측.
#        `queue_waiting_orphans`는 라벨이 없고 세는 것도 다르다).
#       `rate()==0 or absent_over_time()`을 queue_id 위에 그대로 올리면 **두 방향으로 틀린다**:
#         (a) 오발화 — 대기자가 없어 정상적으로 조용한 큐 중 **과거에 admit이 있던** 큐가 발화한다.
#         (b) 🔴 원천 미탐 — **한 번도 admit이 없던 큐는 영원히 침묵한다.** 시계열이 없으면
#             `absent_over_time`은 그 queue_id를 **열거할 수단이 없다**(라벨 값을 만들어 낼 수 없다).
#             (b)가 (a)보다 나쁘다. "admit을 한 번도 안 부른 테넌트"가 정확히 이 규칙의 표적인데,
#             그게 구조적으로 사각이다.
#       선행은 `queue_waiting_size{queue_id}` 같은 gauge다.
#       ⚠️ **비용을 장벽으로 들지 마라 — 거짓이다.** 큐별 순회는 이미 있다
#          (`TokenReclaimJob:134`이 10초마다 `findAll()`을 돌며 큐마다 Redis를 친다.
#           `ReconcileJob`도 5분마다 큐마다 ZCOUNT). 추가분은 **큐당 ZCARD 1회/주기**뿐이다.
#       진짜 장벽은 **카디널리티 정책**이다 — batch의 gauge에 `queue_id` 라벨을 달 것인가.
#       지금 batch 커스텀 메트릭 5종은 전부 라벨이 없고, 그건 의도된 선택이다(§4 판단 대상).
#
#   ● queue-batch 커스텀 메트릭 5종에 대한 규칙 (queue_billing_mismatch != 0 등)
#     - 임계값은 자명하다(0이 정상, -1은 대사 실패). 못 만드는 이유는 임계값이 아니라
#       **batch가 안 떠 있으면 시계열이 사라져 `!= 0` 규칙이 침묵**하기 때문이다.
#       `absent()` 결합이 선행이고, 그건 AppInstanceDown(job=queue-batch)과 겹친다.
#       겹치는 규칙을 놓지 않는다는 원칙(RedisClusterDegraded 주석)은 아직 유효하다.
#     - ⚠️ 이건 "기준선이 없어서"가 아니다. 새 원칙과 충돌하지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
