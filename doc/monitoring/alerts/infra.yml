# 인프라 알람 규칙 — Queue Platform
#
# 🔴 **이 파일의 원칙이 2026-09-04에 바뀌었다.** 아래 옛 원칙을 먼저 읽고, 그다음 무엇이
#    바뀌었는지를 읽어라. 옛 원칙만 읽고 규칙을 지우는 일이 없게 하기 위해 둘 다 남긴다.
#
# [옛 원칙 — 2026-08~09-03]
#   이 파일에 있는 규칙은 전부 "임계값이 필요 없는 것"만 골랐다.
#   이 프로젝트는 아직 부하 기준선이 없다. 근거 없는 숫자를 규칙에 박으면 그 숫자가
#   나중에 "이미 정해진 값"으로 굳어 아무도 다시 묻지 않는다. 그래서 아래 4종만 썼다.
#
#     1) 프로세스가 죽었다        (up == 0 / redis_up == 0 — 임계값 개념이 없다)
#     2) 이진 상태가 뒤집혔다      (quorum 실패, 복제 링크 끊김)
#     3) 구성 사고               (master가 둘)
#     4) 한도가 명시된 자원의 추세  (maxmemory 1GB가 config에 박혀 있다 → 절대값이 아니라 도달 예측)
#
# [지금 원칙 — 2026-09-04, 사용자 결정]
#   "모니터링에 대한 경고는 일단 전부 알람으로 간다. 실제로 대응하는 것은 그 다음 문제다."
#
#   즉 **"기준선이 없다" / "조치 레버가 없다"는 더 이상 보류 사유가 아니다.** 관측이 되는
#   것은 일단 규칙으로 만든다. 그 대신 옛 원칙이 지키려던 것은 **표기**로 지킨다:
#
#     ▸ 임계값을 쓴 규칙은 **근거 유무를 주석에 반드시 명시한다.** 근거가 없으면
#       "🔴 임계값 근거: 없다"라고 쓴다. 이 문구를 지우지 마라 — 지우는 순간 그 숫자가
#       "이미 정해진 값"으로 굳는다. 옛 원칙이 막으려던 것이 정확히 그것이었다.
#     ▸ 기준선을 잰 것은 "임계값의 근거"가 아니라 **"지금은 안 울린다"의 확인**으로만 쓴다.
#       로컬 WSL2 수치를 프로덕션 근거로 승격하지 않는다.
#
#   그래서 이 파일은 이제 위 4종에 더해 **5) 기준선 없이 정한 임계값**을 포함한다.
#   커스텀 애플리케이션 메트릭 규칙은 이 파일이 아니라 `app.yml`에 있다.
#
# 아직 규칙으로 만들지 못한 것(= 대상 메트릭이 아예 없는 것)은 파일 맨 아래 <보류> 절에
# 남겼다. 주석은 발화하지 않으므로 "규칙이 있다"는 착각을 만들지 않는다.
#
# ─────────────────────────────────────────────────────────────────────────────
# severity 체계 (이 레포 첫 규칙이라 여기서 정의한다)
#
#   critical : 서비스가 지금 죽었거나, "다음 장애를 복구할 수단"이 사라졌다. 사람을 깨운다.
#   warning  : 사용자 영향은 아직 없다. 방치하면 critical이 된다. 업무 시간에 본다.
#   info     : 로컬 환경의 사실 표기. 절대 깨우지 않는다.
#              (로컬은 앱을 안 띄운 시간이 대부분이라 상시 firing이 정상이다.
#               이걸 warning에 섞으면 warning 등급 전체가 오염된다 → 등급으로 격리한다)
#
# ⚠️ Alertmanager는 미설치다(의도적, 알림 채널 없음). 즉 지금 severity는 라우팅을 하지 않고
#    문서 라벨로만 존재한다. firing 확인은 http://localhost:9090/alerts 에서 눈으로 한다.
#
# ⚠️ 전제: evaluation_interval=15s, scrape_interval=15s (실가동 prometheus.yml 실측)
#    `for:` 값은 전부 "스크레이프 N회 연속"으로 환산해 근거를 각 규칙에 적었다.
# ─────────────────────────────────────────────────────────────────────────────

groups:

  # ===========================================================================
  # 1. 죽었다
  # ===========================================================================
  - name: queue-platform-liveness
    rules:

      # 앱 프로세스가 스크레이프에 응답하지 않는다.
      #
      # ⚠️ 로컬에서는 이 규칙이 거의 항상 firing이다 — 앱을 상시 띄우지 않기 때문.
      #    그래서 severity=info다. "앱이 안 떠 있다"는 사실 표기이지 사고 통보가 아니다.
      #    prod 타깃(관리 포트 분리 후, Sprint 11)이 job으로 추가되면 그 job만 critical로 올린다.
      #
      # 🔧 옛 주석은 "queue-batch는 actuator 의존성이 없어 스크레이프 대상이 아니다"였는데
      #    거짓이다 — queue-batch/build.gradle에 actuator·micrometer가 둘 다 있고(`6647ca5`),
      #    아래 정규식도 이미 queue-batch를 포함한다. 주석이 자기 아래 규칙과 모순이었다.
      # ⚠️ 다만 prod 프로필은 prometheus를 노출하지 않는다(경계가 없는 동안은 열지 않는다,
      #    2026-09-02). prod job을 추가할 때는 노출을 다시 켜는 것이 선행이다.
      - alert: AppInstanceDown
        expr: up{job=~"queue-api|queue-batch|queue-consumer"} == 0
        for: 2m
        labels:
          severity: info
        annotations:
          summary: "{{ $labels.job }} ({{ $labels.instance }}) 스크레이프 실패 2분"
          action: "로컬이면 앱 미기동이 원인이다. 기동 여부만 확인하고 끝낸다: `ss -lntp | grep 8080`"

      # Redis 인스턴스가 죽었다.
      #
      # 🔴 여기서 `up`을 쓰면 안 된다. redis_exporter는 멀티타깃 모드(1 프로세스가 22개 담당)라
      #    Redis가 죽어도 익스포터는 HTTP 200을 돌려준다 → `up`은 1로 남는다.
      #    죽음이 드러나는 곳은 익스포터가 내려주는 `redis_up`이다. 실측으로 확인했다.
      #    (이걸 모르고 `up{job="redis"}==0`으로 쓰면 Redis가 죽어도 영원히 침묵한다)
      #
      # job=redis 3대(6379/6380/6381)는 앱이 실제로 붙는 Redis다. job=redis-sentinel 3대가
      # 죽으면 failover가 불가능해진다. 둘 다 critical.
      #
      # for: 1m — Sentinel failover 실측이 5~10초다(doc/INFRA_SETUP.md). 1분이면 failover
      #           과정은 안 걸리고 진짜 다운만 걸린다.
      - alert: RedisInstanceDown
        expr: redis_up{job="redis-cluster"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis {{ $labels.instance }} ({{ $labels.job }}) 응답 없음 1분"
          action: "⚠️ 이 규칙은 **Cluster**(job=redis-cluster)를 본다. Sentinel 명령을 치지 마라. `systemctl status redis-cluster-a-{1..8}` / `redis-cluster-b-{1..8}` 로 확인 → 죽었으면 해당 유닛만 `systemctl start`. 마스터였으면 Cluster가 스스로 replica를 승격했어야 한다 — `redis-cli -c -p 7001 cluster nodes` 로 승격 여부와 `cluster_state`를 먼저 본다."

      # 익스포터 자체가 죽었다 = 위 RedisInstanceDown 규칙이 침묵한다.
      #
      # 시계열이 사라지면 `== 0` 규칙은 발화하지 않는다(빈 벡터). 즉 "감시가 죽은 것"을
      # 알려주는 규칙이 따로 필요하다. 이게 없으면 Redis 관측 전체가 조용히 눈이 먼다.
      #
      # redis/redis-sentinel/redis-cluster는 전부 같은 9121 프로세스라 하나가 죽으면 다 죽는다.
      # mysql은 인스턴스당 익스포터 1개(9104/9105)이므로 별개 실패다.
      - alert: ExporterDown
        expr: up{job=~"redis-cluster|mysql"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "익스포터 응답 없음 — {{ $labels.job }} {{ $labels.instance }} (해당 인프라 지표 전체 소실)"
          action: "익스포터 프로세스 확인. 이게 firing인 동안 같은 대상의 다른 규칙은 전부 침묵 중이라고 봐야 한다."

      # mysqld_exporter는 살아 있는데 MySQL에 붙지 못한다.
      #
      # ✅ 해소됨 (2026-08-28 실측). 전용 계정 exporter@localhost 가 생성돼 있고 권한도 맞다:
      #    GRANT SELECT, PROCESS, REPLICATION CLIENT ON *.* — 그래서 collect.slave_status 가
      #    master·replica 양쪽에서 1이고 mysql_slave_status_seconds_behind_master 가 실제로 나온다.
      #    (당시 값 0초). mysql_up 은 양쪽 1이라 이 규칙은 firing 이 아니다.
      #    규칙 자체는 남긴다 — 계정이 지워지거나 만료되면 다시 이 신호로 드러나야 한다.
      #    DB 자체 장애가 아니므로 critical이 아니라 warning이다 — 이 구분이 중요하다.
      - alert: MysqlExporterCannotConnect
        expr: mysql_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mysqld_exporter가 {{ $labels.application }}에 접속 못 함 — MySQL 지표 전체가 비어 있다"
          action: "모니터링 전용 계정(PROCESS, REPLICATION CLIENT, SELECT) 생성 여부부터 확인. 계정이 생기기 전까지 복제 지연은 관측 불가다."

  # ===========================================================================
  # 2. 이진 상태가 뒤집혔다 / 구성 사고
  # ===========================================================================
  - name: queue-platform-redis-state
    rules:

      # 복제 링크가 끊겼다. slave가 master를 따라잡지 못하는 게 아니라 "연결 자체가 없다".
      # 이 상태에서 failover가 나면 승격된 노드가 오래된 데이터를 갖는다 = 대기열 유실.
      # 값이 0/1뿐이라 임계값 개념이 없다.
      - alert: RedisReplicationBroken
        expr: redis_master_link_up{job="redis-cluster"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis 복제 끊김 — {{ $labels.instance }} → master {{ $labels.master_host }}:{{ $labels.master_port }}"
          action: "`redis-cli -p <slave> INFO replication` 의 master_link_status 확인. 이 상태에서 master를 강제 failover 시키지 마라 — 유실된다."

      # Sentinel quorum이 깨졌다 = master가 죽어도 승격이 불가능하다.
      # "지금 서비스는 멀쩡한데 다음 장애를 복구할 수단이 사라진" 전형적 critical이다.
      # ckquorum은 Sentinel이 직접 계산해 1/0으로 내려준다 → 임계값 없음.
      # ⚠️ 이 규칙만 **앱과 무관**하다. Sentinel은 §75로 코드에서 제거됐고 학습·로컬 자산으로만 남았다.
      #    울려도 서비스 영향은 없다 — Sentinel 실습 환경이 깨진 것이다.
      - alert: RedisSentinelQuorumLost
        expr: redis_sentinel_master_ckquorum_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sentinel quorum 실패 — {{ $labels.instance }} / master={{ $labels.master_name }}"
          action: "Sentinel 3대 생존 확인(`redis_status`). quorum이 없으면 master 장애 시 자동 승격이 안 된다. 복구 전까지 master 재기동·강제 종료 금지."

      # master가 둘 이상이다 = split-brain 또는 구성 사고.
      # 앱이 어느 쪽에 쓰느냐에 따라 대기열이 조용히 갈린다. 조용한 실패라 규칙으로만 잡힌다.
      #
      # for: 2m — failover 직후 옛 master가 살아 돌아오면 Sentinel이 slaveof로 되돌리기까지
      #           수 초간 둘로 보인다. 2분이면 그 정상 과도구간을 넘긴다.
      #
      # master가 0개인 경우는 넣지 않았다: 시계열이 사라져 `!= 1`이 발화하지 않을뿐더러,
      # RedisInstanceDown / RedisSentinelQuorumLost가 이미 잡는다. 규칙을 겹쳐 놓지 않는다.
      # 🔴 구 규칙 RedisMultipleMasters(count(role="master") > 1)는 **Cluster에 그대로 옮길 수 없다.**
      #    Sentinel은 마스터가 하나뿐이라 2개 이상이 split-brain이었지만, Cluster는 **4 마스터가 정상**이다.
      #    같은 사고(슬롯을 아무도 담당 못 함)를 Cluster에서 보는 지표는 cluster_state / slots_fail 이다.
      - alert: RedisClusterDegraded
        expr: min(redis_cluster_state{job="redis-cluster"}) != 1
              or max(redis_cluster_slots_fail{job="redis-cluster"}) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          # 🔴 2026-08-28 정정: expr은 Cluster를 보는데 summary·action이 Sentinel 원문 그대로였다.
          #    $value 도 틀렸다 — 이 expr의 값은 cluster_state(0/1)이지 master 개수가 아니다.
          #    그대로 두면 새벽에 Cluster 노드에 SLAVEOF 를 치게 된다. 커밋 de24048이 다른 알람의
          #    $value 를 고칠 때 이 건이 빠져 있었다.
          summary: "Redis Cluster가 온전하지 않다 — cluster_state={{ $value }} (정상 1) 또는 slots_fail>0 ({{ $labels.instance }})"
          action: "⚠️ **Sentinel 명령을 치지 마라.** `redis-cli -c -p 7001 cluster info` 로 cluster_state·slots_assigned·slots_fail 확인 → `cluster nodes` 로 fail 표시된 노드 특정 → 그 유닛만 `systemctl start redis-cluster-{a|b}-N`. 슬롯 담당이 사라진 것이면 승격 대상 replica가 살아 있는지부터 본다. 앱 재시작보다 이게 먼저다."

  # ===========================================================================
  # 2-b. MySQL 복제 (2026-09-04 <보류>에서 승격 — 사용자 결정)
  # ===========================================================================
  # ⚠️ 시계열은 **replica 익스포터(9105) 한 곳에서만** 나온다(실측: 위 세 메트릭 전부 count=1).
  #    master(9104)에는 slave_status가 없다. 그래서 instance 필터를 걸지 않는다 —
  #    걸면 포트가 바뀔 때 조용히 침묵한다.
  # ===========================================================================
  - name: queue-platform-mysql-replication
    rules:

      # 복제가 멈췄다. IO 스레드(master에서 가져오기) 또는 SQL 스레드(적용하기)가 죽었다.
      #
      # 임계값 근거: **불필요하다.** 값이 0/1뿐인 이진 상태다(옛 원칙 2번 분류).
      #
      # 왜 critical인가: 지금 사용자 경로는 안 깨진다 — 앱이 replica를 읽는 경로는 **0곳**이다
      # (CLAUDE.md §4-3, 2026-09-02 반사실 실측). replica는 순수 DR 자산이다.
      # 그래서 이것은 "다음 장애를 복구할 수단이 사라졌다"는 전형적 critical이다.
      # RedisSentinelQuorumLost와 같은 계열이며 severity 정의 그대로다.
      #
      # for: 1m — 4회 연속. 복제 재시작(STOP/START SLAVE) 중의 순간적 0을 넘긴다.
      - alert: MysqlReplicationStopped
        expr: |
          mysql_slave_status_slave_sql_running == 0
          or mysql_slave_status_slave_io_running == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MySQL 복제 정지 — {{ $labels.instance }} (IO 또는 SQL 스레드 중단)"
          action: "`mysql -h127.0.0.1 -P3307 -uroot -p -e 'SHOW REPLICA STATUS\\G'` 로 Last_IO_Error / Last_SQL_Error 를 먼저 읽는다. ⚠️ **오류를 읽기 전에 `SET GLOBAL SQL_SLAVE_SKIP_COUNTER`나 GTID 건너뛰기를 하지 마라** — 건너뛴 트랜잭션은 영원히 사라지고 그 사실이 어디에도 안 남는다. 되돌리기: 원인 해소 후 `START REPLICA`."

      # 복제 지연이 30초를 넘어 5분간 유지된다.
      #
      # 🔴 **임계값 근거: 약하다(로컬 관측 기반, 프로덕션 근거 아님).**
      #    2026-09-04 Prometheus 24시간 실측(job=mysql, instance=9105):
      #      - lag > 0 인 분(分)이 **992분 중 4분** (01:20 / 13:24 / 15:50 / 16:01)
      #      - 15초 스크레이프 기준 lag>0 표본 10개 / p99 = 0초 / p99.9 = 1초 / 최댓값 = 40초
      #      - 30초를 넘긴 표본은 **1개**이고 연속되지 않았다(단발 스파이크)
      #    → "30초가 5분간 유지"는 관측된 기준선에서 **발화 0회**다. 그래서 오탐은 안 난다.
      #    ⚠️ 그러나 "30"이라는 숫자 자체는 여전히 임의다. 부하 중 분포는 아직 안 쟀다.
      #       프로덕션에서 다시 재라. 로컬 WSL2 idle 수치를 용량 근거로 승격하지 마라.
      #
      # 🔴 **이 규칙은 "복제가 멈춘 것"을 못 잡는다.** SQL 스레드가 죽으면
      #    seconds_behind_master 는 커지는 게 아니라 **NULL**이 되고 시계열이 사라진다.
      #    빈 벡터는 발화하지 않는다. 그 경우는 위 MysqlReplicationStopped 담당이다.
      #    둘은 겹치는 규칙이 아니라 **서로의 사각을 메우는 짝**이다. 하나만 남기지 마라.
      #
      # warning인 이유: 앱이 replica를 읽지 않으므로 사용자 영향이 지금은 0이다.
      # 방치하면 DR 복구 지점이 뒤로 밀린다 → 방치 시 critical, 정확히 warning 정의다.
      - alert: MysqlReplicationLagHigh
        expr: mysql_slave_status_seconds_behind_master > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "MySQL 복제 지연 {{ $value }}초 5분 지속 — {{ $labels.instance }} (DR 복구 지점이 그만큼 뒤에 있다)"
          action: "`SHOW REPLICA STATUS\\G` 의 Seconds_Behind_Source 와 Relay_Log_Space 를 본다. 지연의 흔한 원인은 대량 DDL/DELETE다 — `doc/schema.sql` 파티션 DROP이 방금 돌았는지 확인(DROP은 테이블 MDL을 3초 잡는다, 실측). ⚠️ 지연 중에 replica로 조회를 옮기지 마라. 앱은 지금 replica를 읽지 않는 것이 정상이다(§4-3)."

  # ===========================================================================
  # 3. 한도가 명시된 자원의 추세
  # ===========================================================================
  - name: queue-platform-capacity
    rules:

      # maxmemory 도달 예측.
      #
      # 이 규칙만 유일하게 "한도"를 쓰는데, 그 한도가 기준선 추정이 아니라 **config에 박힌 값**이다:
      #   - maxmemory 가 명시 설정돼 있다 (0 = 무제한이 아니다)
      #   - maxmemory-policy = noeviction (실측)
      #   → 한도에 닿는 순간 eviction이 아니라 **쓰기가 OOM으로 거부된다** = enqueue가 죽는다.
      #
      # ⚠️ 한도 숫자를 이 파일에 적지 않는다. 규칙이 redis_config_maxmemory를 그때그때 읽으므로
      #    CONFIG SET으로 값이 바뀌어도 규칙은 따라간다. (실제로 이 규칙을 쓰는 동안 1GiB → 2GiB로
      #    바뀌었다. 주석에 숫자를 박았다면 그 순간부터 거짓말이 됐을 것이다.)
      #
      # 절대값 임계(예: 90%)를 안 쓴 이유:
      #   증가 속도를 모른다(기준선 없음). 90%가 "3시간 뒤"인지 "3초 뒤"인지
      #   모르는 상태에서 90%는 아무 정보가 아니다. 게다가 지금 이 시스템은 admit 미구현이라
      #   `waiting` ZSet에 ZREM 경로가 없다 = 메모리가 **단조 증가**한다. 수준이 아니라 추세가 맞다.
      #
      # 6h는 임계값이 아니라 "얼마나 미리 알고 싶은가"(리드타임)다. 새벽에 깨우지 않고
      # 아침에 조치할 수 있는 여유로 잡았다. 재시작·FLUSH로 메모리가 줄면 기울기가 음수라
      # 예측값이 내려가므로 오탐이 안 난다.
      #
      # `maxmemory > 0` 가드: 한도 미설정(0) 인스턴스가 섞이면 비교가 항상 참이 되어 오탐이 터진다.
      - alert: RedisMemoryWillHitMaxmemory
        expr: |
          predict_linear(redis_memory_used_bytes{job="redis-cluster"}[1h], 6 * 3600)
            > redis_config_maxmemory{job="redis-cluster"}
          and redis_config_maxmemory{job="redis-cluster"} > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Redis {{ $labels.instance }} 현 추세면 6시간 내 maxmemory 도달 — noeviction이라 쓰기(enqueue)가 거부된다"
          action: "`redis-cli -c -p 7001 CONFIG GET maxmemory` (앱이 붙는 Cluster. 6379는 Sentinel이라 다른 값이다) 로 현재 한도 확인 → `INFO memory`의 used_memory → `--bigkeys`로 어느 큐가 키우는지 본다. ⚠️ FLUSHALL 금지 — 대기열 전체가 사라진다."

      # 디스크 고갈 예측.
      #
      # 🔴 이 규칙은 2026-09-04까지 **쓸 수 없었다** — node_exporter가 설치돼 있지 않았다.
      #    MONITORING_DESIGN.md는 있다고 적고 있었다(문서 드리프트). 지금은 9100에 떠 있다.
      #
      # 왜 필요한가: `tokens`는 월별 RANGE 파티션이고, DROP이 멈추면 **아무 에러 없이** 계속
      # 쌓인다. 배치 실패 알림보다 디스크 추세가 먼저 잡히는 경우가 있다(DROP은 성공했는데
      # 유지보수 쿼리가 밀린 경우 등). 디스크가 차면 MySQL은 쓰기를 거부한다 = Kafka 적재 정지.
      #
      # 절대값(예: 85%)을 안 쓴 이유는 위 Redis 규칙과 같다 — 증가 속도의 기준선이 없다.
      # 24h는 임계값이 아니라 리드타임이다. 파티션 추가/DROP은 사람 손이 필요하고 하루면 된다.
      # 기울기가 음수(청소해서 공간이 늘면)면 예측값이 커져 자동으로 해제된다.
      #
      # 🪤 mountpoint="/" 로 좁히는 이유: WSL이 같은 ext4를 /var/lib/docker 에도 붙여
      #    동일 파일시스템이 2중으로 잡힌다. 안 좁히면 같은 사건에 알람이 두 번 뜬다.
      - alert: DiskWillFill
        expr: |
          predict_linear(node_filesystem_avail_bytes{job="node",mountpoint="/"}[6h], 24 * 3600) < 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} 루트 파일시스템 현 추세면 24시간 내 고갈 — MySQL 쓰기가 멈춘다"
          action: "`df -h /` → `du -sh /var/lib/mysql/*` 로 tokens 파티션 크기 확인 → `doc/schema.sql`의 파티션 운영 쿼리로 오래된 파티션 DROP 상태 점검. ⚠️ DROP은 테이블 MDL을 잡아 INSERT를 함께 막는다(실측 3.05초) — lock_wait_timeout을 걸고 실행한다."

      # Redis 마스터 단일 스레드가 포화에 다가간다. (2026-09-04 <보류>에서 승격)
      #
      # 🔴 **임계값 근거: 있다. 단 "기준선"이 아니라 "물리 상한"이다.**
      #    Redis 명령 실행은 단일 스레드다 → main thread CPU rate의 상한이 **1.0(코어 1개)**이다.
      #    0.8은 그 상한의 80%다. 즉 이 숫자는 부하 추정치가 아니라 옛 원칙 4번 분류
      #    ("한도가 명시된 자원")와 같은 성질이다. maxmemory 규칙과 같은 계열이다.
      #
      #    "지금은 안 울린다"의 확인 (2026-09-04 실측, job=redis-cluster 16노드):
      #      - 현재 rate[5m] 최댓값 0.0018 (0.18%)
      #      - 24시간 max_over_time 최댓값 0.0594 (5.9%, 7002)
      #      → 0.8은 관측 최댓값의 13배다.
      #    ⚠️ 이 24시간 동안 앱은 대부분 안 떠 있었다. **부하 중 기준선이 아니다.**
      #
      # user + sys를 더하는 이유: 네트워크 syscall이 sys에 잡힌다. user만 보면 포화를 놓친다.
      #
      # 🔴 **조치 레버가 있다.** 옛 <보류> 사유 "깨워도 할 수 있는 게 없다"는 거짓이 됐다 —
      #    `doc/monitoring/runbook/enqueue.md`의 [증상] Redis master CPU가 100%에 붙었다 가
      #    즉시 조치(해당 큐의 max_capacity UPDATE, 되돌리기 포함)를 이미 적고 있었다.
      #
      # for: 10m — 40회 연속. 배치 드레인은 20ms 주기라 짧은 버스트가 정상이다.
      #            버스트로 깨우지 않기 위해 이 파일에서 가장 긴 for를 쓴다.
      - alert: RedisMainThreadSaturated
        expr: |
          rate(redis_cpu_user_main_thread_seconds_total{job="redis-cluster"}[5m])
          + rate(redis_cpu_sys_main_thread_seconds_total{job="redis-cluster"}[5m])
            > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Redis {{ $labels.instance }} 단일 스레드 {{ $value | humanizePercentage }} — 상한(코어 1개)에 근접"
          action: "핫키를 먼저 의심한다. 키가 전부 `{queueId}` 해시태그라 Cluster여도 큐 하나 = 마스터 한 대다. 절차 전체는 `doc/monitoring/runbook/enqueue.md` 의 [증상] Redis master CPU가 100%에 붙었다 — `redis-cli -c -p 7001 --stat` 와 `info commandstats`. ⚠️ **`KEYS *` / `DEBUG SLEEP` 금지** — 단일 스레드를 통째로 막아 전면 장애가 된다. 스케일업으로 못 푼다(코어를 늘려도 단일 스레드다)."

# ─────────────────────────────────────────────────────────────────────────────
# <보류> — 2026-09-04 전면 재구성
#
# 사용자 결정("모니터링에 대한 경고는 일단 전부 알람으로 간다")으로
# **"기준선이 없다" / "조치 레버가 없다"는 더 이상 보류 사유가 아니다.**
# 그래서 이 절은 **승격된 것**과 **아직 못 쓰는 것**이 한눈에 갈리도록 두 표로 나눈다.
#
# ═══ [A] 승격 완료 — 여기 없다. 규칙으로 존재한다 ══════════════════════════════
#
#   ● MySQL 복제 중단           → MysqlReplicationStopped      (이 파일, critical)
#   ● MySQL 복제 지연 증가        → MysqlReplicationLagHigh      (이 파일, warning)
#   ● Redis 단일 스레드 포화      → RedisMainThreadSaturated     (이 파일, warning)
#   ● admit 5xx 비율            → QueueAdmitErrorRatioHigh     (app.yml, critical)
#   ● B2 "admit 요청이 안 온다"   → QueueAdmitRequestsAbsent     (app.yml, info)
#   ● p95 지연                  → QueueAdmissionWaitP95High (app.yml, warning)
#     🔑 p95 300초 critical은 **만들지 않았다**(2026-09-04 사용자 결정). 이 서비스에서
#        p95 5분은 장애가 아니라 설계 의도일 수 있다(30만 명 티켓 오픈인데 severity=critical은
#        사람을 깨운다). 사유는 MONITORING_DESIGN.md 4-3의 미채택 표기에 있다.
#
#   승격하면서 옛 보류 사유가 **이미 거짓이었던 것 셋**을 함께 정정했다:
#     1. "Redis 포화는 조치 레버가 없다" → 거짓. `runbook/enqueue.md`의
#        [증상] Redis master CPU가 100%에 붙었다 가 즉시 조치(해당 큐 max_capacity UPDATE,
#        되돌리기 포함)를 이미 적고 있었다. **보류 사유가 자기 런북과 모순이었다.**
#     2. "redis-cluster 16노드는 앱이 붙지 않으므로 규칙을 안 만든다" → 거짓.
#        §75로 앱이 붙는 곳이 **Cluster다**. 그리고 RedisInstanceDown·RedisClusterDegraded·
#        ExporterDown·RedisMemoryWillHitMaxmemory 가 **이미 job="redis-cluster"를 보고 있었다.**
#        규칙은 이미 있는데 보류 문구만 남아 있었다. 항목 통째로 삭제.
#        ⚠️ 반대로 job="redis"(6379-6381)·job="redis-sentinel"은 §75로 코드에서 제거된
#           학습 자산이다. **새 규칙을 그쪽에 걸지 마라** — 런북이 다른 Redis를 가리키던 전례가 있다.
#     3. "admit 계열은 대상 메트릭이 미구현이라 전부 못 쓴다" → **절반이 거짓이었다.**
#        admit 5xx 비율과 B2는 Spring Boot 기본 `http_server_requests`로 **구현 0으로 쓸 수 있다.**
#        (실측 2026-09-04: uri="/api/v1/queues/{queueId}/admit" 시계열 실재, 24h 표본 66)
#        "커스텀 메트릭이 없다"를 "관측이 없다"로 착각한 것이다. 기본 메트릭을 먼저 봐라.
#
# ═══ [B] 아직 못 쓴다 — 사유는 단 하나, **대상 메트릭이 존재하지 않는다** ═══════════
#
#   임계값을 못 정해서 보류하는 항목은 이제 **없다.** 못 정하면 정하지 말고 "🔴 임계값 근거:
#   없다"를 달고 만든다. 아래는 만들면 **영원히 안 뜨는 알람**이 되는 것들이다 —
#   시계열이 없으면 규칙은 firing이 아니라 **침묵**하고, 그건 없는 것보다 나쁘다(있다고 착각시킨다).
#
#   ● 만료율 (회수 3경로: admitTtl / inactiveTtl / waitingTtl 각각 몇 건인가)
#     - 대체 가능한가 → **아니다(실측 확인).** 지금 존재하는 batch 커스텀 메트릭 5종
#       (queue_waiting_orphans · queue_reconcile_ghosts · queue_reconcile_stale ·
#        queue_billing_mismatch · queue_billing_snapshot_total)은 전부 **다른 것을 센다.**
#       queue_waiting_orphans는 "waiting 맨 앞의 tokens Hash 미스"이지 만료 건수가 아니다.
#       회수 건수는 `TokenReclaimJob:163`의 **log.info 한 줄로만** 남는다(Counter 없음).
#     - 🔑 선행 구현: `TokenReclaimJob`에 회수 3경로 Counter
#       (예: queue.token.reclaimed{reason=admit_ttl|inactive_ttl|waiting_ttl}).
#       라벨은 reason 3종뿐이라 카디널리티 부담이 없다. queueId는 붙이지 마라
#       (같은 클래스 javadoc:179가 이미 그렇게 정해 놨다).
#
#   ● 큐별 admit 판정 — "특정 테넌트만 admit을 멈췄다"
#     - QueueAdmitRequestsAbsent(app.yml)는 **플랫폼 전체**만 잡는다. uri 라벨이 queueId를
#       템플릿으로 접기 때문이다. 큐별로는 못 본다.
#     - 🔑 선행 구현: `queue_admit_requests_total{queue_id, result}` /
#       `queue_admit_tokens_issued_total{queue_id}` (§80 U9). 둘 다 grep 0건.
#       🔴 **라벨은 `queue_id`다 — §80(DECISIONS:5822)의 `queueId` 표기를 따르지 마라.**
#       queue_admission_wait_seconds가 `queue_id`(MONITORING_DESIGN 4-3)를 쓰므로
#       철자가 갈리면 `and on(queue_id)` 조인이 성립하지 않는다. Micrometer는 태그 키를
#       snake_case로 바꿔 주지 않는다 — 구현할 때 손으로 맞춰야 한다.
#     - ⚠️ 그때도 `rate() == 0`만으로는 안 된다. 카운터는 0을 내지 않는다 —
#       한 번도 요청이 없던 (queue_id, instance) 조합은 시계열 자체가 없다.
#       app.yml의 QueueAdmitRequestsAbsent 가 쓴 **`rate()==0 or absent_over_time()` 형태**를
#       queue_id 라벨 위에서 그대로 쓰면 된다(그 규칙 주석에 함정과 근거를 적어 뒀다).
#
#   ● queue-batch 커스텀 메트릭 5종에 대한 규칙 (queue_billing_mismatch != 0 등)
#     - 임계값은 자명하다(0이 정상, -1은 대사 실패). 못 만드는 이유는 임계값이 아니라
#       **batch가 안 떠 있으면 시계열이 사라져 `!= 0` 규칙이 침묵**하기 때문이다.
#       `absent()` 결합이 선행이고, 그건 AppInstanceDown(job=queue-batch)과 겹친다.
#       겹치는 규칙을 놓지 않는다는 원칙(RedisClusterDegraded 주석)은 아직 유효하다.
#     - ⚠️ 이건 "기준선이 없어서"가 아니다. 새 원칙과 충돌하지 않는다.
# ─────────────────────────────────────────────────────────────────────────────
