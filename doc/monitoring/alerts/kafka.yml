# Kafka 적재 알람 규칙 — Queue Platform
#
# infra.yml과 같은 원칙을 따른다: **근거 없는 임계값을 박지 않는다.**
# 아래 규칙이 쓰는 숫자 둘은 추정 기준선이 아니라 **코드에 박힌 상수**다.
#   - 60초  = admitToken TTL (admit.lua ARGV[3], admit-by-* 키의 PX)
#   - 300초 = Token.COMPLETE_VALID_WINDOW_SECONDS (complete의 DB 유효 창)
# 그래서 infra.yml의 "한도가 명시된 자원의 추세"(4번 분류)에 해당한다.
#
# ─────────────────────────────────────────────────────────────────────────────
# 왜 이 알람이 필요한가 — 2026-08-27 실측 사고
#
# 컨슈머 랙이 쌓이자 **정상 입장자의 complete가 404**를 받았다. markCompleted의 술어가
# 요구하는 admit_token·admitted_at은 ADMITTED 이벤트를 컨슈머가 적재해야만 채워지기
# 때문이다. 즉 동기 응답의 인가 판정이 비동기 투영에 걸려 있었다.
#
# 🔴 **그때 이걸 알려준 것이 아무것도 없었다.** 앱은 UP, 브로커도 UP, DB도 UP이었다.
#    통합 시나리오를 돌려서야 알았다. Kafka 브로커 liveness 체크를 붙였어도 못 잡았을
#    종류다 — 죽은 것이 없었기 때문이다. 랙은 **양이지 이진 상태가 아니다.**
#
# 지금은 타입별 그룹 적재(6cc33e1)로 커밋이 83% 줄어 랙이 사라졌지만, 그건 원인 하나를
# 없앤 것이지 랙이 다시 못 쌓인다는 뜻이 아니다.
# ─────────────────────────────────────────────────────────────────────────────
# 🪤 메트릭 이름 함정 — `_lag_max`를 쓰지 마라
#
# 문서 몇 곳이 `kafka_consumer_fetch_manager_records_lag_max`를 가리키는데,
# 이 시계열은 **한가할 때 NaN**이다(실측: 파티션 18개 전부 NaN). 센서가 최근 fetch가
# 없으면 값을 안 낸다. NaN으로는 비교가 성립하지 않아 규칙이 **조용히 침묵**한다.
#
# 파티션별 실값을 내는 것은 접미사 없는 `..._records_lag`다(실측 0.0).
# infra.yml <보류> 절이 경고한 그 함정("규칙이 있다는 착각")과 같은 계열이라 여기 적어 둔다.
# ─────────────────────────────────────────────────────────────────────────────
# 전제: prometheus.yml에 job_name 'queue-consumer'가 등록돼 있다(실가동 확인).
# ⚠️ 아래 규칙은 전부 queue-consumer의 /actuator/prometheus에서만 나오는
#    kafka_consumer_fetch_manager_* 시계열에 의존한다. prod 프로필은 그 엔드포인트를 열지
#    않으므로(2026-09-02), prod에 스크레이프를 붙이면 규칙이 **firing이 아니라 침묵**한다.
#    빈 벡터는 알람을 울리지 않는다 — 침묵하는 것이 하필 critical 규칙이다.
#    prod job 추가 시 노출 재개가 선행이다.
#      evaluation_interval=15s, scrape_interval=15s.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# 🔑 **시간 상수 네 개를 헷갈리지 마라.** 알람 문구에 이름을 적는 이유가 이것이다.
#    2026-09-17 실측 중 실제로 "어느 TTL 인지 모르겠다"는 지적이 나왔다.
#
#   admitToken TTL   60초    Redis PX. admit 이 **입장권을 발급한 시점**부터.
#                            넘으면 그 입장권은 죽는다(복귀 없음, §36)
#   complete 유효 창  300초   MySQL `admitted_at` 부터. 넘으면 완료 기록이 영구 유실된다
#   inactiveTtl      300초*  큐 설정. **폴링이 끊긴 대기자**를 배치가 회수하는 값
#                            🪤 complete 창과 숫자가 같지만 재는 대상도 주체도 다르다
#   waitingTtl      7200초*  큐 설정. 줄에 너무 오래 있은 사람을 배치가 회수하는 값
#                            (*는 큐 생성 시 바꿀 수 있는 기본값)
#
#   그리고 `QueueAdmissionWaitP95High` 의 60초는 **위 넷 중 어느 것도 아니다.**
#   위 넷은 **시스템이 강제하는 값**이라 넘는 순간 실제로 데이터가 죽는다(입장권 만료·완료
#   기록 유실·대기자 회수). 반면 그 60초는 **알람을 울리려고 우리가 정한 숫자**여서
#   시스템은 그 값을 모르고, 넘어도 아무것도 만료되지 않는다.
# ─────────────────────────────────────────────────────────────────────────────

groups:

  - name: queue-platform-kafka-persistence
    rules:

      # 현 소화율로 지금 쌓인 랙을 비우는 데 걸릴 시간이 admitToken TTL(60초)을 넘는다.
      #
      # 왜 60초인가: 이 창을 넘기면 complete의 **Redis 폴백이 받아줄 수 없다.**
      #   admit → (적재 지연) → complete 호출 시 DB에 행이 없으면 admit-by-admit으로
      #   폴백하는데, 그 키의 PX가 60초다. 소화 시간이 60초를 넘으면 폴백조차 미스가 되어
      #   정상 입장자가 404를 받기 시작한다. 즉 이 선이 **사용자 영향이 시작되는 지점**이다.
      #
      # 🔴 **`and`의 좌우 순서가 의미를 바꾼다.** PromQL의 `A and B`는 **A의 값**을 반환한다.
      #    처음엔 `sum(lag) > 0 and (lag/rate) > 60`으로 썼는데, 그러면 $value가 소화 시간이
      #    아니라 **랙 건수**가 되어 랙 5,000건에 "소화 시간 1h 23m"이라고 찍혔다(실측 확인).
      #    사람이 대응 규모를 정하는 바로 그 숫자였다. 소화 시간을 앞에 둬야 humanizeDuration이
      #    의미를 갖는다. 교집합이라 가드 효과는 순서와 무관하다.
      #
      # 🔴 **`rate > 0` 가드를 추가했다.** 컨슈머가 멈추면 rate=0 → 나눗셈이 +Inf가 되어
      #    이 규칙과 300초 규칙이 KafkaConsumerStalled와 **셋 다 동시에** 발화했다.
      #    for가 각각 2m/1m/3m이라 **critical(1m)이 먼저 뜨고 그 조치는 "인스턴스를 늘려라"** 인데,
      #    독약 메시지나 리밸런스 루프에서 인스턴스를 늘리면 리밸런스를 한 번 더 유발할 뿐이다.
      #    정답인 Stalled의 조치는 2분 뒤에 온다. 이제 "느림"과 "멈춤"이 실제로 갈린다.
      #
      # 나눗셈 주의:
      #   - 랙 0이면 분자가 0이라 발화하지 않는다(가드도 함께 건다).
      #   - 컨슈머가 멈춰 rate가 0이면 결과가 +Inf → 발화한다. **의도한 동작이다**
      #     (영원히 안 비워지는 상태가 곧 최악이다).
      #
      # for: 2m — 버스트 직후 일시적으로 랙이 튀는 것은 정상이다. 8회 연속 스크레이프에서
      #           유지돼야 발화한다.
      - alert: KafkaConsumerDrainTimeExceedsAdmitTtl
        expr: |
          (
            sum(kafka_consumer_fetch_manager_records_lag{topic="token-lifecycle"})
            /
            sum(rate(kafka_consumer_fetch_manager_records_consumed_total{topic="token-lifecycle"}[5m]))
          ) > 60
          and
          sum(kafka_consumer_fetch_manager_records_lag{topic="token-lifecycle"}) > 0
          and
          sum(rate(kafka_consumer_fetch_manager_records_consumed_total{topic="token-lifecycle"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "token-lifecycle **DB 적재 지연** {{ $value | humanizeDuration }} — **입장권 유효 시간(60초)** 을 넘었다. 🔑 이 60초는 admit 이 입장권을 **발급한 시점부터**의 유효 시간이다(대기열의 폴링이 끊긴 대기자를 회수하는 시간·줄에 너무 오래 있은 사람을 회수하는 시간 과 무관)"
          impact: "DB 적재가 입장권 유효 시간(60초)보다 늦다. verify·complete 가 DB 폴백을 못 받아 **정상 입장자가 404** 를 받기 시작한다."
          action: "에스컬레이션 필요 — 적재 속도를 올리려면 증설이나 코드 변경이 필요하다. ① 수집: `docker exec q-kafka-1 /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group db-writer` 의 LAG 합계를 적는다. 5분 뒤 다시 재서 **줄고 있는지**도 적는다 → ② 임시 조치: 없다. 🔑 lag 은 지표이지 문제가 아니다 — 줄고 있으면 기다리는 것이 맞다 → ③ 줄지 않으면 백엔드 담당에게 넘긴다. 넘길 것: LAG 두 번의 값과 간격 · KafkaConsumerStalled 동반 여부. 절차는 `doc/monitoring/runbook/kafka-persistence.md` 의 [증상] consumer lag이 줄지 않는다 ⚠️ 오프셋을 latest 로 리셋하지 마라 — 건너뛴 이벤트는 영원히 DB 에 안 들어가고 그게 곧 Redis 에만 있고 DB 에는 없는 토큰이다"

      # 소화 시간이 complete의 DB 유효 창(300초)을 넘는다.
      #
      # 이 선을 넘으면 **되돌릴 수 없다.** 적재가 끝났을 때는 이미 창이 지나 markCompleted가
      # 0행이고, Redis 키는 60초에 이미 사라진 뒤다. 그 사용자의 완료는 어떤 재시도로도
      # 기록되지 않는다 — 과금 근거까지 함께 사라진다.
      # 게다가 ReconcileJob이 300초 뒤 status=1 잔류를 EXPIRED로 확정한다.
      #
      # for: 1m — 이미 warning이 2분간 선행했을 상황이다. 여기서 더 기다릴 이유가 없다.
      - alert: KafkaConsumerDrainTimeExceedsCompleteWindow
        expr: |
          (
            sum(kafka_consumer_fetch_manager_records_lag{topic="token-lifecycle"})
            /
            sum(rate(kafka_consumer_fetch_manager_records_consumed_total{topic="token-lifecycle"}[5m]))
          ) > 300
          and
          sum(kafka_consumer_fetch_manager_records_lag{topic="token-lifecycle"}) > 0
          and
          sum(rate(kafka_consumer_fetch_manager_records_consumed_total{topic="token-lifecycle"}[5m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "token-lifecycle **DB 적재 지연** {{ $value | humanizeDuration }} — **완료를 받아주는 시간(300초)** 을 넘었다. 🔑 이 300초는 DB 의 `admitted_at` 부터 재는 완료 허용 창이다. 🪤 큐 설정의 `폴링이 끊긴 대기자를 회수하는 시간` 기본값도 300초라 숫자가 같지만 **완전히 다른 것**이다(그쪽은 폴링이 끊긴 대기자를 회수하는 값)"
          impact: "완료를 받아주는 시간(300초)을 넘긴다. 그 구간 사용자의 **완료 기록이 영구 유실**되고, 토큰은 status=1 에 남아 과금만 된다."
          action: "에스컬레이션 필요 — 컨슈머 증설은 배포 작업이다. 🔑 이 구간의 완료 기록은 나중에 밀린 것이 처리돼도 복구되지 않는다. ① 수집: 위 AdmitTtl 알람과 같은 명령으로 LAG 합계를 두 번(5분 간격) 재서 적는다 → ② 임시 조치: 없다 → ③ 백엔드 담당에게 즉시 넘긴다(critical). 넘길 것: LAG 값 두 개 · 시작 시각 · 영향 구간 추정. 유실 범위는 `doc/monitoring/queries/kafka-persistence.md` §3 의 차집합 스크립트로 뽑는다(아침에 해도 된다) ⚠️ concurrency 를 올리는 것은 실측상 역효과였다(200→147/s). 당직자가 임의로 올리지 마라"

      # 랙은 있는데 소화가 완전히 멈췄다.
      #
      # 위 두 규칙과 겹쳐 보이지만 다른 것을 잡는다 — 위는 "느리다"이고 이건 "안 돈다"다.
      # 리밸런스 무한 루프, 독약 메시지, DB 커넥션 고갈이 여기로 온다. 이진 상태에 가까워
      # 임계값이 없다.
      #
      # 🔴 컨슈머가 **죽으면** 이 규칙은 침묵한다 — kafka_consumer_* 시계열이 0이 되는 게
      #    아니라 사라지기 때문이다. 그때 남는 신호는 infra.yml의 AppInstanceDown뿐이다.
      #    두 규칙을 함께 봐야 하는 이유다.
      - alert: KafkaConsumerStalled
        expr: |
          sum(kafka_consumer_fetch_manager_records_lag{topic="token-lifecycle"}) > 0
          and
          sum(rate(kafka_consumer_fetch_manager_records_consumed_total{topic="token-lifecycle"}[5m])) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "token-lifecycle 컨슈머가 **3분간 한 건도 적재하지 못했다** (잔여 {{ $value }}건). 🔑 여기서 멈춘 것은 Kafka→MySQL **적재**다 — 대기열(Redis)과 입장(admit)은 계속 돈다"
          impact: "적재가 완전히 멈췄다. 위 둘은 시간 문제일 뿐이고, lag 이 계속 늘어 **복구 시 소화에도 그만큼 걸린다.**"
          action: "에스컬레이션 필요 — 컨슈머가 담당 Kafka 파티션을 계속 주고받는 상태·처리 불가능한 메시지 판정은 코드 쪽이다. ① 수집: `docker exec q-kafka-1 /opt/kafka/bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group db-writer` 로 **Kafka 파티션이 컨슈머에 할당돼 있는지**(CONSUMER-ID 가 비어 있지 않은지)와 LAG 을 적는다 → ② 임시 조치: 컨슈머 컨테이너가 죽어 있으면 `docker start q-consumer` 한 번은 해도 된다. 살아 있으면 없다 → ③ 백엔드 담당에게 넘긴다. 넘길 것: CONSUMER-ID 유무 · LAG · consumer 로그의 rebalance 문구 유무 ⚠️ max.poll.interval.ms 를 무작정 키우지 마라 — 컨슈머가 담당 Kafka 파티션을 계속 주고받는 상태를 늦출 뿐 원인은 그대로다"

# ─────────────────────────────────────────────────────────────────────────────
# <보류>
#
# ● 그룹 단위 LAG 합계 (kafka_exporter)
#   → 미설치다. 위 규칙은 **클라이언트가 스스로 보고하는 랙**을 쓴다. 차이가 있다:
#     클라이언트 랙은 그 컨슈머가 **할당받은 파티션만** 센다. 컨슈머가 전부 죽으면
#     시계열이 사라져 랙이 "0"이 아니라 **없음**이 된다(위 KafkaConsumerStalled 주석 참조).
#     그룹 단위 절대 랙이 필요해지면 kafka_exporter를 붙이고 그때 규칙을 옮긴다.
#
# ● 적재 지연 시간을 직접 재는 메트릭 (발행 시각 → 적재 시각)
#   → 위 규칙은 랙과 소화율로 **추정**한다. 직접 재려면 이벤트에 발행 타임스탬프를 싣고
#     컨슈머가 Timer로 기록해야 하는데, 지금 그걸 만들 이유가 없다 — 추정값으로도
#     "60초/300초를 넘느냐"는 갈린다. 추정이 실제와 어긋나는 사례가 나오면 그때 만든다.
# ─────────────────────────────────────────────────────────────────────────────
