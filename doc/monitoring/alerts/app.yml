# 애플리케이션 알람 규칙 — Queue Platform
#
# infra.yml / kafka.yml과 **원칙이 다른 파일**이다. 그 둘은 "임계값이 필요 없는 것"과
# "코드에 박힌 상수"만 골랐다. 이 파일의 규칙은 **근거 없는 임계값을 의도적으로 박는다.**
#
#   근거: 사용자 결정(2026-09-04) — "모니터링에 대한 경고는 일단 전부 알람으로 간다.
#         실제로 대응하는 것은 그 다음 문제다."
#
# 그래서 이 파일의 각 규칙에는 **임계값 근거 유무를 반드시 명시**한다. 근거가 없으면
# "근거 없음"이라고 쓴다. 이 표기를 지우지 마라 — 지우는 순간 그 숫자는 "이미 정해진 값"이
# 되어 아무도 다시 묻지 않는다. 이 레포가 계속 경계해 온 그 패턴이다.
#
# severity 체계·전제(evaluation_interval=15s, scrape_interval=15s, Alertmanager 설치 범위)는
# infra.yml 상단 정의를 그대로 따른다.
#
# ⚠️ 이 파일의 규칙은 전부 queue-api의 /actuator/prometheus 에만 존재하는 커스텀 메트릭에
#    의존한다. **dev 는** 그 엔드포인트를 열지 않으므로(`health, info, metrics`) 그쪽 job을 붙이면
#    규칙은 firing이 아니라 **침묵**한다. 빈 벡터는 알람을 울리지 않는다.
#    prod 는 2026-09-19부터 **관리 포트 9080**(api)으로 prometheus 를 연다(업무 포트에선 404).
#    🪤 dev는 404라 "안 울리네 = 정상이네"로 오독되기 쉽다.
# ─────────────────────────────────────────────────────────────────────────────
# 메트릭 계약 (backend 구현과 여기가 어긋나면 알람은 영원히 안 뜬다)
#
#   Micrometer Timer  이름: queue.admission.wait
#   노출 이름         queue_admission_wait_seconds_{bucket,count,sum}
#   기록 지점         admit 성공 시, issuedAt → admittedAt 차이 (QueueEngineService admit 경로)
#   라벨              queue_id 하나  (MONITORING_DESIGN.md 4-3)
#   버킷(SLO)         1, 3, 10, 30, 60, 120, 300, 600, 1800, 3600, 7200, 14400 (초) + +Inf
#                     = QueueEngineService.ADMISSION_WAIT_SLO (구현과 대조 완료 2026-09-04)
#   부수 Timer        queue_admission_clock_skew_seconds_{count,sum,max}{queue_id}
#                     🔑 크기를 같이 남긴다 — 건수만으로는 µs 잡음과 분 단위 고장을 구분 못 한다
#                     — 음수 대기(admit 시각 < enqueue 시각)를 표본에서 빼고 여기 센다
#
# 🔴 **publishPercentileHistogram(true) 를 쓰면 안 된다.** 기본 버킷은 실측 69개다(§80).
#    큐 1,000개면 69,000 시계열이고 현재 head 전체가 18,062다(2026-09-04 실측). 4배가 된다.
#    반드시 serviceLevelObjectives(...) 로 위 12개만 낸다 → 큐당 15 시계열(버킷 13 + count + sum).
#
# 🔴 **60 과 300 은 버킷 경계로 반드시 존재해야 한다.** histogram_quantile은 버킷 안에서
#    선형보간을 하므로, 경계가 없으면 "p95 > 60" 판정이 보간값 위에서 이뤄진다.
#    경계가 정확히 60·300이면 판정은 "60초 이하가 95% 미만인가"와 **정확히 동치**가 된다.
#    나머지 10·30·120·600·1800·3600은 판정용이 아니라 분포를 볼 수 있게 하는 해상도다.
#    (1800·3600은 §86이 queue_daily_stats 히스토그램 후보로 검토했던 le_60~le_3600과 같은 범위다.
#     내가 처음 제안한 목록에는 5초가 있고 1800·3600이 없었는데, 구현 쪽 목록을 따랐다 —
#     판정에 쓰는 60·300이 양쪽에 다 있어 알람 동작은 동일하고, 상단 꼬리는 저쪽이 더 넓다.)
#
# 🔴 **sum by (queue_id, le) 없이 histogram_quantile을 쓰면 안 된다.** queue-api는 N대이고
#    같은 큐의 admit이 아무 인스턴스에서나 처리된다. instance 라벨을 남기면 인스턴스별
#    p95가 나와 실제 사용자 분포와 다른 값이 된다.
# ─────────────────────────────────────────────────────────────────────────────
# 🔴 이 메트릭이 **못 잡는 것** — 알람을 만든 동기와 직결되므로 먼저 읽어라
#
# 이 규칙의 명분은 "대기 시간 p95 폭증 = admit을 안 부르는 테넌트 = 그 큐가 계속 자라
# Redis 마스터를 독식(§87 co-tenant OOM)"이다. 그런데 관측은 **admit 성공 시에만** 기록된다.
#
#   → Tenant가 admit을 **완전히 멈추면 관측이 0건**이 되고, rate()가 0이라
#     histogram_quantile은 NaN을 낸다. 비교는 거짓이 되어 **알람은 침묵한다.**
#     가장 심한 경우가 가장 조용하다.
#
# 즉 이 규칙이 잡는 것은 "admit이 **느려지는** 테넌트"지 "admit이 **멈춘** 테넌트"가 아니다.
# 후자는 카운터가 아니라 "대기자가 있는데 admit 관측이 없다"는 결합 조건이 필요하고,
# 그건 임계값 문제가 아니라 설계 문제다(infra.yml <보류> 절의 B2 항목과 같은 계열).
# 여기에 규칙을 하나 더 만들어 덮지 않는다.
#
# 🔴 **정정 (2026-09-09).** 원래 사유는 "대상 메트릭(queue_admit_requests_total)이 아직 없다"였다.
#    그 메트릭은 이제 있다(§80 U9 구현). **그런데 결론은 그대로다** — 사유가 바뀌었을 뿐이다.
#    막는 것은 admit 쪽 메트릭이 아니라 **대기자 수를 큐별로 내보내는 시계열이 없다**는 것이다.
#    그것 없이 큐별 `rate()==0`을 걸면 (a) 과거에 admit이 있던 조용한 큐가 **오발화**하고,
#    (b) 한 번도 admit이 없던 큐는 **영원히 침묵**한다(없는 시계열의 queue_id는 열거할 수 없다).
#    (b)가 더 나쁘다 — 그게 바로 이 규칙이 잡고 싶은 대상이다.
#    사유와 선행 조건 전문은 infra.yml <보류> B절에 있다(비용은 장벽이 아니다 — 순회는 이미 있고
#    진짜 장벽은 batch gauge에 queue_id 라벨을 달 것인가라는 카디널리티 정책이다).
# ─────────────────────────────────────────────────────────────────────────────

groups:

  - name: queue-platform-admission-wait
    rules:

      # 대기 시간 p95가 60초를 넘었다.
      #
      # 🔴 **임계값 근거: 없다.** MONITORING_DESIGN.md 4-3이 "p95 1분 → 경고"라고 적어 놨을 뿐이고,
      #    그 문서에도 산출 근거는 없다. 설계 문서에 적혀 있다는 것은 근거가 아니다.
      #    부하 기준선(프로덕션 테넌트가 실제로 얼마나 빨리 admit을 부르는가)은 아직 0이다.
      #
      # 참고로 잰 것 — **근거가 아니라 "지금은 안 울린다"의 확인**이다:
      #    2026-09-04 replica(3307) `tokens` 실측 745건 (issued_at→admitted_at):
      #    min 0s / avg 4.29s / max 24s, ≤10s 가 679건(91%), ≤30s 가 745건(100%).
      #    → 60초는 관측 최댓값의 2.5배라 이 부하로는 발화하지 않는다.
      #    ⚠️ WSL2 단일 머신 + k6 합성 부하다. **프로덕션 용량·행동의 근거로 쓰지 마라.**
      #       admit을 부른 것도 실제 Tenant가 아니라 부하 스크립트다.
      #
      # for: 5m — rate[5m] 자체가 이미 5분 평활이라 그 위에 짧은 for를 얹어도 얻는 게 없다.
      #           20회 연속 스크레이프 동안 유지돼야 발화한다.
      #
      # 표본 수 가드를 넣지 않았다: 5분에 admit이 1건뿐인 큐에서 그 1명이 10분 기다렸다면
      # 그것 자체가 "Tenant가 거의 안 부르고 있다"는 신호다. 가드를 걸면 그게 사라진다.
      - alert: QueueAdmissionWaitP95High
        expr: |
          histogram_quantile(0.95,
            sum by (queue_id, le) (rate(queue_admission_wait_seconds_bucket[5m]))
          ) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "큐 {{ $labels.queue_id }} 에서 **대기자가 입장까지 걸린 시간**(상위 5% 기준) = {{ $value | humanizeDuration }}. 경고선 60초를 넘겼다. 🔑 이 60초는 **알람을 울리려고 정한 숫자일 뿐이다** — 넘어도 입장권이 만료되거나 자리가 사라지지는 않는다(입장권 TTL 60초와 숫자만 같고 아무 관계가 없다)"
          impact: "사용자가 기다리다 창을 닫는다. admit 이 멈춘 게 아니라 **느린 것**이라 5xx 로는 안 보이고, 이탈은 지표에 안 남는다."
          action: "에스컬레이션 필요 — 입장 속도는 이 큐를 쓰는 고객사(Tenant)가 정한다. 당직자가 빠르게 만들 수단이 없다. ① 수집: `docker exec q-redis-a-1 redis-cli -c -p 7001 zcard \"queue:{{\"{\"}}{{ $labels.queue_id }}{{\"}\"}}:waiting\"` 로 대기 인원을 적는다(0 이면 다른 클러스터다 — -p 8001 로 한 번 더). 큐 ID·대기 인원·p95 값을 기록한다. 🔑 판단: 대기 인원이 **10분 뒤 줄어 있으면** 빠지는 중이니 기록만 남긴다. **늘고 있으면** 유입이 입장보다 빠른 것이라 ③ 이 급하다 → ② 임시 조치: 없다. 없다. 🪤 큐 일시 정지(`/pause`)를 떠올릴 수 있지만 **그 API 는 테넌트 JWT 를 요구한다** — 당직자에게는 그 토큰이 없어 401 이다. 멈추려면 고객사가 직접 해야 한다 → ③ 테넌트 연락 담당에게 넘긴다. 넘길 것: 큐 ID · 대기 인원 · p95 · 그 테넌트가 admit 을 부르는 주기 ⚠️ 큐를 지우거나 Redis 키를 건드리지 마라 — 대기열이 사라진다"

  # ===========================================================================
  # admit 경로 — 구현 0으로 지금 쓸 수 있는 것 (2026-09-04 <보류>에서 승격, 사용자 결정)
  # ===========================================================================
  # 🔑 여기 두 규칙은 **커스텀 메트릭이 필요 없다.** Spring Boot 기본 `http_server_requests`를 쓴다.
  #    application.yml:160-164 가 `percentiles-histogram: http.server.requests: true` 라
  #    버킷까지 이미 나온다.
  #
  #    실측(2026-09-04, Prometheus 24h): uri="/api/v1/queues/{queueId}/admit" 시계열이
  #    실재한다(status=200/outcome=SUCCESS, 표본 66). http_server_requests_seconds_bucket 은
  #    16개 조합에 대해 **897 시계열**(조합당 약 56)이다.
  #    → §80이 "기본 히스토그램은 버킷이 너무 많다"고 판정한 그 숫자가 여기서 다시 확인된다.
  #      기존 uri 라벨은 queueId를 **템플릿으로 접으므로** 큐 수와 무관해 문제가 없지만,
  #      queue_admission_wait_seconds 에 기본 히스토그램을 쓰면 큐 수만큼 곱해진다.
  # ===========================================================================
  - name: queue-platform-admit-http
    rules:

      # admit 호출이 5xx로 실패하고 있다.
      #
      # 🔴 **임계값 근거: 없다.** 5%는 임의다. 정상 오류율의 기준선이 0이다
      #    (24h 실측 admit 응답은 status=200 66건뿐, 5xx 시계열은 아예 없다).
      #    기준선이 0에 가깝다면 임계는 5%가 아니라 0에 가까워야 맞을 수도 있다. 첫 실부하에서 재라.
      #
      # 왜 이게 중요한가: admit이 실패하면 Tenant는 입장을 못 시키고 그 큐는 계속 자란다.
      # QueueAdmissionWaitP95High 와 같은 종착점(§87 co-tenant OOM)이지만 **원인이 반대**다 —
      # 저쪽은 Tenant가 안 부르는 것이고, 이쪽은 불렀는데 Platform이 실패시키는 것이다.
      #
      # 🪤 분자(5xx)는 오류가 한 번도 없으면 **시계열 자체가 없다.** 그래서 평상시 이 식은
      #    값이 0이 아니라 **빈 벡터**이고 발화하지 않는다 — 의도한 동작이다.
      #    "0이 안 나온다"를 결함으로 보고 `or vector(0)`을 붙이지 마라. 붙이면 앱이 죽어
      #    분모까지 사라졌을 때 0/0이 되어 조용해진다.
      - alert: QueueAdmitErrorRatioHigh
        expr: |
          sum(rate(http_server_requests_seconds_count{job="queue-api",uri="/api/v1/queues/{queueId}/admit",status=~"5.."}[5m]))
          /
          sum(rate(http_server_requests_seconds_count{job="queue-api",uri="/api/v1/queues/{queueId}/admit"}[5m]))
            > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "admit 5xx 비율 {{ $value | humanizePercentage }} 5분 지속 — 고객사(Tenant) 서버가 입장을 못 시키고 있다"
          impact: "Tenant 가 입장을 못 시킨다. 줄은 계속 쌓이는데 배출이 0 이라 대기 인원과 Redis 메모리가 함께 늘어난다."
          action: "에스컬레이션 필요 — 원인이 코드·인프라 쪽이라 당직자가 고칠 수 없다. ① 수집: `docker logs --tail 200 q-api-1 2>&1 | grep -iE 'admit|exception'` 로 스택트레이스 첫 줄과 시각을 적는다(api 는 q-api-1~3 이니 셋 다 본다). 🔑 판단: 예외가 **Redis 계열이면** ② 로, **Kafka 계열이면** QueueAdmitPublishFailing 조치로 간다. `docker exec q-redis-a-1 redis-cli -c -p 7001 cluster info` 의 cluster_state 도 함께 → ② 임시 조치: RedisClusterDegraded / RedisInstanceDown 이 같이 떠 있으면 그쪽 조치가 먼저다(그게 원인이다). 아니면 없다 → ③ 백엔드 담당에게 넘긴다. 넘길 것: 스택트레이스 · 5xx 비율 · cluster_state · 같이 뜬 알람 목록 ⚠️ 앱을 먼저 재시작하지 마라 — 원인 스택이 사라지고 5xx 는 그대로 난다"

      # 🔴 B2 — "admit 요청이 아예 안 온다". <보류> 절이 남긴 함정을 여기서 푼다.
      #
      # 함정: `rate() == 0`으로만 쓸 수 없다. Micrometer는 **첫 호출 때 미터를 만든다.**
      #       앱 기동 후 admit이 한 번도 없으면 시계열 자체가 없고, 빈 벡터는 발화하지 않는다.
      # 반대로 `absent_over_time()`으로만 쓸 수도 없다. 한 번이라도 불린 뒤 멈추면 카운터는
      #       평평한 값으로 **계속 보고된다** — absent가 아니다.
      # → 둘은 서로의 사각을 메운다. **OR가 정답이고, 둘 중 하나만 쓰면 절반이 안 잡힌다.**
      #
      #   (a) rate == 0        : 불리다가 멈춘 경우
      #   (b) absent_over_time : 기동 후 한 번도 안 불린 경우
      #
      # `and on() (sum(up) > 0)` 가드가 필수다. 앱이 죽으면 (a)(b) 둘 다 참이 되는데
      # 그건 admit 문제가 아니라 AppInstanceDown 담당이다. 두 알람이 같은 사건에 겹치면
      # 새벽에 잘못된 조치(admit 조사)부터 하게 된다. `on()`인 이유는 좌변이 sum/absent라
      # **라벨이 비어 있어** 기본 매칭이 성립하지 않기 때문이다.
      #
      # 🔴 **큐별 판정은 불가능하다.** uri 라벨은 `{queueId}`를 **템플릿으로 접는다.**
      #    즉 이 규칙은 "플랫폼 전체에서 15분간 admit이 0건"만 잡는다. "특정 테넌트만 멈췄다"는
      #    잡지 못한다. 그 선행이던 queue_admit_requests_total{queue_id}는 2026-09-09에 생겼지만,
      #    큐별 규칙은 여전히 못 만든다 — 사유는 이 파일 상단 "정정 (2026-09-09)" 절을 봐라
      #    (대기자 수 시계열이 없어 조용한 큐가 전부 발화한다). 라벨 철자도 queue_id다.
      #    큐별로 보이게 하려고 uri 라벨을 풀지 마라 — 큐 수만큼 uri가 생겨 카디널리티가 터진다.
      #
      # severity=info인 이유: 로컬에서 앱을 띄워 두고 부하를 안 주면 상시 firing이다.
      #   AppInstanceDown과 같은 처리다(그 규칙 주석 참조). prod job이 추가되면 그 job만 warning으로 올린다.
      #
      # 15m: 임계값 근거 없음. Tenant의 정상 admit 주기를 모른다.
      #      Backpressure Pull이라 주기는 Tenant 소관이고, 계약상 정해진 값이 없다.
      - alert: QueueAdmitRequestsAbsent
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{job="queue-api",uri="/api/v1/queues/{queueId}/admit"}[15m])) == 0
            or
            absent_over_time(http_server_requests_seconds_count{job="queue-api",uri="/api/v1/queues/{queueId}/admit"}[15m])
          )
          and on() (sum(up{job="queue-api"}) > 0)
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "queue-api는 살아 있는데 admit 호출이 15분간 0건 — 전 테넌트가 입장을 안 시키고 있다"
          impact: "Platform 은 멀쩡한데 **아무도 입장하지 못한다.** 대기자는 계속 쌓이고, 오래 기다린 사람부터 폴링이 끊긴 대기자를 회수하는 시간 로 만료된다(과금은 되고 입장은 못 한 상태)."
          action: "에스컬레이션 필요 — Platform 은 멀쩡하고 Tenant 가 입장을 안 시키는 상태다. 당직자가 대신 시킬 수 없다. ① 수집: 대기자가 실제로 있는지 본다 `for p in 7001 7002 7003 8001 8002 8003; do docker exec q-redis-a-1 redis-cli -p $p --scan --pattern 'queue:*:waiting'; done` 로 큐를 찾고 각각 zcard 로 인원을 센다. 🔑 --scan 은 접속한 노드만 훑으므로 6포트를 다 돌아야 한다. 판단: 전부 **0 이면 줄이 빈 것이라 정상**이고 여기서 끝이다. **한 곳이라도 0 이 아니면** 기다리는 사람이 있는데 입장이 안 되는 것이므로 ③ 으로 간다 → ② 임시 조치: 없다 → ③ 대기자가 있는데 admit 이 0 이면 테넌트 연락 담당에게 넘긴다. 넘길 것: 큐 ID · 대기 인원 · 마지막 admit 시각 ⚠️ 대기열을 비우지 마라 — 그 사람들은 이미 줄을 선 상태이고 과금 대상이다"

      # 음수 대기 시간이 관측됐다 = API 서버들 사이 시계가 어긋나 있다.
      #
      # 🔴 **임계값 근거: 필요 없다. 0이 유일한 정상값이다.** 음수 대기는 물리적으로 불가능하고
      #    (enqueue보다 먼저 admit될 수 없다), 나오면 원인은 하나 — 서버 간 시계 스큐다.
      #    §86에서 queue_daily_stats.max_wait_sec 에 **-398초**가 실측됐다. 이미 일어난 일이다.
      #
      # 왜 알람인가: 이 카운터가 오르는 만큼 위 p95 규칙의 **표본이 빠진다.**
      #    구현이 음수를 clamp하지 않고 표본에서 제외하기 때문이다(그게 맞는 선택이다 —
      #    clamp하면 스큐가 영원히 안 보인다). 즉 이 값이 크면 QueueAdmissionWaitP95* 는
      #    **편향된 부분집합 위에서 계산된 값**이고, 그 사실이 이 규칙 없이는 어디에도 안 드러난다.
      #    p95 알람을 믿으려면 이게 0이어야 한다.
      #
      # for: 15m — 스큐는 급한 일이 아니다(NTP 조정으로 끝난다). 다만 조용히 쌓이면 안 된다.
      # 🪤 두 번째 절의 근거는 아래 QueueAdmitPublishFailing 주석과 같다 — 스큐 카운터도
      #    지연 등록이라 **첫 스큐 1건이면 시계열이 1로 태어나** increase가 0을 낸다.
      - alert: QueueAdmissionClockSkewDetected
        expr: |
          sum by (queue_id) (increase(queue_admission_clock_skew_seconds_count[1h])) > 0
          or
          sum by (queue_id) (queue_admission_clock_skew_seconds_count
                             unless queue_admission_clock_skew_seconds_count offset 1h) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "큐 {{ $labels.queue_id }} 에서 '입장한 시각이 줄 선 시각보다 빠른' 기록이 1시간에 {{ $value }}건 나왔다. 있을 수 없는 값이다 — 줄 세운 서버와 입장시킨 서버의 시계가 서로 다르다는 뜻이다(API 서버가 6대다)"
          impact: "그 건수만큼 대기 시간 통계에서 빠진다. 통계가 실제보다 빨라 보이고, 정말 느려졌을 때 대기 시간 경보가 안 뜬다. 사용자에게 직접 가는 피해는 없다"
          action: "🔑 먼저 **얼마나 어긋났는지** 본다. Grafana 나 Prometheus 에서 `max by (queue_id) (queue_admission_clock_skew_seconds_max)` 를 조회한다 → ① 값이 **0.01초 미만**이면 고장이 아니다. 대기 시간이 0에 가까운 사람의 부호가 뒤집힌 것뿐이다 (2026-09-17 실측: 호스트 시계 오차 1~2µs 인데 47만 건 중 32건 발생). 건수만 적어 두고 넘어간다 → ② 값이 **1초 이상**이면 진짜 시계 고장이다. API 서버(app·app2) 각각에서 `timedatectl status` 의 `System clock synchronized` 를 확인하고, `no` 인 서버에서 `sudo systemctl restart chrony` 후 1분 뒤 다시 본다 → ③ 전부 `yes` 인데 값이 1초 이상이면 백엔드 담당에게 넘긴다. 넘길 것: 큐 ID · 건수 · 최대 크기 · 각 서버의 `timedatectl status` ⚠️ `date -s` 로 시계를 손으로 맞추지 마라. 시간이 뒤로 점프하면 이미 발급된 입장권이 한꺼번에 만료된다"

  # ===========================================================================
  # admit 커스텀 메트릭 — §80 U9 (2026-09-09 구현). infra.yml <보류> B절에서 승격.
  # ===========================================================================
  # 🔴 **라벨은 `queue_id`다** (§80 DECISIONS:5822의 `queueId` 표기가 아니다).
  #    queue_admission_wait_seconds 와 같은 철자여야 `and on(queue_id)` 조인이 성립한다.
  #    구현이 손으로 맞춰 놨고(QueueEngineService.recordAdmitRequest), 계약은
  #    AdmitRequestMetricTest 가 문자열로 건다 — 철자가 갈리면 거기가 빨개진다.
  # ===========================================================================
  - name: queue-platform-admit-custom
    rules:

      # ADMITTED 발행이 실패했다 = Kafka에 안 갔다.
      #
      # 🔑 **이 규칙이 존재하는 이유는 "다른 데서는 절대 안 보인다"는 것 하나다.**
      #    admit은 Lua가 이미 커밋된 뒤라 5xx를 줄 수 없어 **항상 200**이다(FRS §6.4).
      #    그래서 QueueAdmitErrorRatioHigh(http_server_requests, 5xx)는 이 사건을 못 잡는다.
      #    구현 전까지 유일한 흔적은 publishAdmitted 의 ERROR 로그 한 줄이었고, 로그는 알람이 아니다.
      #
      # 무엇이 깨지나: 발행이 빠진 토큰은 `admitted_at`이 NULL로 남는다. complete 술어의
      #    `admitted_at > UTC_TIMESTAMP(3) - INTERVAL {유효 창} SECOND`가 NULL을 배제하므로
      #    **그 사용자는 complete가 영구 404**다. 입장은 했는데 원장에는 영원히 안 남는다.
      #    Tenant는 200을 받았으니 재시도할 이유가 없다 — 자동 복구 경로가 없다(FRS §6.4).
      #
      # 🔴 **임계값 근거: 필요 없다. 0이 유일한 정상값이다.** 비율이 아니라 건수로 본다 —
      #    발행 실패 1건 = 영구 404 사용자 1명 이상이고, 비율로 누르면 대량 admit 중의
      #    소수 실패가 임계 아래로 숨는다.
      #
      # 🔴 **`increase()` 하나로는 실패 1건을 못 잡는다 — 두 번째 절이 그래서 있다.**
      #    `increase()`는 구간의 첫 표본을 기준선으로 삼는다. Micrometer는 첫 발생 때 미터를
      #    만들므로 error 시계열은 **값 1로 태어나고**, 상수 1의 델타는 0이다("0으로 외삽" 보정은
      #    델타 > 0일 때만 걸린다). 그러면 **영원히 침묵**한다 — 이 규칙의 명분이
      #    "실패 1건 = 영구 404 사용자 1명 이상"인데 정확히 그 경우가 사각이었다.
      #    promtool 실측(2026-09-09): 1로 태어나 상수 → 미발화 / 1→2 → 발화 / 0→1 → 발화
      #
      #    → 두 번째 절 `unless ... offset 10m`이 **"이번 창에 새로 생긴 시계열"** 을 잡는다.
      #      `offset 10m` 시점에 없던 계열만 남으므로 갓 태어난 1이 걸리고, 10분 뒤 자동 해소된다.
      #
      #    🪤 **앱에서 미터를 미리 등록해 0을 심는 안을 검토했다가 버렸다.** 등록과 증가가 같은
      #       호출 안이라 **그 큐의 첫 admit이 곧 실패하면 여전히 1로 태어난다**(promtool 재현).
      #       앱이 반만 보상하고 주석은 다 한다고 말하게 되며 시계열만 큐당 4개로 늘었다.
      #       🔑 **보정은 한 곳에서만 한다 — 여기다.** 앱 코드에 이 목적의 등록을 다시 넣지 마라.
      #
      # 🪤 `$value`는 **요청 건수지 사용자 수가 아니다.** 실패한 **토큰 수**는 어떤 메트릭에도
      #    없고 로그에만 있다("ADMITTED 발행 실패 … 실패=N건 / 시도=M건") —
      #    폭발 반경은 반드시 ①의 로그로 확인해라. (두 번째 절로 발화하면 $value가 없다)
      # 🔧 **2026-09-23 이후 반경이 줄었다.** 예전에는 첫 실패에서 끊어 그 요청의 **나머지 전부**가
      #    묶였다(count=300이면 최대 300명). 지금은 `publishAll` 이 전량 보내고 실패한 건만 세므로
      #    "1건 실패 = 1명"이 기본이다 — 다만 **원인이 공통(브로커 다운)이면 여전히 전량 실패**다.
      - alert: QueueAdmitPublishFailing
        expr: |
          sum by (queue_id) (increase(queue_admit_requests_total{result="error"}[10m])) > 0
          or
          sum by (queue_id) (queue_admit_requests_total{result="error"}
                             unless queue_admit_requests_total{result="error"} offset 10m) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "큐 {{ $labels.queue_id }} 에서 ADMITTED 발행 실패 admit {{ $value }}건/10m — 영향 사용자 수는 로그의 '실패=N건' 을 봐야 안다"
          impact: "그 토큰들은 **complete 가 영구 404** 가 된다. 사용자는 입장했는데 과금 기록에 완료 기록이 없다. admit 은 200 을 돌려줬으므로 HTTP 지표로는 절대 안 보인다."
          action: "에스컬레이션 필요 — 복구가 DB 직접 수정이라 당직자가 손대지 않는다. ① 수집(가장 먼저, 로그는 사라진다): queue-api 로그에서 `ADMITTED 발행 실패` · `ADMITTED 발행 생략` · `ADMITTED 발행 예산 초과` 중 **어느 것들이 나왔는지(셋은 한 요청에서 동시에 날 수 있다) · 실패=N건/시도=M건 · queueId**를 적는다(2026-09-23 에 문구가 바뀌었다 — `발행 중단` 은 더 이상 나오지 않는다). 개별 tokenId 는 **`발행 실패 tokenId=` 와 `발행 실패(전송 전) tokenId=` 두 줄에 있다**(앞쪽이 브로커 장애의 흔한 모양이다). `예산 초과` 줄에는 없다 — 그 건들은 개별 식별 수단이 0 이다 → ② 임시 조치: `발행 생략` **만** 있고 배포 중이면 배포 완료를 기다리면 멈춘다(🪤 `발행 실패`·`예산 초과` 가 **같이** 나왔다면 그쪽이 먼저다 — 배포를 기다리는 사이 원장이 계속 샌다). `발행 실패` 나 `예산 초과` 면 브로커를 본다 `docker exec q-kafka-1 /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092,localhost:9192,localhost:9292` — 3대 전부 응답하면 브로커는 정상이다(한 대만 찍으면 그 한 대가 죽었을 때 오진한다) → ③ 백엔드 담당에게 넘긴다. 넘길 것: 로그 문구 · 첫 tokenId · 건수 · 브로커 응답 여부 ⚠️ tokens 테이블을 직접 UPDATE 하지 마라. 앱을 재시작해도 건너뛴 분은 재발행되지 않는다 — 🔑 **수집(①)은 지금 해야 한다 — 로그가 사라진다.** 그 뒤의 복구는 더 나빠지지 않으므로 아침으로 넘겨도 된다"

  # ── 런타임 (프로세스가 살아 있는가 · 컨테이너 한도에 붙었는가) ─────────────────
  #
  # 🔑 이 그룹의 존재 이유는 **2026-09-15 AWS 5차의 cgroup OOM**이다. mem_limit 1g를 넘긴
  #    것은 힙이 아니라 비힙이었고, 컨테이너가 죽고 재시작됐는데 **앱 로그는 0건**이었다.
  #    앱이 자기 죽음을 기록할 방법이 없다 — 밖에서 보는 수밖에 없다.
  - name: queue-platform-runtime
    rules:

      # 임계값 근거: **있다.** 재시작은 임계값이 아니라 사실이다(0회 → 1회).
      #
      # 🪤 `process_start_time_seconds`는 프로세스 시작 시각(epoch)이다. 컨테이너가 재시작하면
      #    값이 바뀌므로 `changes()`가 1 이상이 된다. **배포도 같은 모양으로 잡힌다** —
      #    구분할 수단이 없고, 구분하려 들면 배포 시각을 어딘가에 또 적어야 한다(§4).
      #    배포 중이면 사람이 안다. 모르는 재시작이 위험한 것이다.
      #
      # 🪤 job 정규식이 `queue-.*`인 이유: **환경마다 job 이름이 다르다.** AWS는 queue-api·
      #    queue-worker 둘인데 로컬은 queue-api·queue-batch·queue-consumer 셋이다(실측).
      #    이름을 열거하면 한쪽에서 조용히 안 본다 — 규칙은 빈 벡터에 아무 말도 안 한다.
      #
      # 🪤 15m인 이유: 스크레이프 5s라 더 짧게 잡아도 되지만, 롤링 배포로 인스턴스가 차례로
      #    뜨면 통지가 인스턴스 수만큼 쪼개진다. 15m이면 한 통으로 묶인다(group_interval 5m).
      - alert: AppRestarted
        expr: changes(process_start_time_seconds{job=~"queue-.*"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} 가 최근 15분 안에 재시작됐다 ({{ $value }}회)"
          impact: "배포가 아니라면 **커널 OOM Kill** 일 확률이 높다. 앱은 로그를 남길 틈이 없고, 그 인스턴스로 가던 요청은 전부 실패한다(2026-09-15 에 connection refused 17,085건)."
          action: "① 배포 중이면 정상이다 — 아니라면 계속한다 → ② 🔑 알람의 instance 는 주소(ip:port)라 컨테이너 이름이 아니다. 이름부터 찾는다: `docker ps -a --filter name=q-api --filter name=q-batch --filter name=q-consumer` (scrape 포트 9080/9083/9084=api 관리 포트 · 8081=batch · 8082=consumer). 그다음 `docker inspect <위에서 찾은 이름> | grep -E '\"OOMKilled\"|\"ExitCode\"'`. **true / 137이면 컨테이너 메모리 한도 초과로 커널이 죽인 것**이다 (🪤 `--format` 으로 Go 템플릿을 쓰지 마라 — 이 문장은 Prometheus 가 템플릿으로 렌더하므로 중괄호를 넣으면 **알람이 뜰 때 annotation 이 통째로 에러가 된다**. promtool 단위 테스트가 실제로 잡았다)(2026-09-15 5차에 실제로 났고 앱 로그는 0건이었다) → ③ OOM이면 `jvm_memory_committed_bytes` 합을 mem_limit과 대조한다. 넘긴 것이 **힙이 아니라 그 바깥**(메타스페이스·코드캐시·버퍼)일 수 있다 — 힙만 보고 '여유 있다'고 판정하지 마라 → ④ 반복되면 mem_limit을 올린다. app.yml의 2g는 '힙 × 2' 어림에서 왔고, 그 어림이 부하에서 깨진 것이 5차다"

      # 임계값 근거: **절반만 있다.**
      #   85% — 근거 없음(관례). 5차 OOM 직전 값은 안 남아 있다.
      #   2GiB — 근거 있음. infra/aws/app.yml의 `mem_limit: 2g`와 같은 값이다.
      #
      # 🔴 **이 식은 RSS가 아니다.** micrometer는 `process_resident_memory_bytes`를 안 준다
      #    (실측: 메트릭 220종에 없다). cgroup 사용량을 정확히 보려면 cAdvisor가 필요한데,
      #    컴포넌트를 하나 더 세울 만큼인지는 실측으로 정한다 — 그래서 우선 **근사치**로 간다.
      #    committed(힙+논힙) + direct 버퍼로 5차에서 넘친 것 대부분을 포착한다.
      #    🪤 **놓치는 것**: 플랫폼 스레드 네이티브 스택, JNI, 코드캐시 밖 네이티브 할당.
      #       즉 이 규칙이 조용한데 OOM이 나면 그때가 cAdvisor를 세울 때다.
      #
      # 🪤 2147483648은 **손으로 박은 상수**다. `infra/aws/app.yml`의 mem_limit을 바꾸면
      #    여기도 바꿔라 — 안 바꾸면 규칙이 조용히 틀린 기준으로 재고, 아무 테스트도 안 깨진다.
      - alert: JvmMemoryNearContainerLimit
        expr: |
          (
            sum by (instance) (jvm_memory_committed_bytes{job=~"queue-.*"})
            +
            sum by (instance) (jvm_buffer_memory_used_bytes{job=~"queue-.*", id="direct"})
          ) / 2147483648 > 0.85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} 의 JVM 커밋 메모리가 컨테이너 한도(2GiB)의 {{ $value | humanizePercentage }} — 컨테이너 메모리 한도 초과로 커널이 죽인 것 이 가까울 수 있다"
          impact: "컨테이너 한도에 닿으면 커널이 프로세스를 죽인다. **앱 로그 0건으로 사라진다** — 재시작 알람이 아니면 못 본다."
          action: "에스컬레이션 필요 — 한도를 올리려면 재배포가 필요하다. ① 수집: 힙과 그 바깥을 갈라 적는다. Prometheus 웹(SSH 터널 `-L 9390:localhost:9090` 후 http://localhost:9390/graph)에서 `sum by (area) (jvm_memory_committed_bytes{job=~\"queue-.*\"})` 를 조회한다. 🔑 판단: 합이 컨테이너 한도 2GiB(2147483648)의 **85% 미만이면** 이미 해소된 것이다. **95% 이상이면** 곧 커널이 죽이므로 즉시 깨워라 (5차에 넘긴 것은 힙 바깥(메타스페이스·코드캐시·버퍼)이었다). 어느 인스턴스인지도 적는다 → ② 임시 조치: 없다. 재시작하면 일시적으로 내려가지만 원인은 그대로이고 그 인스턴스의 요청이 끊긴다 → ③ 백엔드 담당에게 넘긴다. 넘길 것: 인스턴스 · 힙/힙 바깥(메타스페이스·코드캐시·버퍼) 값 · 컨테이너 한도(2GiB) · AppRestarted 동반 여부 ⚠️ 이 값은 실제 프로세스 메모리(RSS)가 아니라 근사치다. 이 알람이 조용한데 OOM 이 나면 cAdvisor 가 필요하다는 뜻이니 그것도 함께 적어라"
